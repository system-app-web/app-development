<body>
<header>
  <h1>📠 FAXアドレス帳</h1>
  <input class="search-box" id="searchBox" type="text" placeholder="名前・事業所を検索…" oninput="applyFilters()">
  <button class="btn-header" onclick="openKagami()">📄 FAXかがみ</button>
  <button class="btn-header" onclick="openModal('add-person')">👤 利用者 新規登録</button>
  <button class="btn-header" onclick="openModal('add-facility-global')">🏥 事業所 新規登録</button>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main">
    <div class="category-bar" id="categoryBar"></div>
    <div id="content"><div class="empty-msg">← 左から利用者を選ぶか、カテゴリで絞り込んでください</div></div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
  <div class="modal">
    <h3 id="modalTitle">新規登録</h3>
    <div class="modal-tabs" id="modalTabs" style="display:none">
      <button class="modal-tab active" id="tabExist" onclick="switchTab('exist')">既存から選ぶ</button>
      <button class="modal-tab" id="tabNew" onclick="switchTab('new')">新規入力</button>
    </div>
    <div id="panelExist" style="display:none">
      <div id="selectedCount" class="selected-count" style="margin-bottom:8px"></div>
      <input class="facility-search-box" id="facilitySearch" type="text" placeholder="事業所名・FAX番号で絞り込み…" oninput="filterFacilityList()">
      <div class="facility-check-list" id="facilityCheckList"></div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
        <button class="btn-save" onclick="saveExistingFacilities()">選択した事業所を追加</button>
      </div>
    </div>
    <div id="panelNew">
      <div class="form-row" id="rowName">
        <label>利用者名</label>
        <input id="fName">
      </div>
      <div id="rowFacilitySelect" style="display:none">
        <div style="font-size:11px;font-weight:700;color:#2d5a8e;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px">関係事業所（任意・複数選択可）</div>
        <div id="personCatFilter" style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px"></div>
        <input class="facility-search-box" id="personFacilitySearch" type="text" placeholder="事業所名・FAX番号で絞り込み…" oninput="filterPersonFacilityList()">
        <div class="facility-check-list" id="personFacilityList"></div>
        <div id="personSelectedCount" class="selected-count" style="margin-top:6px"></div>
      </div>
      <div id="rowFacilityFields">
        <div class="form-row">
          <label>事業所名（担当者名）</label>
          <input id="fFacility">
        </div>
        <div class="form-row">
          <label>FAX番号 ※要確認</label>
          <input id="fFax" oninput="validateFax()">
          <div class="hint" id="faxHint" style="display:none">⚠ FAX番号は数字のみで入力してください（間違い厳禁）</div>
        </div>
        <div class="form-row">
          <label>カテゴリ</label>
          <select id="fCategory">
            <option value="">-- 選択 --</option>
            <option>病院・薬局・歯科</option>
            <option>訪問看護</option>
            <option>保護課</option>
            <option>事業所</option>
          </select>
        </div>
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
        <button class="btn-save" onclick="saveEntry()">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="kagamiOverlay" onclick="closeKagamiOnOverlay(event)">
  <div class="kagami-modal">
    <div class="kagami-header">
      <h3>📄 FAXかがみ テンプレート</h3>
      <button class="btn-cancel" onclick="closeKagami()">閉じる</button>
    </div>
    <div class="kagami-body">
      <div class="kagami-list" id="kagamiList"></div>
      <div class="kagami-editor" id="kagamiEditor"><div class="kagami-empty">← テンプレートを選択してください</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function getDisplayName(n){if(!n)return'';const p=n.split(/[\s　]+/);return p.length>1?p.slice(1).join(' '):n;}
function getUniqueNames(){const seen=new Set();const dn=allData.filter(r=>{if(!r.name||seen.has(r.name))return false;seen.add(r.name);return true;}).map(r=>r.name);const saved=loadOrder();if(!saved)return dn;const ord=saved.filter(n=>dn.includes(n));dn.forEach(n=>{if(!ord.includes(n))ord.push(n);});return ord;}
function getCategories(){const c=new Set();allData.forEach(r=>{if(r.category)c.add(r.category);});return Array.from(c).sort();}
function catClass(c){if(!c)return'';if(c.includes('病院')||c.includes('歯科')||c.includes('薬局'))return'cat-病院';if(c.includes('訪問'))return'cat-訪問';if(c.includes('保護'))return'cat-保護';return'cat-事業';}
function escHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function renderSidebar(names){
  const sb=document.getElementById('sidebar');
  if(!names.length){sb.innerHTML='<div style="padding:20px;color:#a0aec0;font-size:13px">該当なし</div>';return;}
  let h=`<div class="sidebar-section">利用者 <span class="count-label">${names.length}名</span></div>`;
  names.forEach(name=>{
    const k=getDisplayName(name),a=name===selectedName?' active':'';
    h+=`<div class="name-item${a}" draggable="true" data-name="${escHtml(name)}" onclick="selectName(this.dataset.name)"><span class="kanji">${escHtml(k)}</span></div>`;
  });
  sb.innerHTML=h;initDrag();
}
let dragSrc=null;
function initDrag(){
  document.querySelectorAll('.name-item[draggable]').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragSrc=el;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');document.querySelectorAll('.name-item').forEach(i=>i.classList.remove('drag-over'));});
    el.addEventListener('dragover',e=>{e.preventDefault();document.querySelectorAll('.name-item').forEach(i=>i.classList.remove('drag-over'));if(el!==dragSrc)el.classList.add('drag-over');});
    el.addEventListener('drop',e=>{
      e.preventDefault();if(!dragSrc||dragSrc===el)return;
      const all=getUniqueNames(),fi=all.indexOf(dragSrc.dataset.name),ti=all.indexOf(el.dataset.name);
      if(fi<0||ti<0)return;all.splice(fi,1);all.splice(ti,0,dragSrc.dataset.name);saveOrder(all);render();
    });
  });
}
function renderCategoryBar(){
  const cats=getCategories();
  let h=`<button class="cat-btn${!selectedCategory?' active':''}" onclick="selectCategory(null)">すべて</button>`;
  cats.forEach(c=>{h+=`<button class="cat-btn${selectedCategory===c?' active':''}" onclick="selectCategory('${escHtml(c)}')">${escHtml(c)}</button>`;});
  document.getElementById('categoryBar').innerHTML=h;
}
function renderContent(){
  const content=document.getElementById('content');
  let rows=allData;
  if(selectedName)rows=rows.filter(r=>r.name===selectedName);
  if(selectedCategory)rows=rows.filter(r=>r.category===selectedCategory);
  const q=document.getElementById('searchBox').value.trim();
  if(q&&!selectedName)rows=rows.filter(r=>(r.name&&r.name.includes(q))||(r.facility&&r.facility.includes(q))||(r.fax&&r.fax.includes(q)));
  if(selectedName){
    const nl=getDisplayName(selectedName);
    let h=`<div class="action-bar"><h2>${escHtml(nl)} 様の関係事業所</h2><button class="btn-primary" onclick="openModal('add-facility')">＋ 事業所追加</button><button class="btn-danger" onclick="deletePerson()">利用者ごと削除</button></div>`;
    const f=rows.filter(r=>r.facility);
    if(!f.length){h+='<div class="empty-msg">事業所が登録されていません</div>';}
    else{
      h+=`<table class="facility-table"><thead><tr><th>事業所名（担当者名）</th><th>FAX番号</th><th>カテゴリ</th><th>操作</th></tr></thead><tbody>`;
      f.forEach(r=>{
        const gi=allData.indexOf(r);
        h+=`<tr><td>${escHtml(r.facility)}</td><td><span class="fax-number">${escHtml(r.fax)}</span></td><td><span class="cat-badge ${catClass(r.category)}">${escHtml(r.category)}</span></td><td style="white-space:nowrap;display:flex;gap:6px;align-items:center"><button class="copy-btn" onclick="copyFax(this,'${escHtml(r.fax)}')">コピー</button><button class="btn-edit" onclick="openModal('edit',${gi})">編集</button><button class="btn-danger" onclick="deleteRecord(${gi})">削除</button></td></tr>`;
      });
      h+='</tbody></table>';
    }
    content.innerHTML=h;
  }else if(selectedCategory||q){
    const f=rows.filter(r=>r.facility);
    const title=selectedCategory?`【${selectedCategory}】の事業所一覧`:`「${q}」の検索結果`;
    let h=`<div class="action-bar"><h2>${escHtml(title)} <span class="count-label">${f.length}件</span></h2></div>`;
    if(!f.length){h+='<div class="empty-msg">該当なし</div>';}
    else{
      h+=`<table class="facility-table"><thead><tr><th>利用者</th><th>事業所名（担当者名）</th><th>FAX番号</th><th>カテゴリ</th><th></th></tr></thead><tbody>`;
      f.forEach(r=>{h+=`<tr><td style="white-space:nowrap">${escHtml(getDisplayName(r.name))}</td><td>${escHtml(r.facility)}</td><td><span class="fax-number">${escHtml(r.fax)}</span></td><td><span class="cat-badge ${catClass(r.category)}">${escHtml(r.category)}</span></td><td><button class="copy-btn" onclick="copyFax(this,'${escHtml(r.fax)}')">コピー</button></td></tr>`;});
      h+='</tbody></table>';
    }
    content.innerHTML=h;
  }else{content.innerHTML='<div class="empty-msg">← 左から利用者を選ぶか、カテゴリで絞り込んでください</div>';}
}
function render(){
  const q=document.getElementById('searchBox').value.trim();
  let names=getUniqueNames();
  if(q&&!selectedName){const m=new Set(allData.filter(r=>(r.name&&r.name.includes(q))||(r.facility&&r.facility.includes(q))||(r.fax&&r.fax.includes(q))).map(r=>r.name).filter(Boolean));names=names.filter(n=>m.has(n));}
  renderSidebar(names);renderCategoryBar();renderContent();
}
function selectName(name){selectedName=selectedName===name?null:name;selectedCategory=null;document.getElementById('searchBox').value='';render();}
function selectCategory(c){selectedCategory=c;selectedName=null;render();}
function applyFilters(){selectedName=null;selectedCategory=null;render();}
function copyFax(btn,fax){navigator.clipboard.writeText(fax).then(()=>{btn.textContent='✓ コピー済';btn.classList.add('copied');setTimeout(()=>{btn.textContent='コピー';btn.classList.remove('copied');},2000);showToast('FAX番号 '+fax+' をコピーしました');});}

let modalMode=null;
function openModal(mode,idx){
  modalMode=mode;editIndex=idx!==undefined?idx:null;
  document.getElementById('faxHint').style.display='none';
  document.getElementById('modalTabs').style.display='none';
  document.getElementById('panelExist').style.display='none';
  document.getElementById('panelNew').style.display='block';
  document.getElementById('rowFacilitySelect').style.display='none';
  document.getElementById('rowFacilityFields').style.display='block';
  document.getElementById('rowName').style.display='block';
  if(mode==='edit'&&idx!=null){
    const r=allData[idx];
    document.getElementById('modalTitle').textContent='事業所を編集';
    document.getElementById('fName').value=r.name||'';document.getElementById('fFacility').value=r.facility||'';
    document.getElementById('fFax').value=r.fax||'';document.getElementById('fCategory').value=r.category||'';
    document.getElementById('fName').disabled=false;
  }else if(mode==='add-facility'){
    document.getElementById('modalTitle').textContent='事業所を追加';
    document.getElementById('fName').value=selectedName||'';document.getElementById('fFacility').value='';
    document.getElementById('fFax').value='';document.getElementById('fCategory').value='';
    document.getElementById('fName').disabled=!!selectedName;document.getElementById('rowName').style.display='none';
    const ex=getUniqueFacilities().filter(f=>!isAlreadyAdded(f.facility));
    if(ex.length>0){document.getElementById('modalTabs').style.display='flex';switchTab('exist');}
  }else if(mode==='add-facility-global'){
    document.getElementById('modalTitle').textContent='事業所 新規登録';
    document.getElementById('fName').value='';document.getElementById('fFacility').value='';
    document.getElementById('fFax').value='';document.getElementById('fCategory').value='';
    document.getElementById('rowName').style.display='none';
  }else{
    document.getElementById('modalTitle').textContent='利用者 新規登録';
    document.getElementById('fName').value='';document.getElementById('fName').disabled=false;
    document.getElementById('rowFacilityFields').style.display='none';
    document.getElementById('rowFacilitySelect').style.display='block';
    personCatSelected=null;document.getElementById('personFacilitySearch').value='';renderPersonCatFilter();renderPersonFacilityList('');
  }
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}
function closeModalOnOverlay(e){if(e.target===document.getElementById('modalOverlay'))closeModal();}
function switchTab(tab){
  document.getElementById('tabExist').classList.toggle('active',tab==='exist');
  document.getElementById('tabNew').classList.toggle('active',tab==='new');
  document.getElementById('panelExist').style.display=tab==='exist'?'block':'none';
  document.getElementById('panelNew').style.display=tab==='new'?'block':'none';
  if(tab==='exist'){document.getElementById('facilitySearch').value='';renderFacilityCheckList('');}
}
function getUniqueFacilities(){const seen=new Set();return allData.filter(r=>{if(!r.facility||seen.has(r.facility))return false;seen.add(r.facility);return true;});}
function isAlreadyAdded(f){return allData.some(r=>r.name===selectedName&&r.facility===f);}
function renderFacilityCheckList(q){
  const list=document.getElementById('facilityCheckList');
  let items=getUniqueFacilities().filter(f=>!isAlreadyAdded(f.facility));
  if(q)items=items.filter(f=>(f.facility&&f.facility.includes(q))||(f.fax&&f.fax.includes(q)));
  if(!items.length){list.innerHTML='<div class="no-result">該当なし</div>';updateSelectedCount();return;}
  list.innerHTML=items.map(f=>`<label class="facility-check-item"><input type="checkbox" class="fc-checkbox" data-facility="${escHtml(f.facility)}" data-fax="${escHtml(f.fax)}" data-category="${escHtml(f.category||'')}" onchange="updateSelectedCount()"><div><div class="fc-name">${escHtml(f.facility)}</div><div class="fc-fax">${escHtml(f.fax)}</div><div class="fc-cat">${escHtml(f.category||'')}</div></div></label>`).join('');
  updateSelectedCount();
}
function updateSelectedCount(){const n=document.querySelectorAll('.fc-checkbox:checked').length;document.getElementById('selectedCount').textContent=n>0?n+'件を選択中':'';}
function filterFacilityList(){renderFacilityCheckList(document.getElementById('facilitySearch').value.trim());}
let personCatSelected=null;
function renderPersonCatFilter(){
  const cats=Array.from(new Set(getUniqueFacilities().map(f=>f.category).filter(Boolean))).sort();
  let h='<button class="pcat-btn'+(personCatSelected===null?' pcat-active':'')+'" onclick="selectPersonCat(null)">すべて</button>';
  cats.forEach(c=>{h+='<button class="pcat-btn'+(personCatSelected===c?' pcat-active':'')+'" onclick="selectPersonCat(\''+escHtml(c)+'\')">'+escHtml(c)+'</button>';});
  document.getElementById('personCatFilter').innerHTML=h;
}
function selectPersonCat(cat){personCatSelected=cat;renderPersonCatFilter();renderPersonFacilityList(document.getElementById('personFacilitySearch').value.trim());}
function renderPersonFacilityList(q){
  const list=document.getElementById('personFacilityList');
  let items=getUniqueFacilities();
  if(personCatSelected)items=items.filter(f=>f.category===personCatSelected);
  if(q)items=items.filter(f=>(f.facility&&f.facility.includes(q))||(f.fax&&f.fax.includes(q)));
  if(!items.length){list.innerHTML='<div class="no-result">該当なし</div>';updatePersonSelectedCount();return;}
  list.innerHTML=items.map(f=>`<label class="facility-check-item"><input type="checkbox" class="pfc-checkbox" data-facility="${escHtml(f.facility)}" data-fax="${escHtml(f.fax)}" data-category="${escHtml(f.category||'')}" onchange="updatePersonSelectedCount()"><div><div class="fc-name">${escHtml(f.facility)}</div><div class="fc-fax">${escHtml(f.fax)}</div><div class="fc-cat">${escHtml(f.category||'')}</div></div></label>`).join('');
  updatePersonSelectedCount();
}
function filterPersonFacilityList(){renderPersonFacilityList(document.getElementById('personFacilitySearch').value.trim());}
function updatePersonSelectedCount(){const n=document.querySelectorAll('.pfc-checkbox:checked').length;document.getElementById('personSelectedCount').textContent=n>0?n+'件選択中':'';}
function saveExistingFacilities(){
  const cbs=document.querySelectorAll('.fc-checkbox:checked');
  if(!cbs.length){alert('事業所を1件以上選択してください');return;}
  cbs.forEach(cb=>allData.push({name:selectedName,facility:cb.dataset.facility,fax:cb.dataset.fax,category:cb.dataset.category}));
  saveData();closeModal();render();showToast(cbs.length+'件の事業所を追加しました');
}
function validateFax(){const v=document.getElementById('fFax').value;document.getElementById('faxHint').style.display=v&&!/^[\d-]+$/.test(v)?'block':'none';}
function saveEntry(){
  if(modalMode==='add-person'){
    const name=document.getElementById('fName').value.trim();
    if(!name){alert('利用者名を入力してください');return;}
    const cbs=document.querySelectorAll('.pfc-checkbox:checked');
    if(cbs.length>0){cbs.forEach(cb=>allData.push({name,facility:cb.dataset.facility,fax:cb.dataset.fax,category:cb.dataset.category}));}
    else{allData.push({name,facility:null,fax:null,category:null});}
    saveData();closeModal();selectedName=name;render();showToast('「'+getDisplayName(name)+'」さんを登録しました');return;
  }
  const nameEl=document.getElementById('rowName');
  const name=nameEl.style.display==='none'?(selectedName||''):document.getElementById('fName').value.trim();
  const facility=document.getElementById('fFacility').value.trim();
  const fax=document.getElementById('fFax').value.trim();
  const category=document.getElementById('fCategory').value;
  if(facility&&!fax){alert('FAX番号も入力してください');return;}
  if(fax&&!/^[\d-]+$/.test(fax)){if(!confirm('FAX番号に数字・ハイフン以外が含まれています。このまま保存しますか？'))return;}
  if(editIndex!==null){allData[editIndex]={name,facility,fax,category};}
  else{allData.push({name,facility,fax,category});}
  saveData();closeModal();if(name&&!selectedName)selectedName=name;render();
  showToast(editIndex!==null?'更新しました':'登録しました');
}
function deletePerson(){
  const label=getDisplayName(selectedName);
  if(!confirm('「'+label+'」さんと関係事業所をすべて削除しますか？'))return;
  const removed=allData.filter(r=>r.name===selectedName);
  const indices=allData.reduce((a,r,i)=>{if(r.name===selectedName)a.push(i);return a;},[]);
  lastDeleted={person:selectedName,records:removed,indices};
  allData=allData.filter(r=>r.name!==selectedName);
  selectedName=null;saveData();render();showToastWithUndo('「'+label+'」さんを削除しました');
}
function deleteRecord(idx){
  const r=allData[idx];
  if(!confirm('「'+(r.facility||r.name)+'」を削除しますか？'))return;
  lastDeleted={record:Object.assign({},r),idx};
  allData.splice(idx,1);saveData();render();showToastWithUndo('削除しました：'+(r.facility||r.name));
}
function undoDelete(){
  if(!lastDeleted)return;
  if(lastDeleted.person){lastDeleted.records.forEach((r,i)=>allData.splice(lastDeleted.indices[i],0,r));selectedName=lastDeleted.person;}
  else{allData.splice(lastDeleted.idx,0,lastDeleted.record);}
  lastDeleted=null;if(undoTimer){clearTimeout(undoTimer);undoTimer=null;}
  saveData();render();showToast('元に戻しました');
}
function showToast(msg){const t=document.getElementById('toast');t.innerHTML='<span>'+msg+'</span>';t.classList.add('show');if(undoTimer)clearTimeout(undoTimer);undoTimer=setTimeout(()=>t.classList.remove('show'),2500);}
function showToastWithUndo(msg){const t=document.getElementById('toast');t.innerHTML='<span>'+msg+'</span><button class="toast-undo" onclick="undoDelete()">元に戻す</button>';t.classList.add('show');if(undoTimer)clearTimeout(undoTimer);undoTimer=setTimeout(()=>{t.classList.remove('show');lastDeleted=null;},10000);}

const DEFAULT_TEMPLATES=[
  {id:'tpl_1',name:'提供票',body:'○○　御中\n担当　○○様\n\nお世話になっております。\n○○居宅介護支援事業所　○○です。\n\nサービス提供票・別表をお送りします。\n\nご確認のほど、よろしくお願いいたします。\n\n━━━━━━━━━━━━━━━━\n○○居宅介護支援事業所\nTEL：xxx-xxxx-xxxx\nFAX：xxx-xxxx-xxxx\n━━━━━━━━━━━━━━━━'},
  {id:'tpl_2',name:'照会',body:'○○　御中\n担当　○○様\n\nお世話になっております。\n○○居宅介護支援事業所　○○です。\n\n以下の件についてご照会申し上げます。\n\n【照会内容】\n\n\n【対象者】\n氏名：\n生年月日：\n\nご回答のほど、よろしくお願いいたします。\n\n━━━━━━━━━━━━━━━━\n○○居宅介護支援事業所\nTEL：xxx-xxxx-xxxx\nFAX：xxx-xxxx-xxxx\n━━━━━━━━━━━━━━━━'}
];
function loadTemplates(){try{const s=localStorage.getItem(TEMPLATE_KEY);if(s)return JSON.parse(s);}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));}
function saveTemplates(){localStorage.setItem(TEMPLATE_KEY,JSON.stringify(templates));}
let templates=loadTemplates();
let selectedTplId=null;
function openKagami(){document.getElementById('kagamiOverlay').classList.add('open');renderKagamiList();if(templates.length&&!selectedTplId)selectTemplate(templates[0].id);else renderKagamiEditor();}
function closeKagami(){document.getElementById('kagamiOverlay').classList.remove('open');}
function closeKagamiOnOverlay(e){if(e.target===document.getElementById('kagamiOverlay'))closeKagami();}
function renderKagamiList(){
  let h='';
  templates.forEach(t=>{h+='<div class="kagami-list-item'+(t.id===selectedTplId?' active':'')+'" onclick="selectTemplate(\''+t.id+'\')">'+escHtml(t.name)+'</div>';});
  h+='<div class="kagami-list-add" onclick="addNewTemplate()">＋ テンプレート追加</div>';
  document.getElementById('kagamiList').innerHTML=h;
}
function selectTemplate(id){selectedTplId=id;renderKagamiList();renderKagamiEditor();}
function renderKagamiEditor(){
  const ed=document.getElementById('kagamiEditor');
  const tpl=templates.find(t=>t.id===selectedTplId);
  if(!tpl){ed.innerHTML='<div class="kagami-empty">← テンプレートを選択してください</div>';return;}
  ed.innerHTML='<div><label style="font-size:12px;font-weight:700;color:#2d5a8e;display:block;margin-bottom:5px">テンプレート名</label><input class="tpl-name-input" id="tplName" value="'+escHtml(tpl.name)+'"></div>'
    +'<div style="flex:1;display:flex;flex-direction:column;gap:6px"><label style="font-size:12px;font-weight:700;color:#2d5a8e">文面（自由に編集できます）</label><textarea class="kagami-textarea" id="tplBody">'+escHtml(tpl.body)+'</textarea></div>'
    +'<div class="kagami-actions"><button class="btn-copy-kagami" id="copyKagamiBtn" onclick="copyKagami()">📋 文面をコピー</button><button class="btn-save-tpl" onclick="saveTemplate()">保存</button><button class="btn-del-tpl" onclick="deleteTemplate(\''+tpl.id+'\')">削除</button></div>';
}
function copyKagami(){navigator.clipboard.writeText(document.getElementById('tplBody').value).then(()=>{const btn=document.getElementById('copyKagamiBtn');btn.textContent='✓ コピーしました';btn.classList.add('copied');setTimeout(()=>{btn.textContent='📋 文面をコピー';btn.classList.remove('copied');},2000);showToast('かがみ文面をコピーしました');});}
function saveTemplate(){const name=document.getElementById('tplName').value.trim();if(!name){alert('テンプレート名を入力してください');return;}const tpl=templates.find(t=>t.id===selectedTplId);if(tpl){tpl.name=name;tpl.body=document.getElementById('tplBody').value;}saveTemplates();renderKagamiList();showToast('テンプレートを保存しました');}
function addNewTemplate(){const t={id:'tpl_'+Date.now(),name:'新しいテンプレート',body:''};templates.push(t);saveTemplates();selectedTplId=t.id;renderKagamiList();renderKagamiEditor();setTimeout(()=>document.getElementById('tplName').select(),50);}
function deleteTemplate(id){const tpl=templates.find(t=>t.id===id);if(!tpl||!confirm('「'+tpl.name+'」を削除しますか？'))return;templates=templates.filter(t=>t.id!==id);saveTemplates();selectedTplId=templates.length?templates[0].id:null;renderKagamiList();renderKagamiEditor();showToast('削除しました');}

render();
</script>
