<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PDF変換アプリ">
  <meta name="theme-color" content="#334155">
  <link rel="apple-touch-icon" href="./app-icon.png">
  <link rel="icon" type="image/png" href="./app-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>PDF変換アプリ</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #667085;
      --line: #d9e1e5;
      --paper: #fff;
      --bg: #e1e8ea;
      --accent: #08756d;
      --accent-dark: #064f4a;
      --soft-accent: #e1f1ee;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      padding: 40px 20px;
    }

    .app {
      width: min(900px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 0;
      overflow: hidden;
      border: 0;
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 18px 46px rgba(25, 43, 54, .16);
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: 26px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .header {
      display: grid;
      padding: 30px 34px 28px;
      border-bottom: 4px solid #d99827;
      background: #143b42;
    }

    .header-content {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .lead {
      color: #d6e5e3;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.6;
      margin-top: 1px;
    }

    .doc-type-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 26px 30px 10px;
    }

    .doc-type-heading {
      color: #34454d;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
    }

    .doc-type {
      display: inline-grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: auto;
      margin: 0 30px;
      padding: 6px;
      border: 0;
      border-radius: 7px;
      background: #e8edef;
    }

    .doc-type label {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 48px;
      border-radius: 5px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: #4d5d67;
      border: 1px solid #d5dfe2;
      background: #fff;
      box-shadow: 0 1px 2px rgba(28, 45, 54, .06);
      transition: background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;
    }

    .doc-type label:hover {
      border-color: #75bcb4;
      background: #eff9f7;
    }

    .doc-type input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .doc-type label:has(input:checked) {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 3px 7px rgba(8, 117, 109, .24);
    }

    .notice {
      margin: 18px 30px 0;
      border: 1px solid #f3cf82;
      border-radius: 6px;
      background: #fff9e9;
      color: #6f4a0b;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
    }

    .notice strong {
      color: #9a5d06;
      font-size: 15px;
    }

    .reset-btn {
      width: auto;
      height: 32px;
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid #b64739;
      border-radius: 5px;
      background: #b64739;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .reset-btn:hover {
      border-color: #96382d;
      background: #96382d;
      color: #fff;
    }

    .rotation-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin: 18px 30px 0;
      padding: 16px 0 0;
      border-top: 1px solid var(--line);
    }

    .rotation-tools.hidden {
      display: none;
    }

    .rotation-heading {
      min-width: 64px;
      color: #46535e;
      font-size: 14px;
      font-weight: 800;
    }

    .rotation-btn {
      width: auto;
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid #c6d2d7;
      border-radius: 5px;
      background: #fff;
      color: #40505d;
      font-size: 12px;
      font-weight: 800;
    }

    .rotation-btn.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .rotation-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .control-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
      margin: 16px 30px 0;
      color: #52606b;
      font-size: 14px;
      font-weight: 700;
    }

    .control-row.hidden {
      display: none;
    }

    .pencil-palette {
      margin: 18px 30px 0;
      padding: 14px;
      display: grid;
      gap: 10px;
      border: 1px solid #bcd5d1;
      border-radius: 7px;
      background: #f0f8f7;
    }

    .pencil-palette.hidden {
      display: none;
    }

    .pencil-palette-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pencil-palette-label {
      min-width: 46px;
      color: #40505d;
      font-size: 13px;
      font-weight: 800;
    }

    .pencil-tool,
    .pencil-action,
    .pencil-page-btn {
      width: auto;
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid #b9c8cd;
      border-radius: 5px;
      background: #fff;
      color: #40505d;
      font-size: 12px;
      font-weight: 800;
    }

    .pencil-tool.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .pencil-color {
      width: 28px;
      min-width: 28px;
      height: 28px;
      min-height: 28px;
      padding: 0;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px #9aacb2;
    }

    .pencil-color.active {
      box-shadow: 0 0 0 2px var(--accent);
    }

    .pencil-page-label {
      min-width: 58px;
      text-align: center;
      color: #40505d;
      font-size: 13px;
      font-weight: 800;
    }

    .pencil-page-control {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 30px 0;
    }

    .pencil-page-control.hidden {
      display: none;
    }

    .pencil-page-control:not(.hidden) + .drop {
      margin-top: 10px;
    }

    .pencil-editor {
      width: 100%;
      display: grid;
      place-items: center;
    }

    .pencil-canvas {
      display: block;
      max-width: 100%;
      max-height: 640px;
      border: 1px solid #9cacb2;
      background: #fff;
      box-shadow: 0 8px 22px rgba(24, 39, 49, .16);
      touch-action: none;
      cursor: crosshair;
    }

    .pencil-text-dialog {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(31, 41, 55, .38);
    }

    .pencil-text-dialog.hidden {
      display: none;
    }

    .pencil-text-dialog-panel {
      width: min(420px, 100%);
      padding: 16px;
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(24, 39, 49, .24);
    }

    .pencil-text-input {
      display: block;
      box-sizing: border-box;
      width: 100%;
      min-height: 150px;
      resize: vertical;
      padding: 10px;
      border: 1px solid #9aacb2;
      border-radius: 5px;
      color: #1f2937;
      font: 17px/1.65 "Yu Gothic UI", "Hiragino Kaku Gothic ProN", sans-serif;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .pencil-text-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    .pencil-text-dialog-button {
      width: auto;
      min-height: 36px;
      padding: 7px 13px;
      border: 1px solid var(--accent);
      border-radius: 5px;
      font-size: 13px;
    }

    .pencil-text-dialog-cancel {
      background: #fff;
      border-color: #b9c8cd;
      color: #40505d;
    }

    .contrast-options {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .contrast-btn,
    .size-btn {
      width: auto;
      min-height: 32px;
      min-width: 70px;
      padding: 6px 10px;
      border: 1px solid #c6d2d7;
      border-radius: 5px;
      background: #fff;
      color: #334155;
      font-size: 12px;
      font-weight: 800;
    }

    .contrast-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .size-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }

    .drop {
      min-height: 420px;
      margin: 26px 30px 0;
      border: 2px dashed #98afb4;
      border-radius: 7px;
      background: #f5f8f8;
      padding: 20px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
    }

    .drop.merge-preview {
      align-items: start;
      overflow-y: auto;
      gap: 14px;
    }

    .merge-preview-content {
      width: 100%;
      display: grid;
      gap: 14px;
      justify-items: center;
    }

    .merge-preview-grid {
      width: 100%;
      display: flex;
      flex-wrap: nowrap;
      justify-content: flex-start;
      overflow-x: auto;
      padding: 4px 2px 12px;
      gap: 14px;
    }

    .merge-preview-item {
      flex: 0 0 170px;
      min-width: 0;
      display: grid;
      gap: 6px;
      justify-items: center;
      color: #475569;
      font-size: 12px;
      font-weight: 800;
    }

    .merge-preview-item .sheet,
    .merge-preview-item .sheet.landscape {
      width: 100%;
      max-width: 170px;
    }

    .merge-preview-item > div:last-child {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .merge-summary {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.6;
    }

    .drop.dragover {
      border-color: var(--accent);
      background: var(--soft-accent);
      color: #075f59;
    }

    .placeholder {
      color: #53626d;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.8;
    }

    .loading {
      display: grid;
      gap: 14px;
      justify-items: center;
      color: #334155;
      font-size: 18px;
      font-weight: 800;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 5px solid #cbd5e1;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .loading-dots::after {
      content: "";
      animation: dots 1.2s steps(4, end) infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%, 100% { content: "..."; }
    }

    .sheet {
      width: min(100%, 594px);
      aspect-ratio: 210 / 297;
      background: var(--paper);
      box-shadow: 0 10px 28px rgba(24, 39, 49, .18);
      position: relative;
    }

    .sheet.landscape {
      width: min(100%, 760px);
      aspect-ratio: 297 / 210;
    }

    .sheet canvas {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      max-width: calc(100% - 24px);
      max-height: calc(100% - 24px);
    }

    .merge-page {
      width: 100%;
      display: grid;
      gap: 6px;
      justify-items: center;
    }

    .merge-page-number {
      width: 28px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: #e5e7eb;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
    }

    button {
      width: 100%;
      appearance: none;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      padding: 15px;
      cursor: pointer;
      transition: background .15s ease;
    }

    #saveBtn,
    #printBtn {
      width: auto;
      margin-left: 30px;
      margin-right: 30px;
    }

    #saveBtn {
      margin-top: 26px;
    }

    #printBtn {
      margin-top: 10px;
    }

    #saveBtn:not(:disabled):hover {
      background: var(--accent-dark);
    }

    button:disabled {
      background: #b8b8b8;
      cursor: not-allowed;
    }

    .print-btn {
      background: #2563eb;
    }

    .print-btn:not(:disabled):hover {
      background: #1d4ed8;
    }

    .status {
      min-height: 54px;
      margin: 0 30px;
      padding: 14px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .print-stage {
      display: none;
    }

    @media print {
      body { display: block; padding: 0; background: #fff; }
      body > .app { display: none; }
      .print-stage { display: block; }
      .print-stage .page { break-after: page; page-break-after: always; }
      .print-stage .page:last-child { break-after: auto; page-break-after: auto; }
      .print-stage canvas { display: block; width: 100%; height: 100%; }
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .app { border-radius: 7px; }
      .header { padding: 24px 20px 22px; }
      .doc-type-toolbar { margin: 20px 20px 8px; }
      .doc-type { margin: 0 20px; gap: 4px; grid-template-columns: 1fr 1fr; }
      .doc-type label { min-height: 46px; font-size: 13px; line-height: 1.3; text-align: center; }
      .notice, .rotation-tools, .control-row, .pencil-palette, .pencil-page-control, .drop, .status, #saveBtn, #printBtn { margin-left: 20px; margin-right: 20px; }
      .drop { min-height: 340px; padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-content">
        <h1>PDF変換アプリ</h1>
        <div class="lead">介護保険証、負担割合証などをちょうどいいサイズに変換し、中央に揃えてくれるアプリです。<br>複数のPDF書類を一つにまとめる結合機能付き。</div>
      </div>
    </div>

    <div class="doc-type-toolbar">
      <div class="doc-type-heading">処理を選ぶ</div>
      <button id="resetBtn" class="reset-btn" type="button" title="読み込み内容をリセット">リセット</button>
    </div>
    <div class="doc-type" aria-label="処理を選ぶ">
      <label><input type="radio" name="docType" value="merge" checked><span>PDF結合</span></label>
      <label><input type="radio" name="docType" value="care"><span>介護保険証（横印刷）</span></label>
      <label><input type="radio" name="docType" value="burden"><span>負担割合証（縦印刷）</span></label>
      <label><input type="radio" name="docType" value="pencil"><span>PDFペンシル</span></label>
    </div>

    <div class="notice"><strong>変換機能は白黒のみ対応です</strong><br>カラー・濃いグレースケールの書類は黒くなったり、影が出たりする場合があります。PDF結合は元のPDFをそのまま結合します。</div>

    <div class="rotation-tools" aria-label="原稿の回転">
      <span class="rotation-heading">回転</span>
      <button id="rotateRightBtn" class="rotation-btn" type="button" title="右回転">右回転</button>
      <button id="rotateLeftBtn" class="rotation-btn" type="button" title="左回転">左回転</button>
    </div>

    <div class="control-row contrast">
      <span>黒の濃さ</span>
      <div class="contrast-options">
        <button class="contrast-btn" type="button" data-threshold="115">薄い</button>
        <button class="contrast-btn active" type="button" data-threshold="172">標準</button>
        <button class="contrast-btn" type="button" data-threshold="190">濃い</button>
        <button class="contrast-btn" type="button" data-threshold="235">最濃</button>
      </div>
    </div>

    <div class="control-row size-control">
      <span>サイズ</span>
      <div class="contrast-options">
        <button class="size-btn" type="button" data-scale="0.9">小</button>
        <button class="size-btn active" type="button" data-scale="1">標準</button>
        <button class="size-btn" type="button" data-scale="1.12">大</button>
      </div>
    </div>

    <div id="pencilPalette" class="pencil-palette hidden" aria-label="PDFペンシルのパレット">
      <div class="pencil-palette-row">
        <span class="pencil-palette-label">ツール</span>
        <button class="pencil-tool active" type="button" data-pencil-tool="text">文字入力</button>
        <button class="pencil-tool" type="button" data-pencil-tool="pen">ペン</button>
        <button class="pencil-tool" type="button" data-pencil-tool="blackCircle">見え消し（黒丸）</button>
        <button class="pencil-tool" type="button" data-pencil-tool="blackout">黒塗り四角</button>
        <button class="pencil-tool" type="button" data-pencil-tool="whiteout">白塗り四角</button>
        <button class="pencil-tool" type="button" data-pencil-tool="rect">四角枠</button>
      </div>
      <div class="pencil-palette-row">
        <span class="pencil-palette-label">色</span>
        <button class="pencil-color active" type="button" data-pencil-color="#111827" style="background:#111827" title="黒"></button>
        <button class="pencil-color" type="button" data-pencil-color="#ef4444" style="background:#ef4444" title="赤"></button>
        <button class="pencil-color" type="button" data-pencil-color="#1d4ed8" style="background:#1d4ed8" title="青"></button>
        <button class="pencil-color" type="button" data-pencil-color="#16a34a" style="background:#16a34a" title="緑"></button>
        <button class="pencil-color" type="button" data-pencil-color="#eab308" style="background:#eab308" title="黄"></button>
        <button class="pencil-color" type="button" data-pencil-color="#f59e0b" style="background:#f59e0b" title="オレンジ"></button>
        <button class="pencil-color" type="button" data-pencil-color="#7c3aed" style="background:#7c3aed" title="紫"></button>
        <button class="pencil-color" type="button" data-pencil-color="#ffffff" style="background:#ffffff" title="白"></button>
        <button id="pencilUndoBtn" class="pencil-action" type="button">元に戻す</button>
        <button id="pencilClearBtn" class="pencil-action" type="button">このページを消去</button>
      </div>
    </div>

    <button id="saveBtn" type="button" disabled>PDF保存</button>
    <button id="printBtn" class="print-btn" type="button" disabled>印刷（FAX送信）</button>
    <div id="pencilPageControl" class="pencil-page-control hidden" aria-label="PDFペンシルのページ切替">
      <button id="pencilPreviousBtn" class="pencil-page-btn" type="button">前へ</button>
      <span id="pencilPageLabel" class="pencil-page-label">1 / 1</span>
      <button id="pencilNextBtn" class="pencil-page-btn" type="button">次へ</button>
    </div>

    <div id="drop" class="drop">
      <div id="placeholder" class="placeholder">
        白黒の写真またはPDFを<br>ここにドラッグ
      </div>
    </div>

    <div id="status" class="status">複数のPDFをドラッグすると、元のページをそのまま1つのPDFに結合します。</div>
  </div>

  <div id="pencilTextDialog" class="pencil-text-dialog hidden" role="dialog" aria-modal="true" aria-label="文字入力">
    <div class="pencil-text-dialog-panel">
      <textarea id="pencilTextInput" class="pencil-text-input" rows="5" spellcheck="false" aria-label="入力する文字"></textarea>
      <div class="pencil-text-dialog-actions">
        <button id="pencilTextCancelBtn" class="pencil-text-dialog-button pencil-text-dialog-cancel" type="button">キャンセル</button>
        <button id="pencilTextSaveBtn" class="pencil-text-dialog-button" type="button">入力</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
    import { PDFDocument } from "https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm";
    import { createWorker } from "https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/+esm";

    const A4 = { wMm: 210, hMm: 297, wPt: 595.28, hPt: 841.89 };
    const DPI = 300;
    const PRINT_DPI = 200;
    const MM_TO_PX = DPI / 25.4;
    const originalSizes = {
      portrait: { wMm: 91, hMm: 128 },
      landscape: { wMm: 128, hMm: 91 }
    };

    const drop = document.getElementById("drop");
    const placeholder = document.getElementById("placeholder");
    const saveBtn = document.getElementById("saveBtn");
    const printBtn = document.getElementById("printBtn");
    const resetBtn = document.getElementById("resetBtn");
    const rotateLeftBtn = document.getElementById("rotateLeftBtn");
    const rotateRightBtn = document.getElementById("rotateRightBtn");
    const pencilPalette = document.getElementById("pencilPalette");
    const pencilPageControl = document.getElementById("pencilPageControl");
    const pencilToolButtons = Array.from(document.querySelectorAll(".pencil-tool"));
    const pencilColorButtons = Array.from(document.querySelectorAll(".pencil-color"));
    const pencilUndoBtn = document.getElementById("pencilUndoBtn");
    const pencilClearBtn = document.getElementById("pencilClearBtn");
    const pencilPreviousBtn = document.getElementById("pencilPreviousBtn");
    const pencilNextBtn = document.getElementById("pencilNextBtn");
    const pencilPageLabel = document.getElementById("pencilPageLabel");
    const pencilTextDialog = document.getElementById("pencilTextDialog");
    const pencilTextInput = document.getElementById("pencilTextInput");
    const pencilTextCancelBtn = document.getElementById("pencilTextCancelBtn");
    const pencilTextSaveBtn = document.getElementById("pencilTextSaveBtn");
    const contrastButtons = Array.from(document.querySelectorAll(".contrast-btn"));
    const sizeButtons = Array.from(document.querySelectorAll(".size-btn"));
    const statusEl = document.getElementById("status");
    let loadedCanvases = [];
    let sourceCanvases = [];
    let outputCanvases = [];
    let pageRotationCorrections = [];
    let orientationDetectionFailed = false;
    let mergeFiles = [];
    let mergePageCount = 0;
    let mergePreviewCanvases = [];
    let pencilAnnotations = [];
    let pencilCurrentPageIndex = 0;
    let pencilTool = "text";
    let pencilColor = "#111827";
    let pencilDraft = null;
    let pencilSelection = null;
    let pencilResize = null;
    let pencilMove = null;
    let pencilTextSubmit = null;
    let outputDirectory = null;
    let blackThreshold = 172;
    let sizeScale = 1;
    let orientationWorkerPromise = null;
    const manualOrientationDirections = { merge: 0, care: 0, burden: 0, pencil: 0 };
    const manualOrientationEnabled = { merge: false, care: false, burden: false, pencil: false };
    const manualUpsideDown = { merge: false, care: false, burden: false, pencil: false };
    const modeStates = {
      merge: emptyModeState(),
      care: emptyModeState(),
      burden: emptyModeState(),
      pencil: emptyModeState()
    };
    let currentDocType = "merge";

    const setStatus = (text) => { statusEl.textContent = text; };
    const selectedDocType = () => document.querySelector("input[name='docType']:checked").value;
    const selectedOrientation = () => selectedDocType() === "care" ? "landscape" : "portrait";
    const isMergeMode = () => selectedDocType() === "merge";
    const isPencilMode = () => selectedDocType() === "pencil";

    document.querySelectorAll("input[name='docType']").forEach((input) => {
      input.addEventListener("change", () => {
        saveModeState(currentDocType);
        currentDocType = selectedDocType();
        updateRotationButtons();
        updateControlsVisibility();
        loadModeState(currentDocType);
      });
    });

    rotateLeftBtn.addEventListener("click", () => {
      setManualOrientation(-90);
    });

    rotateRightBtn.addEventListener("click", () => {
      setManualOrientation(90);
    });

    resetBtn.addEventListener("click", () => {
      resetLoadedFiles();
    });

    contrastButtons.forEach((button) => {
      button.addEventListener("click", () => {
        blackThreshold = Number(button.dataset.threshold);
        updateContrastButtons();
        updateContrastPreview();
        saveModeState(currentDocType);
      });
    });

    sizeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        sizeScale = Number(button.dataset.scale);
        updateSizeButtons();
        if (outputCanvases.length) showPreview();
        saveModeState(currentDocType);
      });
    });

    pencilToolButtons.forEach((button) => {
      button.addEventListener("click", () => {
        pencilTool = button.dataset.pencilTool;
        updatePencilPalette();
      });
    });

    pencilColorButtons.forEach((button) => {
      button.addEventListener("click", () => {
        pencilColor = button.dataset.pencilColor;
        updatePencilPalette();
      });
    });

    pencilUndoBtn.addEventListener("click", () => {
      undoPencilAnnotation();
    });

    document.addEventListener("keydown", (event) => {
      if (event.target === pencilTextInput) return;
      if (!isPencilMode() || event.key.toLowerCase() !== "z" || (!event.ctrlKey && !event.metaKey)) return;
      if (undoPencilAnnotation()) event.preventDefault();
    });

    pencilTextSaveBtn.addEventListener("click", () => {
      const text = pencilTextInput.value;
      if (!text.trim() || !pencilTextSubmit) return;
      const submit = pencilTextSubmit;
      closePencilTextEditor();
      submit(text);
    });

    pencilTextCancelBtn.addEventListener("click", () => {
      closePencilTextEditor();
    });

    pencilTextInput.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closePencilTextEditor();
    });

    pencilClearBtn.addEventListener("click", () => {
      if (!pencilAnnotations[pencilCurrentPageIndex]?.length) return;
      pencilAnnotations[pencilCurrentPageIndex] = [];
      pencilSelection = null;
      refreshPencilOutput();
      showPencilEditor();
      saveModeState(currentDocType);
    });

    pencilPreviousBtn.addEventListener("click", () => {
      if (pencilCurrentPageIndex <= 0) return;
      pencilCurrentPageIndex -= 1;
      pencilSelection = null;
      pencilResize = null;
      pencilMove = null;
      showPencilEditor();
      saveModeState(currentDocType);
    });

    pencilNextBtn.addEventListener("click", () => {
      if (pencilCurrentPageIndex >= loadedCanvases.length - 1) return;
      pencilCurrentPageIndex += 1;
      pencilSelection = null;
      pencilResize = null;
      pencilMove = null;
      showPencilEditor();
      saveModeState(currentDocType);
    });

    function undoPencilAnnotation() {
      const annotations = pencilAnnotations[pencilCurrentPageIndex];
      if (!annotations?.length) return false;
      annotations.pop();
      pencilSelection = null;
      pencilResize = null;
      pencilMove = null;
      refreshPencilOutput();
      showPencilEditor();
      saveModeState(currentDocType);
      return true;
    }

    function openPencilTextEditor(initialText, onSubmit) {
      pencilTextSubmit = onSubmit;
      pencilTextInput.value = initialText;
      pencilTextDialog.classList.remove("hidden");
      requestAnimationFrame(() => {
        pencilTextInput.focus();
        pencilTextInput.setSelectionRange(pencilTextInput.value.length, pencilTextInput.value.length);
      });
    }

    function closePencilTextEditor() {
      pencilTextDialog.classList.add("hidden");
      pencilTextSubmit = null;
    }

    async function updateContrastPreview() {
      if (isMergeMode() || isPencilMode()) return;
      showLoading();
      await nextFrame();
      if (!sourceCanvases.length && loadedCanvases.length) rebuildForCurrentMode();
      if (!sourceCanvases.length) return;
      refreshOutputCanvases();
      showPreview();
    }

    function nextFrame() {
      return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    async function getOrientationWorker() {
      if (!orientationWorkerPromise) {
        orientationWorkerPromise = createWorker("osd", 0, {
          legacyCore: true,
          legacyLang: true
        });
      }
      return orientationWorkerPromise;
    }

    function makeOrientationPreview(canvas) {
      const maxSide = 1200;
      const scale = Math.min(1, maxSide / Math.max(canvas.width, canvas.height));
      if (scale === 1) return canvas;
      const preview = document.createElement("canvas");
      preview.width = Math.round(canvas.width * scale);
      preview.height = Math.round(canvas.height * scale);
      preview.getContext("2d").drawImage(canvas, 0, 0, preview.width, preview.height);
      return preview;
    }

    async function detectPageRotationCorrections(canvases, fileName) {
      const worker = await getOrientationWorker();
      const corrections = [];
      for (let index = 0; index < canvases.length; index++) {
        setStatus(`${fileName} ${index + 1}/${canvases.length}ページの向きを自動判定中です。`);
        // First apply the established landscape baseline. OSD only decides whether it is upside down.
        const baseline = normalizeOrientation(cropDocument(canvases[index]));
        const { data } = await worker.detect(makeOrientationPreview(baseline));
        const orientation = data.orientation_degrees ?? 0;
        const confidence = data.orientation_confidence ?? 0;
        corrections.push(orientation === 180 && confidence >= 8 ? 180 : 0);
        await nextFrame();
      }
      return corrections;
    }

    updateRotationButtons();
    updateControlsVisibility();
    updateContrastButtons();
    updateSizeButtons();

    ["dragenter", "dragover"].forEach((name) => {
      drop.addEventListener(name, (event) => {
        event.preventDefault();
        drop.classList.add("dragover");
      });
    });

    ["dragleave", "drop"].forEach((name) => {
      drop.addEventListener(name, () => drop.classList.remove("dragover"));
    });

    drop.addEventListener("drop", async (event) => {
      event.preventDefault();
      const files = Array.from(event.dataTransfer.files || []);
      if (!files.length) return;
      await loadFiles(files);
    });

    saveBtn.addEventListener("click", async () => {
      if (isMergeMode() ? !mergeFiles.length : !outputCanvases.length) return;
      setActionButtonsDisabled(true);
      try {
        if (isMergeMode()) {
          await saveSingleBlob(await buildMergedPdfBlob(mergeFiles), "PDF結合.pdf");
          setStatus("PDFを結合して保存しました。");
          return;
        }
        if (isPencilMode()) {
          await saveSingleBlob(buildPencilPdfBlob(outputCanvases), "PDFペンシル.pdf");
          setStatus("書き込み済みPDFを保存しました。");
          return;
        }
        if (outputCanvases.length > 1 && window.showDirectoryPicker) {
          if (!outputDirectory || !(await canWriteToDirectory(outputDirectory))) {
            outputDirectory = await window.showDirectoryPicker({
              id: "pdf-converter-output",
              mode: "readwrite",
              startIn: "desktop"
            });
          }
          for (let index = 0; index < outputCanvases.length; index++) {
            setStatus(`${index + 1}/${outputCanvases.length}件目を保存中です。`);
            const handle = await outputDirectory.getFileHandle(buildSuggestedName(index), { create: true });
            const writable = await handle.createWritable();
            await writable.write(buildPdfBlob(outputCanvases[index]));
            await writable.close();
          }
          setStatus(`${outputCanvases.length}件を同じフォルダに保存しました。`);
          return;
        }
        if (window.showSaveFilePicker) {
          await saveSingleBlob(buildPdfBlob(outputCanvases[0]), buildSuggestedName(0));
          setStatus("保存しました。");
          return;
        }
        outputCanvases.forEach((canvas, index) => {
          const url = URL.createObjectURL(buildPdfBlob(canvas));
          const link = document.createElement("a");
          link.href = url;
          link.download = buildSuggestedName(index);
          link.click();
          URL.revokeObjectURL(url);
        });
        setStatus(`${outputCanvases.length}件をダウンロード保存しました。`);
      } catch (error) {
        console.error(error);
        setStatus("保存を中止しました。");
      } finally {
        setActionButtonsDisabled(false);
      }
    });

    printBtn.addEventListener("click", async () => {
      if (isMergeMode() ? !mergeFiles.length : !outputCanvases.length) return;
      setActionButtonsDisabled(true);
      try {
        if (isMergeMode()) {
          await printMergedPdfBlob(await buildMergedPdfBlob(mergeFiles));
        } else if (isPencilMode()) {
          printCanvasesInCurrentWindow(outputCanvases, buildMergedPageCanvas);
        } else {
          printCanvasesInCurrentWindow(outputCanvases, buildA4PageCanvas);
        }
        setStatus("印刷ダイアログを開いています。");
      } catch (error) {
        console.error(error);
        setStatus("印刷画面を開けませんでした。");
      } finally {
        setActionButtonsDisabled(false);
      }
    });

    function buildSuggestedName(index) {
      if (isPencilMode()) return "PDFペンシル.pdf";
      return outputCanvases.length === 1 ? "PDF変換.pdf" : `PDF変換_${index + 1}.pdf`;
    }

    async function saveSingleBlob(blob, suggestedName) {
      if (window.showSaveFilePicker) {
        const handle = await window.showSaveFilePicker({
          id: "pdf-converter-output",
          suggestedName,
          startIn: "desktop",
          types: [{ description: "PDF", accept: { "application/pdf": [".pdf"] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return;
      }
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = suggestedName;
      link.click();
      URL.revokeObjectURL(url);
    }

    function setActionButtonsDisabled(disabled) {
      saveBtn.disabled = disabled;
      printBtn.disabled = disabled;
    }

    function updateControlsVisibility() {
      const hideConversionControls = isMergeMode() || isPencilMode();
      document.querySelector(".contrast").classList.toggle("hidden", hideConversionControls);
      document.querySelector(".size-control").classList.toggle("hidden", hideConversionControls);
      pencilPalette.classList.toggle("hidden", !isPencilMode());
      pencilPageControl.classList.toggle("hidden", !isPencilMode());
      if (isPencilMode()) updatePencilPalette();
    }

    function updateRotationButtons() {
      const type = selectedDocType();
      document.querySelector(".rotation-tools").classList.toggle("hidden", isMergeMode() || isPencilMode());
      rotateLeftBtn.classList.toggle("active", manualOrientationEnabled[type] && manualOrientationDirections[type] === 270);
      rotateRightBtn.classList.toggle("active", manualOrientationEnabled[type] && manualOrientationDirections[type] === 90);
    }

    function setManualOrientation(degrees) {
      const type = selectedDocType();
      manualOrientationEnabled[type] = true;
      manualOrientationDirections[type] = (manualOrientationDirections[type] + degrees + 360) % 360;
      manualUpsideDown[type] = false;
      rebuildForManualOrientation();
    }

    function rebuildForManualOrientation() {
      updateRotationButtons();
      if (!loadedCanvases.length || isMergeMode() || isPencilMode()) return;
      setActionButtonsDisabled(true);
      showLoading();
      requestAnimationFrame(() => {
        rebuildForCurrentMode();
        showPreview();
        saveModeState(currentDocType);
        setActionButtonsDisabled(false);
        setStatus(`${outputCanvases.length}ページ分の向きを補正しました。`);
      });
    }

    function updateContrastButtons() {
      contrastButtons.forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.threshold) === blackThreshold);
      });
    }

    function updateSizeButtons() {
      sizeButtons.forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.scale) === sizeScale);
      });
    }

    function resetLoadedFiles() {
      const type = selectedDocType();
      loadedCanvases = [];
      sourceCanvases = [];
      outputCanvases = [];
      pageRotationCorrections = [];
      orientationDetectionFailed = false;
      mergeFiles = [];
      mergePageCount = 0;
      mergePreviewCanvases = [];
      pencilAnnotations = [];
      pencilCurrentPageIndex = 0;
      pencilDraft = null;
      pencilSelection = null;
      pencilResize = null;
      pencilMove = null;
      manualOrientationDirections[type] = 0;
      manualOrientationEnabled[type] = false;
      manualUpsideDown[type] = false;
      setActionButtonsDisabled(true);
      showPlaceholder();
      updateRotationButtons();
      updateControlsVisibility();
      setStatus(modeStatusText());
      saveModeState(currentDocType);
    }

    function emptyModeState() {
      return {
        loadedCanvases: [],
        sourceCanvases: [],
        outputCanvases: [],
        pageRotationCorrections: [],
        orientationDetectionFailed: false,
        mergeFiles: [],
        mergePageCount: 0,
        mergePreviewCanvases: [],
        pencilAnnotations: [],
        pencilCurrentPageIndex: 0,
        blackThreshold: 172,
        sizeScale: 1
      };
    }

    function saveModeState(type) {
      modeStates[type] = {
        loadedCanvases: [...loadedCanvases],
        sourceCanvases: [...sourceCanvases],
        outputCanvases: [...outputCanvases],
        pageRotationCorrections: [...pageRotationCorrections],
        orientationDetectionFailed,
        mergeFiles: [...mergeFiles],
        mergePageCount,
        mergePreviewCanvases: [...mergePreviewCanvases],
        pencilAnnotations: clonePencilAnnotations(pencilAnnotations),
        pencilCurrentPageIndex,
        blackThreshold,
        sizeScale
      };
    }

    function loadModeState(type) {
      const state = modeStates[type] || emptyModeState();
      loadedCanvases = [...state.loadedCanvases];
      sourceCanvases = [...state.sourceCanvases];
      outputCanvases = [...state.outputCanvases];
      pageRotationCorrections = [...state.pageRotationCorrections];
      orientationDetectionFailed = state.orientationDetectionFailed;
      mergeFiles = [...state.mergeFiles];
      mergePageCount = state.mergePageCount;
      mergePreviewCanvases = [...(state.mergePreviewCanvases || [])];
      pencilAnnotations = clonePencilAnnotations(state.pencilAnnotations || []);
      pencilCurrentPageIndex = Math.min(state.pencilCurrentPageIndex || 0, Math.max(0, loadedCanvases.length - 1));
      pencilDraft = null;
      pencilSelection = null;
      pencilResize = null;
      pencilMove = null;
      blackThreshold = state.blackThreshold;
      sizeScale = state.sizeScale;
      updateContrastButtons();
      updateSizeButtons();
      updateRotationButtons();
      const hasOutput = isMergeMode() ? mergeFiles.length : outputCanvases.length;
      setActionButtonsDisabled(!hasOutput);
      if (hasOutput) {
        if (isMergeMode()) showMergeSummary();
        else if (isPencilMode()) showPencilEditor();
        else showPreview();
        setStatus(isMergeMode()
          ? `${mergeFiles.length}件・${mergePageCount}ページ分のPDF結合準備が完了しました。`
          : isPencilMode()
            ? `${outputCanvases.length}ページ分のPDFを編集できます。`
          : `${outputCanvases.length}ページ分の切り抜きと白黒変換が完了しました。`);
      } else {
        showPlaceholder();
        setStatus(modeStatusText());
      }
    }

    function modeStatusText() {
      if (isMergeMode()) return "複数のPDFをドラッグすると、1つのPDFに結合します。";
      if (isPencilMode()) return "PDFをドラッグすると、文字や図形を書き込めます。";
      return "A4白背景の中央に配置します。出力は白黒PDFのみです。";
    }

    async function canWriteToDirectory(directory) {
      const options = { mode: "readwrite" };
      if ((await directory.queryPermission(options)) === "granted") return true;
      return (await directory.requestPermission(options)) === "granted";
    }

    async function loadFiles(files) {
      setStatus(`${files.length}件を読み込み中です。`);
      showLoading();
      setActionButtonsDisabled(true);
      if (!isMergeMode()) {
        loadedCanvases = [];
        sourceCanvases = [];
        outputCanvases = [];
        pageRotationCorrections = [];
        orientationDetectionFailed = false;
      }
      try {
        if (isMergeMode()) {
          for (const file of files) {
            if (!(file.type === "application/pdf" || /\.pdf$/i.test(file.name))) {
              throw new Error("merge mode accepts only PDF files");
            }
            const sourcePdf = await PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
            const pageCount = sourcePdf.getPageCount();
            mergeFiles.push(file);
            mergePageCount += pageCount;
            try {
              await appendMergePreviews(file, mergeFiles.length);
            } catch (error) {
              console.warn("Failed to render merge preview.", error);
            }
            setStatus(`${mergeFiles.length}件・${mergePageCount}ページ分を確認中です。`);
            await nextFrame();
          }
          saveModeState(currentDocType);
          showMergeSummary();
          setActionButtonsDisabled(false);
          setStatus(`${mergeFiles.length}件・${mergePageCount}ページ分のPDF結合準備が完了しました。`);
          return;
        }
        if (isPencilMode()) {
          for (const file of files) {
            if (!(file.type === "application/pdf" || /\.pdf$/i.test(file.name))) {
              throw new Error("pencil mode accepts only PDF files");
            }
            loadedCanvases.push(...await renderPdfPages(file));
          }
          pencilAnnotations = loadedCanvases.map(() => []);
          pencilCurrentPageIndex = 0;
          pencilSelection = null;
          pencilResize = null;
          pencilMove = null;
          refreshPencilOutput();
          saveModeState(currentDocType);
          showPencilEditor();
          setActionButtonsDisabled(false);
          setStatus(`${outputCanvases.length}ページ分のPDFを編集できます。`);
          return;
        }
        for (const file of files) {
          const sources = file.type === "application/pdf" || /\.pdf$/i.test(file.name)
            ? await renderPdfPages(file)
            : [await renderImage(file)];
          let corrections = sources.map(() => 0);
          if (selectedDocType() === "care") {
            try {
              corrections = await detectPageRotationCorrections(sources, file.name);
            } catch (error) {
              console.warn("Failed to detect document orientation.", error);
              orientationWorkerPromise = null;
              orientationDetectionFailed = true;
            }
          }
          loadedCanvases.push(...sources);
          pageRotationCorrections.push(...corrections);
        }
        rebuildForCurrentMode();
        saveModeState(currentDocType);
        showPreview();
        updateRotationButtons();
        setActionButtonsDisabled(false);
        setStatus(orientationDetectionFailed
          ? `${outputCanvases.length}ページ分の変換が完了しました。自動判定できないページは標準の向きで処理しています。`
          : `${outputCanvases.length}ページ分の切り抜きと白黒変換が完了しました。`);
      } catch (error) {
        console.error(error);
        setStatus("読み込みに失敗しました。PDFの場合はインターネット接続が必要な場合があります。");
        showPlaceholder();
      }
    }

    function showLoading() {
      drop.classList.remove("merge-preview");
      drop.innerHTML = `
        <div class="loading">
          <div class="spinner" aria-hidden="true"></div>
          <div class="loading-dots">読込中 しばらくお待ちください</div>
        </div>
      `;
    }

    function showPlaceholder() {
      drop.classList.remove("merge-preview");
      drop.innerHTML = `
        <div id="placeholder" class="placeholder">
          白黒の写真またはPDFを<br>ここにドラッグ
        </div>
      `;
    }

    async function renderImage(file) {
      const bitmap = await createImageBitmap(file);
      const canvas = document.createElement("canvas");
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      canvas.getContext("2d").drawImage(bitmap, 0, 0);
      return canvas;
    }

    async function renderPdfPages(file) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
      const data = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data }).promise;
      const canvases = [];
      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
        const page = await pdf.getPage(pageNumber);
        const viewport = page.getViewport({ scale: 3 });
        const canvas = document.createElement("canvas");
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
        canvases.push(canvas);
      }
      return canvases;
    }

    async function appendMergePreviews(file, fileIndex) {
      const previews = await renderPdfPreviewPages(file, 1);
      previews.forEach((canvas) => {
        mergePreviewCanvases.push({
          canvas,
          label: `No.${fileIndex}`
        });
      });
    }

    async function renderPdfPreviewPages(file, pageCount) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      const previews = [];
      for (let pageNumber = 1; pageNumber <= Math.min(pageCount, pdf.numPages); pageNumber++) {
        const page = await pdf.getPage(pageNumber);
        const viewport = page.getViewport({ scale: 0.45 });
        const canvas = document.createElement("canvas");
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
        previews.push(canvas);
        await nextFrame();
      }
      return previews;
    }

    async function renderMergedPagesForPrint(files) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
      const canvases = [];
      let renderedPageCount = 0;
      for (const file of files) {
        const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          renderedPageCount += 1;
          setStatus(`印刷用ページを準備中です。${renderedPageCount}/${mergePageCount}`);
          const sourcePage = await pdf.getPage(pageNumber);
          const viewport = sourcePage.getViewport({ scale: PRINT_DPI / 72 });
          const canvas = document.createElement("canvas");
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          await sourcePage.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
          canvases.push(canvas);
          await nextFrame();
        }
      }
      return canvases;
    }

    function cropDocument(canvas) {
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      const { width, height } = canvas;
      const image = ctx.getImageData(0, 0, width, height);
      const data = image.data;
      const threshold = 244;
      let minX = width, minY = height, maxX = 0, maxY = 0;
      for (let y = 0; y < height; y += 2) {
        for (let x = 0; x < width; x += 2) {
          const i = (y * width + x) * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          if (r < threshold || g < threshold || b < threshold) {
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (minX >= maxX || minY >= maxY) return canvas;
      const pad = Math.round(Math.min(width, height) * 0.01);
      minX = Math.max(0, minX - pad);
      minY = Math.max(0, minY - pad);
      maxX = Math.min(width, maxX + pad);
      maxY = Math.min(height, maxY + pad);
      const out = document.createElement("canvas");
      out.width = maxX - minX;
      out.height = maxY - minY;
      out.getContext("2d").drawImage(canvas, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
      return out;
    }

    function addOuterMargin(canvas) {
      const size = originalSizes[selectedOrientation()];
      const pxPerMm = Math.min(canvas.width / size.wMm, canvas.height / size.hMm);
      const margin = Math.max(24, Math.round(pxPerMm * 10));
      const out = document.createElement("canvas");
      out.width = canvas.width + margin * 2;
      out.height = canvas.height + margin * 2;
      const ctx = out.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, out.width, out.height);
      ctx.drawImage(canvas, margin, margin);
      return out;
    }

    function normalizeOrientation(canvas) {
      const orientation = selectedOrientation();
      const shouldRotate = (orientation === "landscape" && canvas.height > canvas.width)
        || (orientation === "portrait" && canvas.width > canvas.height);
      const type = selectedDocType();
      const oriented = shouldRotate ? rotateCanvas(canvas, -90) : canvas;
      const rotation = manualOrientationEnabled[type] ? manualOrientationDirections[type] : 0;
      return rotation ? rotateCanvas(oriented, rotation) : oriented;
    }

    function refreshOutputCanvases() {
      outputCanvases = sourceCanvases.map((canvas) => toBlackWhite(canvas));
    }

    function rebuildForCurrentMode() {
      sourceCanvases = [];
      outputCanvases = [];
      if (!loadedCanvases.length) return;
      if (isMergeMode()) {
        outputCanvases = [...loadedCanvases];
        return;
      }
      if (isPencilMode()) {
        refreshPencilOutput();
        return;
      }
      for (let index = 0; index < loadedCanvases.length; index++) {
        const type = selectedDocType();
        const correction = pageRotationCorrections[index] ?? 0;
        const corrected = rotateCanvas(loadedCanvases[index], correction);
        const cropped = cropDocument(corrected);
        const oriented = normalizeOrientation(cropped);
        sourceCanvases.push(addOuterMargin(oriented));
      }
      refreshOutputCanvases();
    }

    function toBlackWhite(canvas) {
      const out = document.createElement("canvas");
      out.width = canvas.width;
      out.height = canvas.height;
      const ctx = out.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(canvas, 0, 0);
      const image = ctx.getImageData(0, 0, out.width, out.height);
      const data = image.data;
      for (let i = 0; i < data.length; i += 4) {
        const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        const value = gray < blackThreshold ? 0 : 255;
        data[i] = value;
        data[i + 1] = value;
        data[i + 2] = value;
        data[i + 3] = 255;
      }
      ctx.putImageData(image, 0, 0);
      return out;
    }

    function showPreview(canvas = outputCanvases[0]) {
      if (isPencilMode()) {
        showPencilEditor();
        return;
      }
      drop.innerHTML = "";
      drop.classList.toggle("merge-preview", isMergeMode());
      drop.appendChild(buildPreviewSheet(canvas));
    }

    function clonePencilAnnotations(annotations) {
      return annotations.map((page) => page.map((annotation) => ({
        ...annotation,
        points: annotation.points ? annotation.points.map((point) => ({ ...point })) : undefined
      })));
    }

    function refreshPencilOutput() {
      outputCanvases = loadedCanvases.map((_, index) => renderPencilPage(index));
    }

    function renderPencilPage(pageIndex, draft = null) {
      const source = loadedCanvases[pageIndex];
      const canvas = document.createElement("canvas");
      canvas.width = source.width;
      canvas.height = source.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(source, 0, 0);
      const annotations = pencilAnnotations[pageIndex] || [];
      annotations.filter((annotation) => annotation.type !== "text")
        .forEach((annotation) => drawPencilAnnotation(ctx, canvas, annotation));
      annotations.filter((annotation) => annotation.type === "text")
        .forEach((annotation) => drawPencilAnnotation(ctx, canvas, annotation));
      if (draft) drawPencilAnnotation(ctx, canvas, draft);
      return canvas;
    }

    function drawPencilAnnotation(ctx, canvas, annotation) {
      const pointX = (point) => point.x * canvas.width;
      const pointY = (point) => point.y * canvas.height;
      const lineWidth = Math.max(3, Math.round(canvas.width * 0.003));
      ctx.save();
      if (annotation.type === "pen") {
        const points = annotation.points || [];
        if (!points.length) {
          ctx.restore();
          return;
        }
        ctx.strokeStyle = annotation.color;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(pointX(points[0]), pointY(points[0]));
        points.slice(1).forEach((point) => ctx.lineTo(pointX(point), pointY(point)));
        ctx.stroke();
        if (points.length === 1) {
          ctx.fillStyle = annotation.color;
          ctx.beginPath();
          ctx.arc(pointX(points[0]), pointY(points[0]), lineWidth / 2, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (annotation.type === "text") {
        ctx.fillStyle = annotation.color;
        const fontScale = annotation.fontScale || 1;
        const fontSize = Math.max(18, Math.round(canvas.width * 0.016 * fontScale));
        ctx.font = `${fontSize}px "Yu Gothic UI", "Hiragino Kaku Gothic ProN", sans-serif`;
        ctx.textBaseline = "top";
        annotation.text.split(/\r?\n/).forEach((line, index) => {
          ctx.fillText(line, pointX(annotation), pointY(annotation) + index * fontSize * 1.3);
        });
      } else {
        const x = pointX(annotation);
        const y = pointY(annotation);
        const width = annotation.w * canvas.width;
        const height = annotation.h * canvas.height;
        if (annotation.type === "whiteout" || annotation.type === "blackout") {
          ctx.fillStyle = annotation.type === "whiteout" ? "#ffffff" : "#111827";
          ctx.fillRect(x, y, width, height);
        } else if (annotation.type === "blackCircle") {
          ctx.fillStyle = "#111827";
          ctx.beginPath();
          ctx.ellipse(x + width / 2, y + height / 2, Math.abs(width) / 2, Math.abs(height) / 2, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.strokeStyle = annotation.color;
          ctx.lineWidth = lineWidth;
          ctx.strokeRect(x, y, width, height);
        }
      }
      ctx.restore();
    }

    function pencilAnnotationBounds(annotation) {
      if (annotation.type === "pen") {
        const points = annotation.points || [];
        if (!points.length) return null;
        const xs = points.map((point) => point.x);
        const ys = points.map((point) => point.y);
        const padding = 0.01;
        const minX = Math.max(0, Math.min(...xs) - padding);
        const minY = Math.max(0, Math.min(...ys) - padding);
        const maxX = Math.min(1, Math.max(...xs) + padding);
        const maxY = Math.min(1, Math.max(...ys) + padding);
        return { x: minX, y: minY, w: Math.max(0.02, maxX - minX), h: Math.max(0.02, maxY - minY) };
      }
      if (annotation.type === "text") {
        const fontScale = annotation.fontScale || 1;
        const lines = annotation.text.split(/\r?\n/);
        const longestLine = Math.max(...lines.map((line) => line.length), 1);
        return {
          x: annotation.x,
          y: annotation.y,
          w: Math.max(0.035, longestLine * 0.018 * fontScale),
          h: Math.max(0.028, lines.length * 0.026 * fontScale)
        };
      }
      return { x: annotation.x, y: annotation.y, w: annotation.w, h: annotation.h };
    }

    function drawPencilSelection(ctx, canvas) {
      if (!pencilSelection || pencilSelection.pageIndex !== pencilCurrentPageIndex) return;
      const annotation = pencilAnnotations[pencilSelection.pageIndex]?.[pencilSelection.annotationIndex];
      if (!annotation) return;
      const bounds = pencilAnnotationBounds(annotation);
      if (!bounds) return;
      const x = bounds.x * canvas.width;
      const y = bounds.y * canvas.height;
      const width = bounds.w * canvas.width;
      const height = bounds.h * canvas.height;
      const handleSize = annotation.type === "blackCircle"
        ? Math.max(6, Math.round(Math.min(canvas.width, canvas.height) * 0.006))
        : Math.max(10, Math.round(Math.min(canvas.width, canvas.height) * 0.014));
      ctx.save();
      ctx.strokeStyle = "#2563eb";
      ctx.lineWidth = Math.max(2, Math.round(canvas.width * 0.0018));
      ctx.setLineDash([ctx.lineWidth * 3, ctx.lineWidth * 2]);
      ctx.strokeRect(x, y, width, height);
      ctx.setLineDash([]);
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#2563eb";
      [[x, y], [x + width, y], [x, y + height], [x + width, y + height]].forEach(([handleX, handleY]) => {
        ctx.fillRect(handleX - handleSize / 2, handleY - handleSize / 2, handleSize, handleSize);
        ctx.strokeRect(handleX - handleSize / 2, handleY - handleSize / 2, handleSize, handleSize);
      });
      ctx.restore();
    }

    function showPencilEditor() {
      drop.classList.remove("merge-preview");
      drop.innerHTML = "";
      if (!loadedCanvases.length) {
        showPlaceholder();
        updatePencilPalette();
        return;
      }
      const editor = document.createElement("div");
      editor.className = "pencil-editor";
      const canvas = renderPencilPage(pencilCurrentPageIndex);
      drawPencilSelection(canvas.getContext("2d"), canvas);
      canvas.className = "pencil-canvas";
      canvas.setAttribute("aria-label", `PDF ${pencilCurrentPageIndex + 1}ページ目の編集画面`);
      canvas.addEventListener("pointerdown", startPencilDrawing);
      canvas.addEventListener("pointermove", continuePencilDrawing);
      canvas.addEventListener("pointerup", finishPencilDrawing);
      canvas.addEventListener("pointercancel", finishPencilDrawing);
      editor.appendChild(canvas);
      drop.appendChild(editor);
      updatePencilPalette();
    }

    function pencilPoint(event, canvas) {
      const bounds = canvas.getBoundingClientRect();
      return {
        x: Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width)),
        y: Math.max(0, Math.min(1, (event.clientY - bounds.top) / bounds.height))
      };
    }

    function findPencilAnnotationAtPoint(point) {
      const annotations = pencilAnnotations[pencilCurrentPageIndex] || [];
      for (const type of ["text", "other"]) {
        for (let index = annotations.length - 1; index >= 0; index--) {
          const annotation = annotations[index];
          if ((type === "text") !== (annotation.type === "text")) continue;
          const bounds = pencilAnnotationBounds(annotation);
          if (!bounds) continue;
          if (point.x >= bounds.x && point.x <= bounds.x + bounds.w
            && point.y >= bounds.y && point.y <= bounds.y + bounds.h) {
            return index;
          }
        }
      }
      return null;
    }

    function findPencilHandle(point, canvas) {
      if (!pencilSelection || pencilSelection.pageIndex !== pencilCurrentPageIndex) return null;
      const annotation = pencilAnnotations[pencilSelection.pageIndex]?.[pencilSelection.annotationIndex];
      if (!annotation) return null;
      const bounds = pencilAnnotationBounds(annotation);
      if (!bounds) return null;
      const displayBounds = canvas.getBoundingClientRect();
      const handleReach = annotation.type === "blackCircle" ? 5 : 10;
      const threshold = Math.max(handleReach / displayBounds.width, handleReach / displayBounds.height);
      const handles = {
        topLeft: { x: bounds.x, y: bounds.y },
        topRight: { x: bounds.x + bounds.w, y: bounds.y },
        bottomLeft: { x: bounds.x, y: bounds.y + bounds.h },
        bottomRight: { x: bounds.x + bounds.w, y: bounds.y + bounds.h }
      };
      return Object.entries(handles).find(([, handle]) => (
        Math.abs(point.x - handle.x) <= threshold && Math.abs(point.y - handle.y) <= threshold
      ))?.[0] || null;
    }

    function resizedPencilBounds(bounds, handle, point) {
      let left = bounds.x;
      let top = bounds.y;
      let right = bounds.x + bounds.w;
      let bottom = bounds.y + bounds.h;
      if (handle.includes("Left")) left = point.x;
      if (handle.includes("Right")) right = point.x;
      if (handle.includes("top")) top = point.y;
      if (handle.includes("bottom")) bottom = point.y;
      const x = Math.max(0, Math.min(left, right));
      const y = Math.max(0, Math.min(top, bottom));
      const maxX = Math.min(1, Math.max(left, right));
      const maxY = Math.min(1, Math.max(top, bottom));
      return { x, y, w: Math.max(0.01, maxX - x), h: Math.max(0.01, maxY - y) };
    }

    function applyPencilResize(annotation, startBounds, targetBounds) {
      if (annotation.type === "pen") {
        const scaleX = targetBounds.w / startBounds.w;
        const scaleY = targetBounds.h / startBounds.h;
        annotation.points = annotation.points.map((point) => ({
          x: targetBounds.x + (point.x - startBounds.x) * scaleX,
          y: targetBounds.y + (point.y - startBounds.y) * scaleY
        }));
      } else if (annotation.type === "text") {
        annotation.x = targetBounds.x;
        annotation.y = targetBounds.y;
        annotation.fontScale = (annotation.fontScale || 1) * Math.max(targetBounds.w / startBounds.w, targetBounds.h / startBounds.h);
      } else if (annotation.type === "blackCircle") {
        const source = loadedCanvases[pencilCurrentPageIndex];
        const diameter = Math.max(targetBounds.w * source.width, targetBounds.h * source.height);
        annotation.w = diameter / source.width;
        annotation.h = diameter / source.height;
        annotation.x = Math.min(targetBounds.x, 1 - annotation.w);
        annotation.y = Math.min(targetBounds.y, 1 - annotation.h);
      } else {
        annotation.x = targetBounds.x;
        annotation.y = targetBounds.y;
        annotation.w = targetBounds.w;
        annotation.h = targetBounds.h;
      }
    }

    function movePencilAnnotation(annotation, startAnnotation, startBounds, offset) {
      const dx = Math.max(-startBounds.x, Math.min(offset.x, 1 - (startBounds.x + startBounds.w)));
      const dy = Math.max(-startBounds.y, Math.min(offset.y, 1 - (startBounds.y + startBounds.h)));
      if (annotation.type === "pen") {
        annotation.points = startAnnotation.points.map((point) => ({ x: point.x + dx, y: point.y + dy }));
      } else {
        annotation.x = startAnnotation.x + dx;
        annotation.y = startAnnotation.y + dy;
      }
    }

    function releaseSingleUsePencilTool(tool) {
      if (!["text", "blackout", "whiteout", "rect"].includes(tool)) return;
      pencilTool = null;
      updatePencilPalette();
    }

    function startPencilDrawing(event) {
      if (!isPencilMode() || !loadedCanvases.length) return;
      const canvas = event.currentTarget;
      const point = pencilPoint(event, canvas);
      const existingAnnotationIndex = findPencilAnnotationAtPoint(point);
      const existingAnnotation = existingAnnotationIndex === null
        ? null
        : pencilAnnotations[pencilCurrentPageIndex][existingAnnotationIndex];
      if (pencilTool === "text" && (!existingAnnotation || existingAnnotation.type !== "text")) {
        pencilSelection = null;
        pencilMove = null;
        repaintPencilCanvas(canvas);
        openPencilTextEditor("", (text) => {
          pencilAnnotations[pencilCurrentPageIndex].push({ type: "text", ...point, color: pencilColor, text, fontScale: 1 });
          releaseSingleUsePencilTool("text");
          refreshPencilOutput();
          showPencilEditor();
          saveModeState(currentDocType);
        });
        return;
      }
      const handle = findPencilHandle(point, canvas);
      if (handle) {
        const annotation = pencilAnnotations[pencilCurrentPageIndex][pencilSelection.annotationIndex];
        pencilResize = {
          handle,
          annotationIndex: pencilSelection.annotationIndex,
          startBounds: pencilAnnotationBounds(annotation),
          annotation: clonePencilAnnotations([[annotation]])[0][0]
        };
        canvas.setPointerCapture(event.pointerId);
        return;
      }
      if (existingAnnotationIndex !== null) {
        if (event.detail === 2 && existingAnnotation.type === "text") {
          pencilSelection = { pageIndex: pencilCurrentPageIndex, annotationIndex: existingAnnotationIndex };
          openPencilTextEditor(existingAnnotation.text, (text) => {
            existingAnnotation.text = text;
            refreshPencilOutput();
            showPencilEditor();
            saveModeState(currentDocType);
          });
          return;
        }
        if (pencilSelection?.pageIndex === pencilCurrentPageIndex
          && pencilSelection.annotationIndex === existingAnnotationIndex) {
          pencilMove = {
            annotationIndex: existingAnnotationIndex,
            startPoint: point,
            startBounds: pencilAnnotationBounds(existingAnnotation),
            annotation: clonePencilAnnotations([[existingAnnotation]])[0][0]
          };
          canvas.setPointerCapture(event.pointerId);
          return;
        }
        pencilSelection = { pageIndex: pencilCurrentPageIndex, annotationIndex: existingAnnotationIndex };
        pencilDraft = null;
        pencilMove = null;
        repaintPencilCanvas(canvas);
        return;
      }
      pencilSelection = null;
      pencilMove = null;
      repaintPencilCanvas(canvas);
      if (pencilTool === "blackCircle") {
        const diameter = 0.018;
        const height = diameter * canvas.width / canvas.height;
        pencilAnnotations[pencilCurrentPageIndex].push({
          type: "blackCircle",
          x: Math.max(0, Math.min(1 - diameter, point.x - diameter / 2)),
          y: Math.max(0, Math.min(1 - height, point.y - height / 2)),
          w: diameter,
          h: height
        });
        refreshPencilOutput();
        showPencilEditor();
        saveModeState(currentDocType);
        return;
      }
      if (!pencilTool) return;
      pencilDraft = pencilTool === "pen"
        ? { type: "pen", color: pencilColor, points: [point] }
        : { type: pencilTool, color: pencilColor, ...point, w: 0, h: 0 };
      canvas.setPointerCapture(event.pointerId);
      repaintPencilCanvas(canvas);
    }

    function continuePencilDrawing(event) {
      if (pencilResize) {
        const annotation = pencilAnnotations[pencilCurrentPageIndex][pencilResize.annotationIndex];
        Object.assign(annotation, clonePencilAnnotations([[pencilResize.annotation]])[0][0]);
        applyPencilResize(annotation, pencilResize.startBounds, resizedPencilBounds(pencilResize.startBounds, pencilResize.handle, pencilPoint(event, event.currentTarget)));
        repaintPencilCanvas(event.currentTarget);
        return;
      }
      if (pencilMove) {
        const annotation = pencilAnnotations[pencilCurrentPageIndex][pencilMove.annotationIndex];
        Object.assign(annotation, clonePencilAnnotations([[pencilMove.annotation]])[0][0]);
        const point = pencilPoint(event, event.currentTarget);
        movePencilAnnotation(annotation, pencilMove.annotation, pencilMove.startBounds, {
          x: point.x - pencilMove.startPoint.x,
          y: point.y - pencilMove.startPoint.y
        });
        repaintPencilCanvas(event.currentTarget);
        return;
      }
      if (!pencilDraft) return;
      const point = pencilPoint(event, event.currentTarget);
      if (pencilDraft.type === "pen") {
        pencilDraft.points.push(point);
      } else {
        pencilDraft.w = point.x - pencilDraft.x;
        pencilDraft.h = point.y - pencilDraft.y;
      }
      repaintPencilCanvas(event.currentTarget);
    }

    function finishPencilDrawing(event) {
      if (pencilResize) {
        const annotation = pencilAnnotations[pencilCurrentPageIndex][pencilResize.annotationIndex];
        Object.assign(annotation, clonePencilAnnotations([[pencilResize.annotation]])[0][0]);
        applyPencilResize(annotation, pencilResize.startBounds, resizedPencilBounds(pencilResize.startBounds, pencilResize.handle, pencilPoint(event, event.currentTarget)));
        pencilResize = null;
        refreshPencilOutput();
        showPencilEditor();
        saveModeState(currentDocType);
        return;
      }
      if (pencilMove) {
        const annotation = pencilAnnotations[pencilCurrentPageIndex][pencilMove.annotationIndex];
        Object.assign(annotation, clonePencilAnnotations([[pencilMove.annotation]])[0][0]);
        const point = pencilPoint(event, event.currentTarget);
        movePencilAnnotation(annotation, pencilMove.annotation, pencilMove.startBounds, {
          x: point.x - pencilMove.startPoint.x,
          y: point.y - pencilMove.startPoint.y
        });
        pencilMove = null;
        refreshPencilOutput();
        showPencilEditor();
        saveModeState(currentDocType);
        return;
      }
      if (!pencilDraft) return;
      const canvas = event.currentTarget;
      const point = pencilPoint(event, canvas);
      if (pencilDraft.type === "pen") {
        pencilDraft.points.push(point);
      } else {
        pencilDraft.w = point.x - pencilDraft.x;
        pencilDraft.h = point.y - pencilDraft.y;
        if (pencilDraft.w < 0) {
          pencilDraft.x += pencilDraft.w;
          pencilDraft.w = Math.abs(pencilDraft.w);
        }
        if (pencilDraft.h < 0) {
          pencilDraft.y += pencilDraft.h;
          pencilDraft.h = Math.abs(pencilDraft.h);
        }
      }
      const hasDrawing = pencilDraft.type === "pen"
        ? pencilDraft.points.length > 1
        : pencilDraft.w > 0.002 && pencilDraft.h > 0.002;
      const completedTool = pencilDraft.type;
      if (hasDrawing) pencilAnnotations[pencilCurrentPageIndex].push(pencilDraft);
      pencilDraft = null;
      pencilSelection = null;
      if (hasDrawing) releaseSingleUsePencilTool(completedTool);
      refreshPencilOutput();
      showPencilEditor();
      saveModeState(currentDocType);
    }

    function repaintPencilCanvas(canvas) {
      const page = renderPencilPage(pencilCurrentPageIndex, pencilDraft);
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(page, 0, 0);
      drawPencilSelection(ctx, canvas);
    }

    function updatePencilPalette() {
      const pageCount = loadedCanvases.length;
      pencilToolButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.pencilTool === pencilTool);
      });
      pencilColorButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.pencilColor === pencilColor);
      });
      pencilPageLabel.textContent = pageCount ? `${pencilCurrentPageIndex + 1} / ${pageCount}` : "1 / 1";
      pencilPreviousBtn.disabled = pencilCurrentPageIndex <= 0;
      pencilNextBtn.disabled = !pageCount || pencilCurrentPageIndex >= pageCount - 1;
      const hasAnnotations = Boolean(pencilAnnotations[pencilCurrentPageIndex]?.length);
      pencilUndoBtn.disabled = !hasAnnotations;
      pencilClearBtn.disabled = !hasAnnotations;
    }

    function showMergeSummary() {
      drop.classList.toggle("merge-preview", mergePreviewCanvases.length > 0);
      drop.innerHTML = "";
      const content = document.createElement("div");
      content.className = "merge-preview-content";
      if (mergePreviewCanvases.length) {
        const grid = document.createElement("div");
        grid.className = "merge-preview-grid";
        mergePreviewCanvases.forEach(({ canvas, label }) => {
          const item = document.createElement("div");
          item.className = "merge-preview-item";
          item.appendChild(buildPreviewSheet(canvas));
          const caption = document.createElement("div");
          caption.textContent = label;
          item.appendChild(caption);
          grid.appendChild(item);
        });
        content.appendChild(grid);
      }
      const summary = document.createElement("div");
      summary.className = "merge-summary";
      summary.innerHTML = `${mergeFiles.length}件・${mergePageCount}ページを結合します<br>上記のPDF保存または印刷（FAX送信）を押して下さい`;
      content.appendChild(summary);
      drop.appendChild(content);
    }

    function buildPreviewSheet(canvas) {
      const sheet = document.createElement("div");
      sheet.className = "sheet";
      const previewLandscape = isMergeMode() ? canvas.width > canvas.height : selectedOrientation() === "landscape";
      if (previewLandscape) sheet.classList.add("landscape");
      const preview = document.createElement("canvas");
      const displayCanvas = canvas;
      const page = isMergeMode() ? pageSizeForCanvas(displayCanvas) : selectedPageSize();
      const box = isMergeMode() ? { wMm: page.wMm - 10, hMm: page.hMm - 10 } : largePlacementBox(page);
      preview.width = displayCanvas.width;
      preview.height = displayCanvas.height;
      preview.getContext("2d").drawImage(displayCanvas, 0, 0);
      const fitted = fitWithin(displayCanvas.width, displayCanvas.height, box.wMm, box.hMm);
      preview.style.width = `${(fitted.wMm / page.wMm) * 100}%`;
      preview.style.height = `${(fitted.hMm / page.hMm) * 100}%`;
      sheet.appendChild(preview);
      return sheet;
    }

    function buildPdfBlob(canvas) {
      const pageImages = [buildA4PageJpeg(canvas)];
      return objectsToPdfBlobFromPageImages(pageImages);
    }

    function buildPencilPdfBlob(canvases) {
      return objectsToPdfBlobFromPageImages(canvases.map((canvas) => buildPencilPageJpeg(canvas)));
    }

    function buildPencilPageJpeg(canvas, dpi = DPI) {
      const { canvas: doc, page } = buildMergedPageCanvas(canvas, dpi);
      const jpegData = atob(doc.toDataURL("image/jpeg", 0.92).split(",")[1]);
      return { data: jpegData, width: doc.width, height: doc.height, page };
    }

    function buildOutputPdfBlob(canvases, dpi = DPI) {
      return objectsToPdfBlobFromPageImages(canvases.map((canvas) => buildA4PageJpeg(canvas, dpi)));
    }

    function printCanvasesInCurrentWindow(canvases, pageBuilder) {
      const pages = canvases.map((canvas) => pageBuilder(canvas, PRINT_DPI));
      document.querySelector(".print-stage")?.remove();
      document.getElementById("printStageStyle")?.remove();

      const style = document.createElement("style");
      style.id = "printStageStyle";
      style.textContent = `@page portrait { size: 210mm 297mm; margin: 0; }
        @page landscape { size: 297mm 210mm; margin: 0; }
        @media print {
          .print-stage .page.portrait { page: portrait; width: 210mm; height: 297mm; }
          .print-stage .page.landscape { page: landscape; width: 297mm; height: 210mm; }
        }`;
      document.head.appendChild(style);

      const stage = document.createElement("main");
      stage.className = "print-stage";
      pages.forEach(({ canvas, page }) => {
        const section = document.createElement("section");
        section.className = `page ${page.wMm > page.hMm ? "landscape" : "portrait"}`;
        section.appendChild(canvas);
        stage.appendChild(section);
      });
      document.body.appendChild(stage);

      window.addEventListener("afterprint", () => {
        stage.remove();
        style.remove();
      }, { once: true });
      window.print();
    }

    async function buildMergedPdfBlob(files) {
      const mergedPdf = await PDFDocument.create();
      for (let index = 0; index < files.length; index++) {
        setStatus(`${index + 1}/${files.length}件目を結合中です。`);
        const sourcePdf = await PDFDocument.load(await files[index].arrayBuffer(), { ignoreEncryption: true });
        const copiedPages = await mergedPdf.copyPages(sourcePdf, sourcePdf.getPageIndices());
        copiedPages.forEach((page) => mergedPdf.addPage(page));
        await nextFrame();
      }
      return new Blob([await mergedPdf.save()], { type: "application/pdf" });
    }

    // Keep the original PDF data intact so thin lines and text are not rasterized for fax printing.
    function printMergedPdfBlob(blob) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(blob);
        const frame = document.createElement("iframe");
        frame.setAttribute("aria-hidden", "true");
        frame.style.cssText = "position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none";

        const cleanup = () => {
          frame.remove();
          URL.revokeObjectURL(url);
        };

        frame.addEventListener("load", () => {
          window.setTimeout(() => {
            try {
              const printWindow = frame.contentWindow;
              if (!printWindow) throw new Error("印刷用PDFを開けませんでした。");
              printWindow.focus();
              printWindow.print();
              window.setTimeout(cleanup, 60000);
              resolve();
            } catch (error) {
              cleanup();
              reject(error);
            }
          }, 250);
        }, { once: true });

        frame.src = url;
        document.body.appendChild(frame);
      });
    }

    function objectsToPdfBlobFromPageImages(pageImages) {
      const objects = [];
      const pageObjectIds = [];
      const pageCount = pageImages.length;

      objects.push("<< /Type /Catalog /Pages 2 0 R >>");
      objects.push("");

      for (let index = 0; index < pageCount; index++) {
        const page = pageImages[index].page;
        const pageId = objects.length + 1;
        const imageId = pageId + 1;
        const contentId = pageId + 2;
        pageObjectIds.push(pageId);

        objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${page.wPt} ${page.hPt}] /Resources << /XObject << /Im${index} ${imageId} 0 R >> >> /Contents ${contentId} 0 R >>`);
        objects.push(`<< /Type /XObject /Subtype /Image /Width ${pageImages[index].width} /Height ${pageImages[index].height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pageImages[index].data.length} >>\nstream\n${pageImages[index].data}\nendstream`);
        const content = `q\n${page.wPt} 0 0 ${page.hPt} 0 0 cm\n/Im${index} Do\nQ`;
        objects.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
      }

      objects[1] = `<< /Type /Pages /Kids [${pageObjectIds.map((id) => `${id} 0 R`).join(" ")}] /Count ${pageCount} >>`;
      return objectsToPdfBlob(objects);
    }

    function buildA4PageJpeg(canvas, dpi = DPI) {
      const { canvas: doc, page } = buildA4PageCanvas(canvas, dpi);
      const jpegData = atob(doc.toDataURL("image/jpeg", 0.92).split(",")[1]);
      return { data: jpegData, width: doc.width, height: doc.height, page };
    }

    function buildA4PageCanvas(canvas, dpi = DPI) {
      const page = selectedPageSize();
      const displayCanvas = canvas;
      const pxPerMm = dpi / 25.4;
      const doc = document.createElement("canvas");
      doc.width = Math.round(page.wMm * pxPerMm);
      doc.height = Math.round(page.hMm * pxPerMm);
      const ctx = doc.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, doc.width, doc.height);
      const box = largePlacementBox(page);
      const fitted = fitWithin(displayCanvas.width, displayCanvas.height, box.wMm, box.hMm);
      const targetW = Math.round(fitted.wMm * pxPerMm);
      const targetH = Math.round(fitted.hMm * pxPerMm);
      const x = Math.round((doc.width - targetW) / 2);
      const y = Math.round((doc.height - targetH) / 2);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(displayCanvas, x, y, targetW, targetH);
      return { canvas: doc, page };
    }

    function buildMergedPageCanvas(canvas, dpi = DPI) {
      const page = pageSizeForCanvas(canvas);
      const pxPerMm = dpi / 25.4;
      const doc = document.createElement("canvas");
      doc.width = Math.round(page.wMm * pxPerMm);
      doc.height = Math.round(page.hMm * pxPerMm);
      const ctx = doc.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, doc.width, doc.height);
      const box = { wMm: page.wMm - 10, hMm: page.hMm - 10 };
      const fitted = fitWithin(canvas.width, canvas.height, box.wMm, box.hMm);
      const targetW = Math.round(fitted.wMm * pxPerMm);
      const targetH = Math.round(fitted.hMm * pxPerMm);
      const x = Math.round((doc.width - targetW) / 2);
      const y = Math.round((doc.height - targetH) / 2);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(canvas, x, y, targetW, targetH);
      return { canvas: doc, page };
    }

    function rotateCanvas(canvas, rotation) {
      const out = document.createElement("canvas");
      const normalizedRotation = (rotation + 360) % 360;
      const quarterTurn = normalizedRotation === 90 || normalizedRotation === 270;
      out.width = quarterTurn ? canvas.height : canvas.width;
      out.height = quarterTurn ? canvas.width : canvas.height;
      const ctx = out.getContext("2d");
      ctx.translate(out.width / 2, out.height / 2);
      ctx.rotate(rotation * Math.PI / 180);
      ctx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
      return out;
    }

    function fitWithin(sourceW, sourceH, maxWMm, maxHMm) {
      const sourceRatio = sourceW / sourceH;
      const boxRatio = maxWMm / maxHMm;
      if (sourceRatio > boxRatio) {
        return { wMm: maxWMm, hMm: maxWMm / sourceRatio };
      }
      return { wMm: maxHMm * sourceRatio, hMm: maxHMm };
    }

    function selectedPageSize() {
      if (selectedOrientation() === "landscape") {
        return { wMm: A4.hMm, hMm: A4.wMm, wPt: A4.hPt, hPt: A4.wPt };
      }
      return A4;
    }

    function pageSizeForCanvas(canvas) {
      if (canvas.width > canvas.height) {
        return { wMm: A4.hMm, hMm: A4.wMm, wPt: A4.hPt, hPt: A4.wPt };
      }
      return A4;
    }

    function largePlacementBox(page) {
      const scaleBox = (box) => ({
        wMm: Math.min(page.wMm - 2, box.wMm * sizeScale),
        hMm: Math.min(page.hMm - 2, box.hMm * sizeScale)
      });
      if (selectedOrientation() === "portrait") {
        return scaleBox({ wMm: 120, hMm: 170 });
      }
      const margin = 10;
      return scaleBox({ wMm: page.wMm - margin * 2, hMm: page.hMm - margin * 2 });
    }

    function objectsToPdfBlob(objects) {
      let pdf = "%PDF-1.4\n";
      const offsets = [0];
      objects.forEach((obj, index) => {
        offsets.push(pdf.length);
        pdf += `${index + 1} 0 obj\n${obj}\nendobj\n`;
      });
      const xref = pdf.length;
      pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
      for (let i = 1; i < offsets.length; i++) {
        pdf += `${String(offsets[i]).padStart(10, "0")} 00000 n \n`;
      }
      pdf += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
      const bytes = new Uint8Array(pdf.length);
      for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xff;
      return new Blob([bytes], { type: "application/pdf" });
    }
  </script>
</body>
