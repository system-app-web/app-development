<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リーホ - ログイン確認</title>
  <style>
    :root { color: #182a21; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: #fff; }
    button, input, select { font: inherit; }
    .login-page { position: relative; display: grid; min-height: 100vh; padding: 34px 24px 108px; place-items: center; }
    .login-layout { width: min(460px, 100%); text-align: center; }
    .riho-logo { display: block; width: min(340px, 82vw); height: 190px; margin: 0 auto 18px; object-fit: contain; }
    .login-card { padding: 30px; border: 1px solid #dce9df; border-radius: 8px; background: #fff; box-shadow: 0 12px 28px rgba(17, 62, 38, .08); text-align: left; }
    .login-card h1 { margin: 0; color: #173d2a; font-size: 1.3rem; letter-spacing: 0; text-align: center; }
    .login-card > p { margin: 8px 0 26px; color: #66776d; font-size: .88rem; line-height: 1.7; text-align: center; }
    .field { margin-top: 18px; }
    label { display: block; margin-bottom: 8px; color: #315441; font-size: .88rem; font-weight: 700; }
    input, select { width: 100%; height: 48px; padding: 0 13px; border: 1px solid #c9dbcf; border-radius: 6px; outline: 0; color: #172a20; background: #fff; font-size: 1rem; }
    select { cursor: pointer; }
    input:focus, select:focus { border-color: #24935c; box-shadow: 0 0 0 3px rgba(36, 147, 92, .13); }
    input::placeholder { color: #a2b0a6; }
    .request-button, .verify-button { display: flex; width: 100%; align-items: center; justify-content: center; border-radius: 6px; font-size: .96rem; font-weight: 700; cursor: pointer; }
    .request-button { height: 44px; margin-top: 20px; border: 1px solid #91bda2; color: #216640; background: #fff; }
    .verify-button { height: 50px; margin-top: 26px; border: 0; color: #fff; background: #168750; box-shadow: 0 8px 16px rgba(22, 135, 80, .18); }
    .request-button:hover { background: #f3faf5; }
    .verify-button:hover { background: #0d7642; }
    .status { min-height: 22px; margin: 14px 0 0; color: #52665a; font-size: .8rem; line-height: 1.55; text-align: center; }
    .status.is-error { color: #b54437; }
    .status.is-success { color: #187443; }
    .safety-tools { margin-top: 21px; border-top: 1px solid #e6eee8; color: #627166; font-size: .78rem; }
    .safety-tools summary { padding-top: 16px; cursor: pointer; text-align: center; }
    .safety-actions { display: flex; gap: 8px; padding-top: 12px; }
    .safety-actions button { flex: 1; height: 36px; border: 1px solid #d2e0d5; border-radius: 5px; color: #3e5d49; background: #fff; cursor: pointer; }
    .company-logo { position: absolute; right: 26px; bottom: 20px; display: block; width: 98px; height: 78px; object-fit: contain; filter: drop-shadow(0 1px 1px rgba(80, 44, 25, .12)); }
    @media (max-width: 560px) {
      .login-page { padding: 20px 18px 94px; place-items: start center; }
      .login-layout { margin-top: 20px; }
      .riho-logo { width: min(292px, 86vw); height: 165px; margin-bottom: 10px; }
      .login-card { padding: 24px 20px; }
      .company-logo { right: 16px; bottom: 13px; width: 80px; height: 64px; }
    }
  </style>
</head>
<body>
  <main class="login-page">
    <section class="login-layout" aria-labelledby="login-title">
      <img class="riho-logo" src="./public/riho-title.png" alt="リーホ 介護業務効率化ポータルアプリ">
      <form class="login-card" id="login-form">
        <h1 id="login-title">アプリ一覧へログイン</h1>
        <p>社員名と社員PINを入力し、端末認証を行ってください。</p>

        <div class="field">
          <label for="employee">社員名</label>
          <select id="employee" name="employee" required>
            <option value="">社員名を選択</option>
            <option>都外川　洋介</option><option>岡　喜久美</option><option>白石　貴弘</option><option>宮地　淳</option>
            <option>池田　淳</option><option>井上　真澄</option><option>竹山　亮子</option><option>楠　悦子</option>
            <option>佐藤　和夫</option><option>石田　由美子</option><option>岩田　明日香</option><option>谷川　義和</option>
            <option>藤嶋　孝信</option><option>深井　貴将</option><option>藤井　由美</option><option>浦越　拓哉</option>
            <option>永野　暢俊</option><option>松尾　修</option><option>和田　真由美</option><option>山川　篤徳</option>
            <option>三橋　彩佳</option><option>名守　佑香</option>
          </select>
        </div>

        <div class="field">
          <label for="password">社員PIN</label>
          <input id="password" name="password" type="password" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="3桁のPINを入力" required>
        </div>

        <button class="request-button" id="request-button" type="button">端末認証を申請</button>

        <div class="field">
          <label for="one-time-password">認証ワンタイムパスワード</label>
          <input id="one-time-password" name="one-time-password" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6桁の認証コード" required>
        </div>

        <button class="verify-button" type="submit">認証してアプリ一覧へ</button>
        <p class="status" id="status" aria-live="polite"></p>

        <details class="safety-tools">
          <summary>確認用データ管理</summary>
          <div class="safety-actions">
            <button type="button" id="export-button">バックアップ</button>
            <button type="button" id="import-button">データ挿入</button>
            <input id="import-file" type="file" accept="application/json" hidden>
          </div>
        </details>
      </form>
    </section>
    <img class="company-logo" src="./public/ktm-logo.png" alt="KTM Keep Trust Meaning">
  </main>

  <script>
    const APP_ID = 'ktm-portal-access-preview';
    const AUTH_SERVICE_URL = 'https://script.google.com/macros/s/AKfycbyBLa2UzLgaxu7wb6GKqIJ_uiEbet4fW1QjCGGh83_Yb1JdJrq0ygF2ai6O5oJencw-/exec';
    const STORAGE_KEY = `${APP_ID}:state`;
    const DEVICE_ID_KEY = `${APP_ID}:device-id`;
    const DATABASE_NAME = 'KTM Portal Access Preview Backup';
    const STORE_NAME = 'daily_snapshots';
    const employeeSelect = document.getElementById('employee');
    const passwordInput = document.getElementById('password');
    const otpInput = document.getElementById('one-time-password');
    const status = document.getElementById('status');
    let state = { employee: '', latestRequest: null, session: null };

    const isValidState = (value) => value && typeof value === 'object' && typeof value.employee === 'string';
    const todayKey = () => new Date().toISOString().slice(0, 10);
    function setStatus(message, type = '') { status.textContent = message; status.className = `status${type ? ` is-${type}` : ''}`; }
    function applyState() { employeeSelect.value = state.employee || ''; }

    function getDeviceId() {
      const existing = localStorage.getItem(DEVICE_ID_KEY);
      if (existing) return existing;
      const deviceId = crypto.randomUUID();
      localStorage.setItem(DEVICE_ID_KEY, deviceId);
      return deviceId;
    }

    async function callAuthService(action, payload) {
      const response = await fetch(AUTH_SERVICE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, payload }),
        redirect: 'follow',
      });
      const result = await response.json();
      if (!result.ok) throw new Error(result.message || '認証処理に失敗しました。');
      return result;
    }

    function isEmployeePinValid() {
      const index = Array.from(employeeSelect.options).findIndex((option) => option.value === employeeSelect.value);
      return index > 0 && passwordInput.value === String(index).padStart(3, '0');
    }

    function openBackupDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DATABASE_NAME, 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(STORE_NAME)) request.result.createObjectStore(STORE_NAME, { keyPath: 'date' });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveDailySnapshot() {
      const database = await openBackupDatabase();
      const snapshot = { date: todayKey(), savedAt: new Date().toISOString(), payload: { data: state } };
      await new Promise((resolve, reject) => {
        const transaction = database.transaction(STORE_NAME, 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        store.put(snapshot);
        store.getAll().onsuccess = (event) => {
          const cutoff = new Date();
          cutoff.setDate(cutoff.getDate() - 30);
          for (const item of event.target.result) if (new Date(`${item.date}T00:00:00`) < cutoff) store.delete(item.date);
        };
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
      });
      database.close();
    }

    async function restoreLatestBackup() {
      const database = await openBackupDatabase();
      const snapshots = await new Promise((resolve, reject) => {
        const request = database.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      database.close();
      const newestFirst = snapshots.sort((a, b) => b.savedAt.localeCompare(a.savedAt));
      return newestFirst.find((item) => isValidState(item?.payload?.data))?.payload?.data || null;
    }

    async function persistState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      try { await saveDailySnapshot(); } catch (error) { console.warn('IndexedDB backup could not be saved.', error); }
    }

    async function initialize() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (isValidState(stored)) state = stored;
        else {
          const restored = await restoreLatestBackup();
          if (restored) { state = restored; localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        }
      } catch (error) {
        const restored = await restoreLatestBackup();
        if (restored) state = restored;
      }
      applyState();
    }

    employeeSelect.addEventListener('change', async () => { state.employee = employeeSelect.value; await persistState(); });
    document.getElementById('request-button').addEventListener('click', async () => {
      if (!employeeSelect.value || !passwordInput.value) { setStatus('社員名と社員PINを入力してください。', 'error'); return; }
      if (!isEmployeePinValid()) { setStatus('社員名または社員PINが正しくありません。', 'error'); return; }
      try {
        const result = await callAuthService('requestDeviceApproval', {
          employeeName: employeeSelect.value,
          employeePin: passwordInput.value,
          deviceId: getDeviceId(),
          deviceName: `${navigator.platform || '端末'} / ${navigator.language}`,
          browser: navigator.userAgent,
        });
        state = { employee: employeeSelect.value, latestRequest: { requestId: result.requestId, requestedAt: new Date().toISOString(), status: 'requested' }, session: null };
        await persistState();
        setStatus('管理者へ認証コードを送信しました。届いた6桁のコードを入力してください。', 'success');
      } catch (error) { setStatus(error.message || '端末認証の申請に失敗しました。', 'error'); }
    });
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!employeeSelect.value || !passwordInput.value || !/^\d{6}$/.test(otpInput.value) || !state.latestRequest?.requestId) {
        setStatus('端末認証を申請後、6桁の認証コードを入力してください。', 'error');
        return;
      }
      if (!isEmployeePinValid()) { setStatus('社員名または社員PINが正しくありません。', 'error'); return; }
      try {
        const result = await callAuthService('verifyOneTimePassword', {
          requestId: state.latestRequest.requestId,
          code: otpInput.value,
          deviceId: getDeviceId(),
        });
        state = { employee: result.employeeName, latestRequest: { requestedAt: new Date().toISOString(), status: 'approved' }, session: { accessToken: result.accessToken } };
        await persistState();
        window.location.assign('./ポータルトップ確認.html');
      } catch (error) { setStatus(error.message || '端末認証に失敗しました。', 'error'); }
    });
    document.getElementById('export-button').addEventListener('click', () => {
      const backup = JSON.stringify({ appId: APP_ID, exportedAt: new Date().toISOString(), payload: { data: state } }, null, 2);
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([backup], { type: 'application/json' }));
      link.download = `KTM-portal-login-backup-${todayKey()}.json`;
      link.click();
      URL.revokeObjectURL(link.href);
    });
    document.getElementById('import-button').addEventListener('click', () => document.getElementById('import-file').click());
    document.getElementById('import-file').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const backup = JSON.parse(await file.text());
        if (backup.appId !== APP_ID || !isValidState(backup?.payload?.data)) throw new Error('Invalid backup');
        state = backup.payload.data;
        applyState();
        await persistState();
        setStatus('確認用データを読み込みました。', 'success');
      } catch (error) { setStatus('この画面のバックアップとして読み込めませんでした。', 'error'); }
      event.target.value = '';
    });
    initialize();
  </script>
</body>
</html>
