<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="かんたん見取り図">
<meta name="theme-color" content="#247a8a">
<link rel="apple-touch-icon" href="./app-icon.png">
<link rel="icon" type="image/png" href="./app-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>かんたん見取り図</title>
<style>
:root {
  --bg: #eefaf8;
  --panel: #ffffff;
  --accent: #47b8c8;
  --accent-strong: #247a8a;
  --text: #1f2933;
  --muted: #6b8790;
  --border: #d5ecef;
  --shadow: 0 12px 32px rgba(71, 184, 200, 0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  background:
    radial-gradient(circle at top left, rgba(182, 238, 232, 0.65) 0, transparent 30%),
    radial-gradient(circle at bottom right, rgba(198, 231, 255, 0.6) 0, transparent 28%),
    linear-gradient(180deg, #f4fffe 0%, #eaf7fb 100%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: auto;
}
header {
  background: rgba(250,255,255,0.96);
  border-bottom: 1px solid #d9eff2;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow);
  z-index: 10;
}
h1 {
  font-size: 20px;
  font-weight: 800;
  color: var(--accent-strong);
  letter-spacing: 0;
}
.spacer { flex: 1; }
.btn {
  border: none;
  border-radius: 999px;
  padding: 9px 16px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary {
  background: linear-gradient(135deg, #2daec0, #63cfd2);
  color: #fff;
  box-shadow: 0 10px 20px rgba(45, 174, 192, 0.24);
}
.btn-soft {
  background: #f5feff;
  color: #3c7680;
  border: 1px solid #d6edf0;
}
.btn-soft:hover { background: #e9f9fb; }
.main {
  display: flex;
  flex-direction: column;
  padding: 14px;
  gap: 14px;
}
.input-panel {
  width: 100%;
  min-width: 0;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 22px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 18px 36px rgba(70, 155, 168, 0.10);
}
.side-intro {
  padding: 16px;
  background: linear-gradient(180deg, #ffffff, #f2fbfc);
  border-bottom: 1px solid var(--border);
}
.side-kicker {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 999px;
  background: #ebf8fb;
  color: #2d7c88;
  font-size: 11px;
  font-weight: 800;
  margin-bottom: 10px;
}
.side-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--accent-strong);
  line-height: 1.35;
}
.side-sub {
  margin-top: 6px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
}
.template-block {
  border-bottom: 1px solid var(--border);
  padding: 12px;
  flex-shrink: 0;
}
.template-hero-btn {
  padding: 12px 14px;
  border-radius: 16px;
  background: linear-gradient(135deg, #effbfd, #ddf6f8);
  color: var(--accent-strong);
  cursor: pointer;
  box-shadow: inset 0 0 0 1px #d7edf1;
}
.template-hero-cta {
  display: inline-block;
  margin-bottom: 8px;
  padding: 4px 9px 5px;
  border-radius: 999px;
  background: #fff;
  color: #2d7f8d;
  font-size: 11px;
  font-weight: 800;
  border: 1px solid #d4edf1;
}
.template-hero-label {
  font-size: 16px;
  font-weight: 800;
}
.template-hero-sub {
  margin-top: 4px;
  font-size: 12px;
  color: #4d8b94;
}
.template-panel-body {
  display: none;
  padding-top: 10px;
  gap: 8px;
  flex-direction: column;
}
.template-block.open .template-panel-body { display: flex; }
.template-btns {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.preset-btn {
  border: 1px solid #cdeaf0;
  background: #f5fdff;
  color: #2e7884;
  border-radius: 12px;
  min-height: 44px;
  padding: 10px 12px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
}
.preset-btn:hover { background: #e8f9fd; }
.item-canvas-wrap {
  height: 560px;
  min-height: 560px;
  overflow: hidden;
  border: 1px solid #d9edf1;
  border-radius: 22px;
  background: #fff;
  box-shadow: 0 18px 36px rgba(74, 166, 180, 0.08);
}
#itemCanvas {
  width: 100%;
  height: 100%;
  display: block;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(70px);
  background: #1e293b;
  color: #fff;
  padding: 9px 18px;
  border-radius: 999px;
  font-size: 13px;
  transition: transform 0.24s;
  z-index: 100;
}
.toast.show { transform: translateX(-50%) translateY(0); }
@media (max-width: 768px) {
  body {
    height: auto;
    min-height: 100svh;
    overflow: auto;
  }
  header {
    padding: 10px 12px;
    gap: 6px;
  }
  h1 { font-size: 17px; }
  .btn {
    padding: 8px 10px;
    font-size: 12px;
  }
  .main {
    flex-direction: column;
    padding: 10px;
    gap: 10px;
    overflow: visible;
  }
  .input-panel {
    width: 100%;
    min-width: 0;
    overflow: visible;
    border-radius: 16px;
  }
  .side-intro { padding: 12px; }
  .side-kicker {
    margin-bottom: 6px;
    padding: 4px 8px;
  }
  .side-title { font-size: 16px; }
  .side-sub { font-size: 11px; }
  .template-block { padding: 10px; }
  .template-hero-btn { padding: 10px 12px; }
  .template-hero-cta { margin-bottom: 5px; }
  .template-hero-label { font-size: 15px; }
  .template-hero-sub { font-size: 11px; }
  .template-panel-body { padding-top: 8px; }
  .preset-btn {
    min-height: 42px;
    padding: 8px 10px;
  }
  .item-canvas-wrap {
    height: 52svh;
    min-height: 52svh;
    border-radius: 18px;
  }
}
</style>
</head>
<body>
<header>
  <h1>かんたん見取り図</h1>
  <button class="btn btn-soft" onclick="clearAll()">リセット</button>
  <button class="btn btn-soft" onclick="loadDefaultTemplate()">標準テンプレート</button>
  <div class="spacer"></div>
  <button class="btn btn-primary" onclick="exportPNG()">フォルダ保存</button>
</header>

<div class="main">
  <div class="input-panel">
    <div class="side-intro">
      <div class="side-kicker">MAPPING</div>
      <div class="side-title">白黒の見取り図を作成</div>
      <div class="side-sub">一般的な間取りを選んでから、見取り図を作成できます。</div>
    </div>
    <div id="templateBlock" class="template-block">
      <div class="template-hero-btn" onclick="toggleTemplatePanel()">
        <div class="template-hero-cta">テンプレート</div>
        <div class="template-hero-label">間取りを選ぶ</div>
        <div class="template-hero-sub">1L、1DK、1LDK、2LDK など</div>
      </div>
      <div class="template-panel-body">
        <div id="templateBtns" class="template-btns"></div>
      </div>
    </div>
  </div>

  <div class="item-canvas-wrap">
    <canvas id="itemCanvas" width="1200" height="800" aria-label="アイテムキャンバス"></canvas>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const templates = [
  {
    name: "1L",
    rooms: [
      { name: "居室", type: "room", x: 80, y: 70, w: 720, h: 560 },
      { name: "トイレ", type: "toilet", x: 80, y: 630, w: 260, h: 120 },
      { name: "洗面", type: "wet", x: 820, y: 500, w: 260, h: 120 },
      { name: "収納", type: "storage", x: 820, y: 370, w: 260, h: 120 },
      { name: "ドア", type: "door", x: 480, y: 748, w: 260, h: 26 },
      { name: "ベッド", type: "bed", x: 150, y: 105, w: 260, h: 380 },
      { name: "TV", type: "furniture", x: 890, y: 120, w: 90, h: 260 }
    ]
  },
  {
    name: "1DK",
    rooms: [
      { name: "洋室", type: "room", x: 70, y: 70, w: 500, h: 360 },
      { name: "DK", type: "room", x: 570, y: 70, w: 520, h: 360 },
      { name: "玄関", type: "entry", x: 570, y: 620, w: 220, h: 120 },
      { name: "トイレ", type: "toilet", x: 70, y: 500, w: 220, h: 210 },
      { name: "浴室", type: "wet", x: 820, y: 500, w: 270, h: 210 },
      { name: "収納", type: "storage", x: 310, y: 500, w: 230, h: 210 }
    ]
  },
  {
    name: "1LDK",
    rooms: [
      { name: "寝室", type: "room", x: 70, y: 70, w: 360, h: 300 },
      { name: "LDK", type: "room", x: 430, y: 70, w: 660, h: 430 },
      { name: "廊下", type: "hall", x: 70, y: 370, w: 1020, h: 90 },
      { name: "トイレ", type: "toilet", x: 70, y: 500, w: 200, h: 220 },
      { name: "洗面", type: "wet", x: 300, y: 500, w: 220, h: 220 },
      { name: "浴室", type: "wet", x: 540, y: 500, w: 240, h: 220 },
      { name: "玄関", type: "entry", x: 820, y: 590, w: 270, h: 130 }
    ]
  },
  {
    name: "2LDK",
    rooms: [
      { name: "洋室1", type: "room", x: 70, y: 70, w: 330, h: 270 },
      { name: "洋室2", type: "room", x: 70, y: 360, w: 330, h: 270 },
      { name: "LDK", type: "room", x: 430, y: 70, w: 660, h: 380 },
      { name: "廊下", type: "hall", x: 430, y: 450, w: 660, h: 90 },
      { name: "トイレ", type: "toilet", x: 430, y: 560, w: 190, h: 170 },
      { name: "洗面", type: "wet", x: 650, y: 560, w: 210, h: 170 },
      { name: "浴室", type: "wet", x: 880, y: 560, w: 210, h: 170 },
      { name: "玄関", type: "entry", x: 70, y: 650, w: 330, h: 90 }
    ]
  }
];

let rooms = [];

function toggleTemplatePanel() {
  document.getElementById("templateBlock").classList.toggle("open");
}

function renderTemplateButtons() {
  const wrap = document.getElementById("templateBtns");
  wrap.innerHTML = "";
  templates.forEach((tpl) => {
    const btn = document.createElement("button");
    btn.className = "preset-btn";
    btn.textContent = tpl.name;
    btn.onclick = () => applyTemplate(tpl);
    wrap.appendChild(btn);
  });
}

function applyTemplate(template) {
  rooms = template.rooms.map((room) => ({ ...room }));
  clearItemCanvas();
  showToast(`${template.name} を選択しました`);
}

function loadDefaultTemplate() {
  applyTemplate(templates[0]);
}

function clearItemCanvas() {
  const canvas = document.getElementById("itemCanvas");
  const context = canvas.getContext("2d");
  context.fillStyle = "#ffffff";
  context.fillRect(0, 0, canvas.width, canvas.height);
}

function clearAll() {
  rooms = [];
  clearItemCanvas();
  showToast("見取り図をリセットしました");
}

function showToast(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => el.classList.remove("show"), 1800);
}

async function exportPNG() {
  const canvas = document.getElementById("itemCanvas");
  const fileName = `見取り図_${new Date().toISOString().slice(0, 10)}.png`;
  try {
    if (window.showSaveFilePicker) {
      const handle = await window.showSaveFilePicker({
        suggestedName: fileName,
        types: [{ description: "PNG画像", accept: { "image/png": [".png"] } }]
      });
      const writable = await handle.createWritable();
      const pngBlob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      await writable.write(pngBlob);
      await writable.close();
      showToast("見取り図を保存しました");
    } else {
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = fileName;
      a.click();
      showToast("見取り図をダウンロードしました");
    }
  } catch (error) {
    if (error && error.name !== "AbortError") alert("保存に失敗しました。");
  }
}

renderTemplateButtons();
clearItemCanvas();
</script>
</body>
</html>
