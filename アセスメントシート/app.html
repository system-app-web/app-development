-bottom:1px solid #dce0ea}.tabs button{border-color:transparent;background:transparent;color:#555e79}.tabs button.active{color:#3d4f8d;border-color:#adb9df;background:#e9edfa;font-weight:700}.review-count{margin-left:auto;padding:6px 12px;color:#765900;border:1px solid #ebcb60;border-radius:20px;background:#fff5c9;font-size:13px}.message{display:none;justify-content:space-between;max-width:960px;margin:12px auto 0;padding:10px 14px;color:#38502c;border:1px solid #b6d3a6;border-radius:7px;background:#eef8e9;font-size:13px}.message.show{display:flex}.message button{padding:0 5px;border:0;background:transparent}.docs{padding:28px 32px 80px}.paper{width:min(100%,1000px);margin:0 auto 28px;padding:24px 28px 32px;background:#fff;box-shadow:0 1px 4px rgba(26,34,55,.16)}.header{display:flex;justify-content:space-between;padding:0 4px 10px;border-bottom:2px solid #202020}.header strong,.header span{display:block}.header strong{font-size:18px}.header span{margin-top:3px;font-size:16px}.meta{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #222;border-left:1px solid #222}.section{margin-top:10px}.section h3{margin:0;padding:2px 4px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #252525;border-left:1px solid #252525}.field{display:grid;grid-template-columns:minmax(94px,39%) 1fr;min-height:42px;border-right:1px solid #252525;border-bottom:1px solid #252525}.field>span,.manual>span{display:flex;align-items:center;gap:5px;padding:5px 7px;background:#c7c7f2;font-size:12px;line-height:1.25}.field small{color:#575b8d;font-size:10px}.field input,.field textarea,.manual input,.manual textarea{width:100%;min-width:0;padding:6px;outline:0;border:0;resize:vertical;background:#fff;font-size:13px}.field.wide{grid-column:1/-1;grid-template-columns:minmax(138px,20%) 1fr;min-height:96px}.field textarea{min-height:82px}.review{background:#fff61d!important}.manual{display:grid;grid-template-columns:150px 1fr;min-height:42px;border-right:1px solid #222;border-bottom:1px solid #222}.manual.multi{min-height:120px}.manual.multi textarea{min-height:120px}.diagram{display:grid;grid-template-columns:1fr 1fr;gap:12px}.diagram>div{padding:12px;border:1px solid #252525}.diagram h3{padding:0}.diagram p{min-height:38px;margin:6px 0 10px;font-size:12px;line-height:1.5}.connection h1{margin:0;text-align:center;font-size:26px}.sub{margin:8px 0 15px;text-align:center;font-size:13px}.block{margin-top:15px;border:2px solid #222}.block h2{margin:0;padding:7px 10px;color:#fff;background:#777;font-size:18px}.block>.grid{border:0}.modal-bg{position:fixed;z-index:10;inset:0;display:none;place-items:center;padding:24px;background:rgba(17,24,42,.48)}.modal-bg.open{display:grid}.modal{width:min(720px,100%);padding:24px;border-radius:12px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.3)}.modal h2{margin:0;color:#27355f}.modal p{color:#5d6577;font-size:13px;line-height:1.6}.modal textarea{width:100%;height:330px;padding:12px;border:1px solid #bbc2d6;border-radius:6px;resize:vertical}.modal footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.hidden{display:none!important}@media print{@page{size:A4 portrait;margin:7mm}body{min-width:0;background:#fff}.no-print,aside{display:none!important}.app{display:block}.docs{padding:0}.paper{width:100%;margin:0;padding:0;box-shadow:none}.form-page{break-after:page}.header strong{font-size:14px}.header span,.header b{font-size:13px}.section{margin-top:4px}.section h3{font-size:12px}.field{min-height:27px}.field>span,.manual>span{padding:3px;font-size:9px}.field input,.field textarea,.manual input,.manual textarea{padding:3px;font-size:9px}.field textarea{min-height:45px}.field.wide{min-height:50px}.manual.multi,.manual.multi textarea{min-height:60px}.connection h1{font-size:19px}.block h2{padding:4px 6px;font-size:12px}}

<body>
  <main class="app">
    <aside class="no-print"><div class="brand"><div class="icon">✓</div><div><b>アセスメントシート</b><small>端末内保存・単体HTML版</small></div></div><button class="primary" id="new">＋ 新規アセスメント</button><div class="records-title"><span>利用者・履歴</span><small id="record-count"></small></div><div class="records" id="records"></div><div class="note">このPCのこのブラウザ内だけに保存されます。別のPCには共有されません。</div></aside>
    <section><header class="toolbar no-print"><div class="title"><input id="record-title" aria-label="アセスメントの題名" /><small id="updated"></small></div><div class="actions"><button id="paste">AI結果を貼り付け</button><button id="duplicate">複製</button><button id="save">保存</button><button id="import">ファイル読込</button><button id="print">PDF保存・印刷</button></div><input id="file-input" type="file" accept="application/json" hidden /></header><nav class="tabs no-print" id="tabs"><button data-tab="sheet" class="active">エクセルシート</button><button data-tab="admission">入院時連携</button><button data-tab="discharge">退院時連携</button><button data-tab="face">フェイスシート</button><div class="review-count">要確認 <b id="review-count">159</b></div></nav><div class="message no-print" id="message"><span></span><button>×</button></div><div class="docs" id="docs"></div></section>
  </main>
  <div class="modal-bg no-print" id="modal"><section class="modal"><h2>Google AI Studioの結果を貼り付け</h2><p>159行の値のみの出力をそのまま貼り付けてください。番号付きのMarkdown行にも対応します。</p><textarea id="paste-text" placeholder="ここにAIの出力を貼り付けます"></textarea><footer><button id="cancel">キャンセル</button><button class="primary" id="apply">自動転記する</button></footer></section></div>
  <script>
  (() => {
    const labels = ["氏名","フリガナ","性別","生年月日","郵便番号","住所","電話番号","家族氏名","続柄","緊急連絡氏名(家族)","家族住所","家族連絡先","主治医名","医療機関名・病院名","医療機関連絡先","これまでの生活","現在の状況","利用者の主訴・意向","家族の主訴・意向","介護保険認定情報・被保険者番号","要介護度","認定年月日","負担割合","認定の有効期間","障害日常生活自立度・医師","障害日常生活自立度・認定調査票","認知症日常生活自立度・医師","認知症日常生活自立度・認定調査票","a病名","a発症時期(年月)","a病院名","a主治医名","b病名","b発症時期(年月)","b病院名","b主治医名","c病名","c発症時期(年月)","c病院名","c主治医名","d病名","d発症時期(年月)","d病院名","d主治医名","e病名","e発症時期(年月)","e病院名","e主治医名","身長","体重","麻痺","褥瘡","服薬状況","薬局名","健康状態に対する特記、解決すべき課題など","寝返り","起き上がり","座位保持","立ち上がり","立位保持","移乗","屋内歩行","使用器具(屋内)","屋外歩行","使用器具(屋外)","階段移動","ADLに対する特記、解決すべき課題など","排泄の場所","排尿動作","尿意","尿失禁の有無","排便動作","便意","便失禁","排泄に対する特記、解決すべき課題など","入浴動作","入浴の頻度","衣類の着脱","爪切りの動作","爪の状態","洗顔の動作","整髪の動作","清潔保持に対する特記、解決すべき課題など","歯磨きの状況","残存歯","義歯の有無","口腔内の状態","口臭の有無","義歯の場所","口腔内に対する特記、解決すべき課題など","食事・水分摂取の動作","食事形態","水分とろみ","1日の食事回数","嚥下","栄養状態","食事制限","水分制限","食事摂取に対する特記、解決すべき課題など","調理","掃除","洗濯","買物","服薬管理","金銭管理","電話の利用","交通機関の利用","IADLに対する特記、解決すべき課題など","意思疎通","視力","眼鏡の利用有無","聴力","補聴器使用の有無","意思伝達方法","コミュニケーションに対する特記、解決すべき課題など","日常の意思決定","認知症の診断","原因疾患","中核症状・記憶障がい","理解・判断力の低下","見当識障害","失語","失認","失行","被害的","作話","感情が不安定","暴力・攻撃性","大声を出す","介護に抵抗","一人で出たがる","収集癖","物や衣類を壊す","不潔行為","話がまとまらない","徘徊の有無","昼夜逆転","独り言、一人笑い","危険行為","認知機能や判断能力に対する特記、解決すべき課題など","家庭内の役割","家族等との関わり","地域との関わり","仕事での関わり","社会との関わりに対する特記、解決すべき課題など","家族との関係性","仕事の有無","家族の支援への参加意思","現在の心身、経済的負担感","家族等の状況に対する特記、解決すべき課題など","居住の形態（戸建てか集合住宅か）","エレベーターの有無","浴室の有無","ペットの有無","住宅内の手すりの設置の有無","危険個所の有無","住宅改修の必要性の有無","居住環境に対する特記、解決すべき課題など","全体のまとめ・総括"];
    const long = new Set([16,17,18,19,55,67,75,83,90,99,108,115,140,145,150,158,159]);
    const groups = {basic:[["利用者等基本情報",1,15],["これまでの生活と現在の状況",16,19],["認定情報",20,28]],health:[["既往歴・主傷病・受診状況",29,55],["ADL",56,67],["排泄の状況",68,75],["清潔の保持に関する状況",76,83],["口腔内の状況",84,90],["食事摂取の状況",91,99]],living:[["IADL",100,108],["コミュニケーションにおける理解と表出の状況",109,115],["認知機能や判断能力",116,140],["社会との関わり",141,145],["家族等の状況",146,150],["居住環境",151,158],["全体のまとめ",159,159]]};
    const KEY = "assessment-html-local-v1"; let records = []; let active = ""; let tab = "sheet";
    const $ = s => document.querySelector(s); const review = v => !v || !v.trim() || v.trim()==="記載なし" || v.trim()==="詳細不明";
    const todayTitle = () => { const d=new Date(); return `R${d.getFullYear()-2018}.${d.getMonth()+1}.${d.getDate()}　未入力様アセスメント（認定更新）`; };
    const newRecord = () => ({id:crypto.randomUUID(),title:todayTitle(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),fields:{}});
    const current = () => records.find(r=>r.id===active) || records[0]; const persist=()=>localStorage.setItem(KEY,JSON.stringify(records));
    function notice(text){ $("#message span").textContent=text; $("#message").classList.add("show"); }
    function update(change){ const r=current(); if(!r)return; Object.assign(r,change); r.updatedAt=new Date().toISOString(); persist(); renderChrome(); }
    function setField(id,value){ const r=current(); r.fields[id]=value; if(String(id)==="1" && value.trim() && r.title.includes("未入力様アセスメント")) r.title=r.title.replace("未入力様アセスメント",`${value.trim()}様アセスメント`); r.updatedAt=new Date().toISOString(); persist(); renderChrome(); }
    function field(id){ const value=current().fields[id]||""; const el=document.createElement("label"); el.className="field"+(long.has(+id)?" wide":""); const label=document.createElement("span"); label.innerHTML=`<small>${id}</small>${labels[id-1]}`; const input=document.createElement(long.has(+id)?"textarea":"input"); input.value=value; if(review(value)) input.classList.add("review"); input.addEventListener("input",e=>{e.target.classList.toggle("review",review(e.target.value));setField(id,e.target.value)}); el.append(label,input); return el; }
    function manual(label,id,multi=false){const value=current().fields[id]||"";const el=document.createElement("label");el.className="manual"+(multi?" multi":"");const t=document.createElement("span");t.textContent=label;const input=document.createElement(multi?"textarea":"input");input.value=value;if(review(value))input.classList.add("review");input.addEventListener("input",e=>{e.target.classList.toggle("review",review(e.target.value));setField(id,e.target.value)});el.append(t,input);return el}
    function grid(from,to){const el=document.createElement("div");el.className="grid";for(let i=from;i<=to;i++)el.append(field(i));return el}
    function section(title,from,to){const el=document.createElement("section");el.className="section";el.innerHTML=`<h3>【${title}】</h3>`;el.append(grid(from,to));return el}
    function header(n,title){const h=document.createElement("header");h.className="header";h.innerHTML=`<div><strong>株式会社K.T.M　リーフケアプランニング　アセスメントシート</strong><span>${title}</span></div><b>${n}</b>`;return h}
    function sheet(title,n,items){const p=document.createElement("section");p.className="paper form-page";p.append(header(n,title));items.forEach(x=>p.append(section(...x)));return p}
    function renderSheets(){const out=document.createDocumentFragment();const one=sheet("基本情報に関する項目","No.1",groups.basic);const meta=document.createElement("div");meta.className="meta";meta.append(manual("今回のアセスメントの理由","reason"),manual("作成年月日","created-date"));one.insertBefore(meta,one.children[1]);const services=document.createElement("section");services.className="section";services.innerHTML="<h3>現在利用している支援や社会資源の状況</h3>";services.append(manual("現在利用中のサービス・事業所名","services",true));one.append(services);const diagram=document.createElement("section");diagram.className="section diagram";diagram.innerHTML="<div><h3>家族構成図</h3><p>かんたんジェノグラムで作成した図のURLを記録します。図の自動貼り付けは次の段階で追加します。</p></div><div><h3>住宅見取り図</h3><p>シンプル見取り図で作成した図のURLを記録します。図の自動貼り付けは次の段階で追加します。</p></div>";diagram.children[0].append(manual("かんたんジェノグラムURL","genogram-url"));diagram.children[1].append(manual("シンプル見取り図URL","floorplan-url"));one.append(diagram);out.append(one,sheet("課題分析（アセスメント）に関する項目","No.2",groups.health),sheet("課題分析（アセスメント）に関する項目","No.3",groups.living));return out}
    function connection(title,subtitle,sets,extras=[]){const p=document.createElement("section");p.className="paper connection";p.innerHTML=`<h1>${title}</h1>${subtitle?`<p class="sub">${subtitle}</p>`:""}`;sets.forEach(([name,ranges])=>{const s=document.createElement("section");s.className="block";s.innerHTML=`<h2>${name}</h2>`;const g=document.createElement("div");g.className="grid";ranges.forEach(([a,b])=>{for(let i=a;i<=b;i++)g.append(field(i))});s.append(g);p.append(s)});extras.forEach(([l,id])=>p.lastElementChild.append(manual(l,id,true)));return p}
    function render(){const d=$("#docs");d.textContent="";if(tab==="sheet")d.append(renderSheets());if(tab==="admission")d.append(connection("フェースシート・情報提供書","入院時連携用　利用者（患者）／家族の同意に基づく情報提供",[["1. 利用者（患者）基本情報について",[[1,28]]],["2. 身体・生活機能の状況／療養上の課題について",[[49,99],[109,140]]]],[["生活歴及び直近2週間以内の心身状況","admission-note"]]));if(tab==="discharge")d.append(connection("退院・退所情報記録書","",[["1. 基本情報・現在の状態 等",[[1,7],[21,21],[29,55],[56,99],[116,140]]],["2. 課題認識のための情報",[]]],[["入退院日・入院経緯","discharge-stay"],["退院後の生活に関する本人・家族の意向","discharge-wishes"],["医療処置の内容","medical-care"],["看護の視点","nursing"],["リハビリの視点","rehabilitation"],["備考","discharge-notes"]]));if(tab==="face")d.append(connection("フェイスシート","このページは作成準備中です。自動転記可能な基本情報を先に表示しています。",[["基本情報",[[1,15],[20,28],[49,54]]],["追加入力",[]]],[["フェイスシート用の特記事項","face-note"]]));renderChrome()}
    function renderChrome(){const r=current();if(!r)return;$("#record-title").value=r.title;$("#updated").textContent="最終保存: "+new Date(r.updatedAt).toLocaleString("ja-JP");$("#review-count").textContent=labels.filter((_,i)=>review(r.fields[i+1])).length;$("#record-count").textContent=records.length+"件";const list=$("#records");list.textContent="";records.forEach(x=>{const b=document.createElement("button");b.className="record"+(x.id===r.id?" active":"");b.innerHTML=`<b>${x.fields[1]||"氏名未入力"}</b><span>${x.title}</span>`;b.onclick=()=>{active=x.id;render()};list.append(b)});document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab))}
    function apply(){const lines=$("#paste-text").value.replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean), numbered=lines.map(x=>x.match(/^(?:[-*]\s*)?(\d{1,3})[.．:：\s]+(.+)$/)).filter(Boolean);const values={};if(numbered.length>=20)numbered.forEach(m=>{if(+m[1]<=159)values[m[1]]=m[2].replace(/^[-*]\s*/,"")});else lines.slice(0,159).forEach((x,i)=>values[i+1]=x.replace(/^[-*]\s*/,""));const count=Object.keys(values).length;if(!count)return notice("貼り付け内容を読み取れませんでした。Google AI Studioの159行の出力を貼り付けてください。");Object.assign(current().fields,values);if(values[1]&&current().title.includes("未入力様アセスメント"))current().title=current().title.replace("未入力様アセスメント",`${values[1]}様アセスメント`);current().updatedAt=new Date().toISOString();persist();$("#modal").classList.remove("open");$("#paste-text").value="";notice(`${count}項目を転記しました。黄色の項目を確認してください。`);render()}
    $("#new").onclick=()=>{const r=newRecord();records.unshift(r);active=r.id;persist();notice("新しいアセスメントを作成しました。");render()};$("#duplicate").onclick=()=>{const r=JSON.parse(JSON.stringify(current()));r.id=crypto.randomUUID();r.title=r.title.replace(/（認定更新）$/,"（認定更新・コピー）");r.createdAt=r.updatedAt=new Date().toISOString();records.unshift(r);active=r.id;persist();notice("複製を作成しました。");render()};$("#record-title").oninput=e=>update({title:e.target.value});$("#paste").onclick=()=>$("#modal").classList.add("open");$("#cancel").onclick=()=>$("#modal").classList.remove("open");$("#apply").onclick=apply;$("#print").onclick=()=>window.print();$("#message button").onclick=()=>$("#message").classList.remove("show");$("#tabs").onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render()}};
    $("#save").onclick=()=>{const r=current(),blob=new Blob([JSON.stringify(r,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=r.title.replace(/[\\/:*?\"<>|]/g,"_")+".json";a.click();URL.revokeObjectURL(a.href);notice("このアセスメントをファイルとして保存しました。アプリ内の履歴にも保存されています。")};$("#import").onclick=()=>$("#file-input").click();$("#file-input").onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const r=JSON.parse(reader.result);if(!r.fields||!r.title)throw 0;r.id=crypto.randomUUID();r.updatedAt=new Date().toISOString();records.unshift(r);active=r.id;persist();notice("保存済みファイルを読み込みました。");render()}catch{notice("アセスメントシートから保存したJSONファイルを選んでください。")}};reader.readAsText(file);e.target.value=""};
    try{records=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{}if(!records.length)records=[newRecord()];active=records[0].id;render();
  })();
  </script>
</body>
