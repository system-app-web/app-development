    <aside class="no-print"><div class="brand"><div class="icon">✓</div><div><b>アセスメントシート</b><small>端末内保存・単体HTML版</small></div></div><button class="primary" id="new">＋ 新規アセスメント</button><nav class="tabs no-print" id="tabs" aria-label="ページ切り替え"><button data-tab="create">作成ページ</button><button data-tab="sheet">アセスメント No.1</button><button data-tab="sheet2">アセスメント No.2</button><button data-tab="sheet3">アセスメント No.3</button><button data-tab="admission">入院時連携</button><button data-tab="discharge">退院時連携</button><button data-tab="face">フェイスシート</button><div class="review-count">要確認 <b id="review-count">159</b></div></nav><div class="records-title"><span>利用者・履歴</span><small id="record-count"></small></div><div class="records" id="records"></div><div class="note">このPCのこのブラウザ内だけに保存されます。別のPCには共有されません。</div></aside>

  <script>
  /* IndexedDBの日次自動バックアップ。通常のlocalStorage保存を補完する。 */
  window.AssessmentSheetBackup = (() => {
    const DB_NAME="assessment_sheet_auto_backup", STORE="daily_snapshots", KEY="assessment-html-local-v1";

  <script>
    /* 既存の入力部品を並べ替えるため、保存や画像選択の処理はそのままです。 */
    (() => {
      const storageKey = "assessment-html-local-v1";
      const docs = document.querySelector("#docs");
      let airconInput = null;

      const currentRecord = () => {
        try {
          const records = JSON.parse(localStorage.getItem(storageKey) || "[]");
          return { records, record: records.find((item) => item.id === window.getActiveAssessmentId()) || records[0] };
        } catch {
          return { records: [], record: null };
        }
      };

      const saveAircon = () => {
        if (!airconInput?.isConnected) return;
        const data = currentRecord();
        if (!data.record) return;
        data.record.fields["housing-aircon"] = airconInput.value;
        data.record.updatedAt = new Date().toISOString();
        localStorage.setItem(storageKey, JSON.stringify(data.records));
      };

      const housingAircon = () => {
        const cell = document.createElement("label");
        cell.className = "field housing-field housing-aircon";
        cell.innerHTML = '<span><small>housing-aircon</small>エアコン</span>';
        const input = document.createElement("textarea");
        input.dataset.fieldId = "housing-aircon";
        input.rows = 1;
        input.value = currentRecord().record?.fields?.["housing-aircon"] || "";
        input.classList.toggle("review", !input.value.trim());
        input.addEventListener("input", () => {
          input.classList.toggle("review", !input.value.trim());
          saveAircon();
        });
        cell.append(input);
        airconInput = input;
        return cell;
      };

      const buildHousing = () => {
        const source = [...docs.querySelectorAll(".section-diagram")].find((item) => item.querySelector(".section h3")?.textContent.includes("居住環境"));
        if (!source) return;

        const fields = new Map([...source.querySelectorAll(".field")].map((item) => [item.querySelector("small")?.textContent.trim(), item]));
        if (!fields.has("151") || !fields.has("158")) return;

        const takeField = (id, title, className = "") => {
          const field = fields.get(id);
          field.className = `field housing-field ${className}`;
          field.querySelector(":scope > span").innerHTML = `<small>${id}</small>${title}`;
          return field;
        };

        const housing = document.createElement("section");
        housing.className = "housing-reference";
        housing.innerHTML = "<h3>【居住環境】</h3>";
        const grid = document.createElement("div");
        grid.className = "housing-grid";
        const plan = source.querySelector(".diagram-card");
        plan.classList.add("housing-floorplan");
        plan.querySelector("h3").textContent = "住宅見取り図";
        const openPlan = plan.querySelector(".diagram-actions button:last-child");
        if (openPlan) {
          openPlan.textContent = "シンプル見取り図を開く";
          openPlan.onclick = () => window.open("https://easy-floor-plan.vercel.app", "_blank", "noopener");
        }
        plan.querySelector(".diagram-url")?.remove();
        plan.querySelector(".hint")?.remove();
        grid.append(
          takeField("151", "家屋の形態"),
          takeField("152", "エレベーター"),
          plan,
          takeField("153", "浴室"),
          housingAircon(),
          takeField("154", "ペット"),
          takeField("155", "手すり"),
          takeField("156", "危険箇所"),
          takeField("157", "住宅改修の必要性"),
          takeField("158", "特記、解決すべき課題など", "housing-note")
        );
        housing.append(grid);
        source.replaceWith(housing);
      };

      document.addEventListener("input", () => queueMicrotask(saveAircon));
      new MutationObserver(buildHousing).observe(docs, { childList: true, subtree: true });
      buildHousing();
    })();
  </script>
  <script>
    (() => {
      const organizeReference = () => {
        const first = document.querySelector("#docs .reference-no1");
        const grid = first?.querySelector(".reference-grid:not(.reference-reason)");
        if (!grid || grid.previousElementSibling?.classList.contains("reference-reason")) return;
        const cells = [...grid.children];
        if (cells.length < 10) return;
        const reason = document.createElement("div");
        reason.className = "reference-grid reference-reason";
        cells.slice(0, 3).forEach((cell) => reason.append(cell));
        const receipt = document.createElement("div");
        receipt.className = "reference-grid reference-receipt";
        cells.slice(4, 12).forEach((cell) => receipt.append(cell));
        cells[11].classList.remove("span5");
        cells[11].classList.add("span6");
        const basicGroup = document.createElement("section");
        basicGroup.className = "reference-basic-group";
        const basicHeading = document.createElement("h3");
        basicHeading.textContent = "【基本情報】";
        const basic = document.createElement("div");
        basic.className = "reference-grid";
        cells.slice(12).forEach((cell) => basic.append(cell));
        basicGroup.append(basicHeading, basic);
        grid.replaceWith(reason, receipt, basicGroup);
      };
      const docs = document.querySelector("#docs");
      if (!docs) return;
      new MutationObserver(() => queueMicrotask(organizeReference)).observe(docs, { childList: true, subtree: true });
      organizeReference();
    })();
  </script>
  <script>
    (() => {
      const decorateHistory = () => {
        document.querySelectorAll(".assessment-entry").forEach((entry) => {
          if (entry.querySelector(".assessment-more")) return;
          const edit = entry.querySelector(".assessment-select");
          const remove = entry.querySelector(".assessment-delete");
          if (!edit || !remove) return;
          remove.classList.add("history-source-delete");
          const more = document.createElement("button");
          more.type = "button";
          more.className = "assessment-more";
          more.textContent = "…";
          more.setAttribute("aria-label", "アセスメントの操作メニュー");
          const menu = document.createElement("div");
          menu.className = "assessment-menu";
          const editAction = document.createElement("button");
          editAction.type = "button";
          editAction.textContent = "編集";
          editAction.onclick = () => edit.click();
          const deleteAction = document.createElement("button");
          deleteAction.type = "button";
          deleteAction.textContent = "削除";
          deleteAction.className = "danger";
          deleteAction.onclick = () => remove.click();
          menu.append(editAction, deleteAction);
          more.onclick = (event) => { event.stopPropagation(); document.querySelectorAll(".assessment-menu.open").forEach((item) => item !== menu && item.classList.remove("open")); menu.classList.toggle("open"); };
          entry.append(more, menu);
        });
      };
      const list = document.querySelector("#records");
      if (!list) return;
      new MutationObserver(decorateHistory).observe(list, { childList: true, subtree: true });
      document.addEventListener("click", (event) => { if (!event.target.closest(".assessment-entry")) document.querySelectorAll(".assessment-menu.open").forEach((menu) => menu.classList.remove("open")); });
      decorateHistory();
    })();
  </script>
  <script>
    (() => {
      const splitLifeSummary = () => {
        const basicGroup = document.querySelector("#docs .reference-basic-group");
        const grid = basicGroup?.querySelector(":scope > .reference-grid");
        if (!basicGroup || !grid || basicGroup.nextElementSibling?.classList.contains("life-summary-section")) return;
        const cells = [...grid.children];
        const start = cells.findIndex((cell) => cell.classList.contains("lower-section"));
        if (start < 0 || cells.length < start + 5) return;
        const build = (title, label, input) => {
          const section = document.createElement("section");
          section.className = "life-summary-section";
          const heading = document.createElement("h3");
          heading.textContent = `【${title}】`;
          const table = document.createElement("div");
          table.className = "reference-grid";
          table.append(label, input);
          section.append(heading, table);
          return section;
        };
        const life = build("これまでの生活", cells[start + 1], cells[start + 2]);
        const current = build("現在の状況", cells[start + 3], cells[start + 4]);
        cells[start].remove();
        basicGroup.after(life, current);
      };
      const docs = document.querySelector("#docs");
      if (!docs) return;
      new MutationObserver(() => queueMicrotask(splitLifeSummary)).observe(docs, { childList: true, subtree: true });
      splitLifeSummary();
    })();
  </script>
  <script>document.querySelector('#tabs [data-tab="sheet"]').textContent="アセスメントシート";</script>
  <script>
    /* 手動バックアップ／データ挿入は、日次自動バックアップの補助として使う。 */
    (() => {
      const KEY="assessment-html-local-v1", show=text=>{const box=document.querySelector("#message span");if(box){box.textContent=text;box.parentElement.classList.add("show")}};
      const data=()=>{try{return {records:JSON.parse(localStorage.getItem(KEY)||"[]"),active:""}}catch{return {records:[],active:""}}};
      document.querySelector("#save").onclick=()=>{const payload={app:"assessment-sheet",format:"backup",version:1,exportedAt:new Date().toISOString(),data:data()},blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download=`アセスメントシート_バックアップ_${window.AssessmentSheetBackup.dateKey()}.json`;link.click();URL.revokeObjectURL(link.href);show("バックアップファイルを保存しました。")};
      const file=document.querySelector("#file-input");document.querySelector("#import").onclick=()=>file.click();file.onchange=event=>{const selected=event.target.files[0];if(!selected)return;const reader=new FileReader();reader.onload=async()=>{try{const payload=JSON.parse(reader.result);let restored;if(payload?.app==="assessment-sheet"&&payload?.format==="backup"&&window.AssessmentSheetBackup.valid(payload.data)){restored=payload.data}else if(payload&&typeof payload.title==="string"&&payload.fields&&typeof payload.fields==="object"){const record={...payload,id:crypto.randomUUID(),updatedAt:new Date().toISOString()};restored={records:[record,...data().records],active:record.id}}else throw new Error("invalid");localStorage.setItem(KEY,JSON.stringify(restored.records));await window.AssessmentSheetBackup.save(restored);show("バックアップを復元しました。");setTimeout(()=>location.reload(),250)}catch{show("アセスメントシートの有効なバックアップファイルを選んでください。")}};reader.readAsText(selected);event.target.value=""};
    })();
  </script>
  <script>
    /* 入力内容を、欄の高さに対して常に縦中央へ配置する。 */
    (() => {
      const center = area => {
        if (area.id === "paste-text") return;
        const style = getComputedStyle(area), line = parseFloat(style.lineHeight) || 20, height = area.clientHeight;
        if (!height) return;
        const probe = area.cloneNode();
        probe.value = area.value || " "; probe.style.cssText = `position:fixed;visibility:hidden;left:-9999px;top:0;width:${area.clientWidth}px;height:0!important;min-height:0!important;max-height:none!important;padding:0!important;border:0!important;overflow:hidden!important`;
        document.body.append(probe); const content = Math.max(line, probe.scrollHeight); probe.remove();
        if (area.dataset.verticalAlign === "top" || (area.dataset.verticalAlign !== "middle" && area.dataset.verticalAlign !== "bottom" && content > line * 1.25)) { area.style.paddingTop = "6px"; area.style.paddingBottom = "6px"; return; }
        const padding = Math.max(6, Math.floor((height - content) / (area.dataset.verticalAlign === "bottom" ? 1 : 2)));
        area.style.paddingTop = `${padding}px`; area.style.paddingBottom = `${padding}px`;
      };
      window.AssessmentSheetCenterTextarea = center;
      const refresh = () => requestAnimationFrame(() => document.querySelectorAll("textarea").forEach(center));
      document.addEventListener("input", event => { if (!(event.target instanceof HTMLTextAreaElement)) return; event.target.style.paddingTop = "6px"; event.target.style.paddingBottom = "6px"; queueMicrotask(() => center(event.target)); }, true);
      new MutationObserver(refresh).observe(document.querySelector("#docs"), { childList:true, subtree:true });
      refresh();
    })();
  </script>
  <script>
    /* Excelのように、文字ではなくクリックしたセルそのものを選択状態にする。 */
    (() => {
      const selected = ".field.cell-selected,.manual.cell-selected";
      const selectCell = target => {
        const cell = target.closest?.(".field, .manual");
        if (!cell) return;
        document.querySelectorAll(selected).forEach(item => item.classList.remove("cell-selected"));
        cell.classList.add("cell-selected");
        const id = cell.querySelector("small")?.textContent?.trim();
        if (id) cell.dataset.cellId = id;
      };
      document.addEventListener("pointerdown", event => selectCell(event.target), true);
      document.addEventListener("focusin", event => selectCell(event.target));
    })();
  </script>
  <script>
    /* AI転記先のセル番号。番号は画面専用で、入力データ・印刷には含めない。 */
    (() => {
      const docs = document.querySelector("#docs");
      if (!docs) return;
      docs.classList.add("transfer-indexes-hidden");
      let map = [];
      let scheduled = false;
      const labelFor = cell => (cell.querySelector(":scope > span")?.textContent || cell.previousElementSibling?.textContent || "").replace(/\s+/g, " ").trim();
      const scan = () => {
        scheduled = false;
        map = [];
        docs.querySelectorAll("textarea").forEach(area => {
          const cell = area.closest(".field, .manual");
          if (!cell || area.id === "paste-text") return;
          const id = cell.querySelector("small")?.textContent?.trim() || area.dataset.fieldId || "";
          const number = id === "address-combined" ? 6 : id === "household" ? 160 : /^\d+$/.test(id) ? Number(id) : null;
          if (number === null) return;
          cell.dataset.transferTarget = String(number);
          area.dataset.transferTarget = String(number);
          let badge = cell.querySelector(":scope > .transfer-index-badge");
          if (!badge) {
            badge = document.createElement("span");
            badge.className = "transfer-index-badge no-print";
            badge.setAttribute("aria-hidden", "true");
            cell.append(badge);
          }
          if (badge.textContent !== String(number)) badge.textContent = String(number);
          map.push({ number, fieldId: id, label: labelFor(cell) });
        });
      };
      const schedule = () => {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(scan);
      };
      window.AssessmentTransferTargets = {
        setVisible(visible) { docs.classList.toggle("transfer-indexes-hidden", !visible); },
        getMap() { return map.map(item => ({ ...item })); },
        refresh: schedule
      };
      new MutationObserver(schedule).observe(docs, { childList:true, subtree:true });
      schedule();
    })();
  </script>
  <script>
    /* 全体のまとめの文字数を表示し、入力内容は変更しない。 */
    (() => {
      const docs = document.querySelector("#docs");
      const update = area => {
        if (area?.dataset.fieldId !== "159") return;
        const cell = area.closest(".field");
        if (!cell) return;
        let warning = cell.querySelector(".summary-length-warning");
        const count = Array.from(area.value).length;
        if (count <= 250) { warning?.remove(); return; }
        if (!warning) {
          warning = document.createElement("span");
          warning.className = "summary-length-warning no-print";
          warning.setAttribute("role", "status");
          cell.append(warning);
        }
        const message = `250字を超えています（今${count}字）`;
        if (warning.textContent !== message) warning.textContent = message;
      };
      docs.addEventListener("input", event => update(event.target));
      new MutationObserver(() => docs.querySelectorAll('textarea[data-field-id="159"]').forEach(update))
        .observe(docs, {childList:true, subtree:true});
    })();
  </script>
