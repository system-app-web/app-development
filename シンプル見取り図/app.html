      C ${room.w * 0.68} ${room.h * 0.77}, ${room.w * 0.6} ${room.h * 0.85}, ${room.w * 0.5} ${room.h * 0.85}
      C ${room.w * 0.4} ${room.h * 0.85}, ${room.w * 0.32} ${room.h * 0.77}, ${room.w * 0.3} ${room.h * 0.63}
      C ${room.w * 0.28} ${room.h * 0.5}, ${room.w * 0.35} ${room.h * 0.4}, ${room.w * 0.5} ${room.h * 0.4} Z`, stroke, "stroke-width": Math.max(1, line * 0.6) });
    return;
  }
  if (room.type === "bathSquare" || room.type === "bathRect") {
    const square = room.type === "bathSquare";
    const outerY = square ? room.h * 0.05 : room.h * 0.13;
    const outerH = square ? room.h * 0.9 : room.h * 0.74;
    const innerY = square ? room.h * 0.16 : room.h * 0.25;
    const innerH = square ? room.h * 0.68 : room.h * 0.5;
    rect({ x: room.w * 0.05, y: outerY, width: room.w * 0.9, height: outerH, rx: room.h * 0.17, fill: accent });
    rect({ x: room.w * 0.16, y: innerY, width: room.w * 0.68, height: innerH, rx: room.h * 0.22, fill: "#fff", "stroke-width": Math.max(1, line * 0.6) });
    circle({ cx: room.w * 0.72, cy: innerY + innerH * 0.7, r: Math.min(room.w, room.h) * 0.035, fill: accent, "stroke-width": Math.max(1, line * 0.5) });
    return;
  }
  if (room.type === "bath") {
    rect({ x: room.w * 0.04, y: room.h * 0.12, width: room.w * 0.92, height: room.h * 0.76, rx: room.h * 0.24, fill: "#f8fbfb" });
    rect({ x: room.w * 0.16, y: room.h * 0.28, width: room.w * 0.68, height: room.h * 0.42, rx: room.h * 0.2, fill: accent, stroke: "#b8cfcb", "stroke-width": Math.max(1, line * 0.6) });
    return;
  }
  if (room.type === "sink" || room.type === "stove") {
    rect({ x: room.w * 0.04, y: room.h * 0.08, width: room.w * 0.92, height: room.h * 0.82, rx: room.h * 0.08, fill: "#f8fbfb" });
    if (room.type === "sink") {
      group.appendChild(svgEl("ellipse", { cx: room.w * 0.43, cy: room.h * 0.53, rx: room.w * 0.24, ry: room.h * 0.23, fill: "#fff", stroke, "stroke-width": Math.max(1, line * 0.7) }));
      lineEl({ x1: room.w * 0.7, y1: room.h * 0.22, x2: room.w * 0.7, y2: room.h * 0.42, "stroke-width": Math.max(1, line * 0.65) });
    } else {
      [[0.31, 0.35], [0.69, 0.35], [0.31, 0.67], [0.69, 0.67]].forEach(([x, y]) => circle({ cx: room.w * x, cy: room.h * y, r: room.h * 0.12, fill: accent, stroke: "#9bb9b4", "stroke-width": Math.max(1, line * 0.55) }));
    }
    return;
  }
  if (room.type === "door") {
    rect({ x: room.w * 0.03, y: room.h * 0.15, width: room.w * 0.94, height: room.h * 0.7, rx: room.h * 0.12, fill: "#f8fbfb" });
    lineEl({ x1: room.w * 0.12, y1: room.h * 0.5, x2: room.w * 0.88, y2: room.h * 0.5, "stroke-width": Math.max(1, line * 0.6) });
    return;
  }
  if (["doorLeft", "doorRight", "doorIn", "doorOut"].includes(room.type)) {
    const hingeOnLeft = room.type === "doorLeft" || room.type === "doorIn";
    const opensToward = room.type === "doorIn";
    const hingeX = room.w * (hingeOnLeft ? 0.12 : 0.88);
    const leafX = room.w * (hingeOnLeft ? 0.82 : 0.18);
    const baseY = room.h * 0.82;
    const leafY = room.h * (opensToward ? 0.16 : 0.26);
    lineEl({ x1: room.w * 0.05, y1: baseY, x2: room.w * 0.95, y2: baseY, "stroke-width": Math.max(1, line * 0.7) });
    lineEl({ x1: hingeX, y1: baseY, x2: leafX, y2: leafY });
    const sweep = hingeOnLeft ? 1 : 0;
    pathEl({ d: `M ${hingeX} ${baseY} A ${room.w * 0.7} ${room.h * 0.7} 0 0 ${sweep} ${leafX} ${baseY}`, "stroke-dasharray": opensToward ? "3 2" : "" });
    return;
  }
  if (room.type === "slidingDoor") {
    rect({ x: room.w * 0.05, y: room.h * 0.26, width: room.w * 0.9, height: room.h * 0.48, rx: room.h * 0.06, fill: "#f8fbfb" });
    lineEl({ x1: room.w * 0.5, y1: room.h * 0.3, x2: room.w * 0.5, y2: room.h * 0.7 });
    pathEl({ d: `M ${room.w * 0.7} ${room.h * 0.5} H ${room.w * 0.3} M ${room.w * 0.3} ${room.h * 0.5} l ${room.w * 0.12} ${-room.h * 0.12} M ${room.w * 0.3} ${room.h * 0.5} l ${room.w * 0.12} ${room.h * 0.12}` });
    return;
  }
  if (room.type === "doubleSlidingDoor") {
    rect({ x: room.w * 0.05, y: room.h * 0.26, width: room.w * 0.9, height: room.h * 0.48, rx: room.h * 0.06, fill: "#f8fbfb" });
    [0.35, 0.65].forEach((x) => lineEl({ x1: room.w * x, y1: room.h * 0.3, x2: room.w * x, y2: room.h * 0.7 }));
    pathEl({ d: `M ${room.w * 0.48} ${room.h * 0.5} H ${room.w * 0.2} M ${room.w * 0.2} ${room.h * 0.5} l ${room.w * 0.1} ${-room.h * 0.12} M ${room.w * 0.2} ${room.h * 0.5} l ${room.w * 0.1} ${room.h * 0.12} M ${room.w * 0.52} ${room.h * 0.5} H ${room.w * 0.8} M ${room.w * 0.8} ${room.h * 0.5} l ${-room.w * 0.1} ${-room.h * 0.12} M ${room.w * 0.8} ${room.h * 0.5} l ${-room.w * 0.1} ${room.h * 0.12}` });
    return;
  }
  if (room.type === "windowItem") {
    rect({ x: room.w * 0.03, y: room.h * 0.18, width: room.w * 0.94, height: room.h * 0.64, rx: room.h * 0.08, fill: "#f6fcfd" });
    [0.35, 0.65].forEach((x) => lineEl({ x1: room.w * x, y1: room.h * 0.23, x2: room.w * x, y2: room.h * 0.77, "stroke-width": Math.max(1, line * 0.6) }));
    return;
  }
  if (room.type === "plant") {
    group.appendChild(svgEl("path", { d: `M ${room.w * 0.5} ${room.h * 0.57} C ${room.w * 0.1} ${room.h * 0.38}, ${room.w * 0.18} ${room.h * 0.04}, ${room.w * 0.5} ${room.h * 0.38} C ${room.w * 0.82} ${room.h * 0.04}, ${room.w * 0.9} ${room.h * 0.38}, ${room.w * 0.5} ${room.h * 0.57}`, fill: "#fff", stroke, "stroke-width": line, "stroke-linejoin": "round" }));
    rect({ x: room.w * 0.23, y: room.h * 0.55, width: room.w * 0.54, height: room.h * 0.35, rx: room.w * 0.08, fill: "#f8fbfb" });
    return;
  }
  if (room.type === "rug") {
    rect({ x: room.w * 0.04, y: room.h * 0.08, width: room.w * 0.92, height: room.h * 0.84, rx: room.h * 0.35, fill: "#fff", "stroke-width": Math.max(1, line * 0.7) });
  }
}

function renderFloorPlan(group, room) {
  const outline = svgEl("rect", {
    width: room.w,
    height: room.h,
    fill: "transparent",
    stroke: "#000",
    "stroke-width": FLOOR_PLAN_STROKE_WIDTH,
    "vector-effect": "non-scaling-stroke",
    class: "floor-plan-outline"
  });
  group.appendChild(outline);

  if (room.id === selectedRoomId) {
    const handleW = gridStep("x") * 0.36;
    const handleH = gridStep("y") * 0.36;
    const halfW = handleW / 2;
    const halfH = handleH / 2;
    const handles = [
      { corner: "nw", x: -halfW, y: -halfH, cursor: "nwse-resize" },
      { corner: "n", x: room.w / 2 - halfW, y: -halfH, cursor: "ns-resize" },
      { corner: "ne", x: room.w - halfW, y: -halfH, cursor: "nesw-resize" },
      { corner: "w", x: -halfW, y: room.h / 2 - halfH, cursor: "ew-resize" },
      { corner: "e", x: room.w - halfW, y: room.h / 2 - halfH, cursor: "ew-resize" },
      { corner: "sw", x: -halfW, y: room.h - halfH, cursor: "nesw-resize" },
      { corner: "s", x: room.w / 2 - halfW, y: room.h - halfH, cursor: "ns-resize" },
      { corner: "se", x: room.w - halfW, y: room.h - halfH, cursor: "nwse-resize" }
    ];
    handles.forEach(({ corner, x, y, cursor }) => {
      const handle = svgEl("rect", {
        x,
        y,
        width: handleW,
        height: handleH,
        rx: Math.min(handleW, handleH) * 0.2,
        fill: "#fff",
        stroke: "#3972ad",
        "stroke-width": 3,
        class: "floor-plan-handle"
      });
      handle.style.cursor = cursor;
      handle.addEventListener("pointerdown", (event) => startResize(event, room.id, corner));
      group.appendChild(handle);
    });
  }
}

function renderCanvasItemResizeHandles(group, room) {
  if (room.id !== selectedRoomId) return;
  const svg = document.getElementById("svg-main");
  const handleW = svg?.clientWidth ? 12 * (1200 / svg.clientWidth) : 12;
  const handleH = svg?.clientHeight ? 12 * (800 / svg.clientHeight) : 12;
  const halfW = handleW / 2;
  const halfH = handleH / 2;
  const handles = [
    { corner: "nw", x: -halfW, y: -halfH, cursor: "nwse-resize" },
    { corner: "ne", x: room.w - halfW, y: -halfH, cursor: "nesw-resize" },
    { corner: "sw", x: -halfW, y: room.h - halfH, cursor: "nesw-resize" },
    { corner: "se", x: room.w - halfW, y: room.h - halfH, cursor: "nwse-resize" }
  ];
  handles.forEach(({ corner, x, y, cursor }) => {
    const handle = svgEl("rect", {
      x,
      y,
      width: handleW,
      height: handleH,
      rx: Math.min(handleW, handleH) * 0.18,
      fill: "#fff",
      stroke: "#3972ad",
      "stroke-width": 2,
      class: "canvas-item-handle"
    });
    handle.style.cursor = cursor;
    handle.addEventListener("pointerdown", (event) => startResize(event, room.id, corner));
    group.appendChild(handle);
  });
}

function renderDoor(group, room) {
  group.appendChild(svgEl("rect", { width: room.w, height: room.h, fill: "#fff", stroke: "#000", "stroke-width": 3 }));
  group.appendChild(svgEl("line", { x1: 0, y1: room.h / 2, x2: room.w, y2: room.h / 2, stroke: "#000", "stroke-width": 3 }));
  addLabel(group, room.name, room.w / 2, room.h + 44, 42);
}

function renderFurniture(group, room) {
  group.appendChild(svgEl("rect", { width: room.w, height: room.h, fill: "#fff", stroke: "#000", "stroke-width": 5 }));
  group.appendChild(svgEl("line", { x1: room.w / 2, y1: 30, x2: room.w / 2, y2: room.h - 30, stroke: "#000", "stroke-width": 8 }));
  addLabel(group, room.name, -42, room.h / 2, 42);
}

function addLabel(group, text, x, y, size) {
  const label = svgEl("text", {
    x, y,
    "text-anchor": "middle",
    "font-size": size,
    "font-weight": 800,
    fill: "#000",
    "font-family": "Hiragino Sans, Yu Gothic UI, Meiryo, sans-serif"
  });
  label.textContent = text;
  group.appendChild(label);
}

function svgEl(name, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", name);
  Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
  if (attrs.stroke && attrs.stroke !== "none" && !attrs["vector-effect"]) {
    el.setAttribute("vector-effect", "non-scaling-stroke");
  }
  return el;
}

function renderAll(showHint = true) {
  renderSVG(showHint);
}

function startDrag(event, id) {
  if (currentPlaceMode || currentDrawMode) return;
  event.stopPropagation();
  clearDrawSelection();
  const room = rooms.find((item) => item.id === id);
  if (!room) return;
  selectedRoomId = id;
  renderAll(false);
  const draggedRoomIds = room.type === "floorplan"
    ? [room.id, ...rooms.filter((item) => isWallItem(item) && item.parentFloorPlanId === room.id).map((item) => item.id)]
    : [room.id];
  dragState = {
    id,
    startX: event.clientX,
    startY: event.clientY,
    moved: false,
    rooms: draggedRoomIds.map((roomId) => {
      const item = rooms.find((candidate) => candidate.id === roomId);
      return {
        id: item.id,
        x: item.x,
        y: item.y,
        gridX: item.gridX,
        gridY: item.gridY,
        itemGridX: item.itemGridX,
        itemGridY: item.itemGridY,
        parentFloorPlanId: item.parentFloorPlanId,
        parentFloorPlanOffsetX: item.parentFloorPlanOffsetX,
        parentFloorPlanOffsetY: item.parentFloorPlanOffsetY,
        parentFloorPlanReady: item.parentFloorPlanReady,
        autoCentered: item.autoCentered,
        autoPlaced: item.autoPlaced
      };
    })
  };
}

function startResize(event, id, corner) {
  if (currentPlaceMode) return;
  event.stopPropagation();
  event.preventDefault();
  const room = rooms.find((item) => item.id === id);
  if (!room) return;
  resizeState = {
    id,
    corner,
    startX: event.clientX,
    startY: event.clientY,
    origX: room.x,
    origY: room.y,
    origW: room.w,
    origH: room.h,
    origGridColumns: room.gridColumns,
    origGridRows: room.gridRows,
    origGridX: room.gridX,
    origGridY: room.gridY,
    origItemCols: room.itemCols,
    origItemRows: room.itemRows,
    origItemGridX: room.itemGridX,
    origItemGridY: room.itemGridY,
    origParentFloorPlanId: room.parentFloorPlanId,
    origParentFloorPlanOffsetX: room.parentFloorPlanOffsetX,
    origParentFloorPlanOffsetY: room.parentFloorPlanOffsetY,
    origParentFloorPlanReady: room.parentFloorPlanReady,
    origAutoCentered: room.autoCentered,
    origAutoPlaced: room.autoPlaced
  };
}

function gridStep(axis) {
  const svg = document.getElementById("svg-main");
  if (!svg) return GRID_PIXELS;
  return axis === "y"
    ? GRID_PIXELS * (800 / svg.clientHeight)
    : GRID_PIXELS * (1200 / svg.clientWidth);
}

function setCanvasZoom(nextZoom) {
  canvasZoom = Math.max(0.6, Math.min(1.8, Math.round(nextZoom * 10) / 10));
  updateCanvasGridAlignment();
  document.getElementById("canvas-zoom-level").textContent = `${Math.round(canvasZoom * 100)}%`;
}

function updateCanvasGridAlignment() {
  const wrap = document.querySelector(".canvas-wrap");
  wrap.style.setProperty("--canvas-zoom", canvasZoom);
  wrap.style.setProperty("--grid-size", `${GRID_PIXELS * canvasZoom}px`);
  wrap.style.setProperty("--grid-offset-x", `${(1 - canvasZoom) * wrap.clientWidth / 2}px`);
  wrap.style.setProperty("--grid-offset-y", `${(1 - canvasZoom) * wrap.clientHeight / 2}px`);
}

function adjustCanvasZoom(amount) {
  setCanvasZoom(canvasZoom + amount);
}

function pointInCanvasPixels(event) {
  const wrap = document.querySelector(".canvas-wrap");
  const bounds = wrap.getBoundingClientRect();
  return {
    x: (event.clientX - bounds.left - bounds.width * (1 - canvasZoom) / 2) / canvasZoom,
    y: (event.clientY - bounds.top - bounds.height * (1 - canvasZoom) / 2) / canvasZoom
  };
}

function snapToGrid(value, axis) {
  const step = gridStep(axis);
  return Math.round(value / step) * step;
}

function drawPathFromGridPoints(line, points) {
  const stepX = gridStep("x");
  const stepY = gridStep("y");
  line.dataset.gridPoints = JSON.stringify(points);
  line.setAttribute("d", `M ${points.map((point) => `${point.x * stepX} ${point.y * stepY}`).join(" L ")}`);
}

function getDrawPathGridPoints(line, fallbackStepX, fallbackStepY) {
  try {
    const saved = JSON.parse(line.dataset.gridPoints || "");
    if (Array.isArray(saved) && saved.length) return saved;
  } catch {
    // Lines created before grid coordinates were stored are migrated below.
  }
  const values = (line.getAttribute("d") || "").match(/-?\d+(?:\.\d+)?/g) || [];
  const points = [];
  for (let index = 0; index + 1 < values.length; index += 2) {
    points.push({
      x: Math.round(Number(values[index]) / fallbackStepX),
      y: Math.round(Number(values[index + 1]) / fallbackStepY)
    });
  }
  return points;
}

function syncDrawLinesToGrid() {
  const canvas = document.getElementById("svg-main");
  if (!canvas || !canvas.clientWidth || !canvas.clientHeight) return;
  const fallbackStepX = previousGridStepX || gridStep("x");
  const fallbackStepY = previousGridStepY || gridStep("y");
  document.querySelectorAll("#layer-draw path.canvas-draw").forEach((line) => {
    const points = getDrawPathGridPoints(line, fallbackStepX, fallbackStepY);
    if (points.length) drawPathFromGridPoints(line, points);
  });
}

function getItemDimensions(item) {
  return {
    w: item.cols * ITEM_SCALE * gridStep("x"),
    h: item.rows * ITEM_SCALE * gridStep("y")
  };
}

function createCanvasItem(item, x, y) {
  const { w, h } = getItemDimensions(item);
  const clampedX = Math.max(0, Math.min(1200 - w, x));
  const clampedY = Math.max(0, Math.min(800 - h, y));
  return createRoom({
    ...item,
    x: clampedX,
    y: clampedY,
    w,
    h,
    itemCols: item.cols * ITEM_SCALE,
    itemRows: item.rows * ITEM_SCALE,
    itemGridX: clampedX / gridStep("x"),
    itemGridY: clampedY / gridStep("y")
  });
}

function captureCanvasItemGrid(room) {
  const stepX = gridStep("x");
  const stepY = gridStep("y");
  snapWallItemToFloorPlan(room);
  room.itemCols = Math.max(0.1, room.w / stepX);
  room.itemRows = Math.max(0.1, room.h / stepY);
  room.itemGridX = Math.max(0, room.x / stepX);
  room.itemGridY = Math.max(0, room.y / stepY);
  attachCanvasItemToFloorPlan(room);
}

function copySelectedCanvasItem() {
  const room = rooms.find((item) => item.id === selectedRoomId);
  if (!room || !isCanvasItem(room)) return false;
  copiedCanvasItem = { ...room };
  return true;
}

function pasteCanvasItem() {
  if (!copiedCanvasItem) return false;
  const svg = document.getElementById("svg-main");
  const offsetX = svg?.clientWidth ? 24 * (1200 / svg.clientWidth) : 24;
  const offsetY = svg?.clientHeight ? 24 * (800 / svg.clientHeight) : 24;
  const room = createRoom({
    ...copiedCanvasItem,
    id: uid(),
    x: Math.max(0, Math.min(1200 - copiedCanvasItem.w, copiedCanvasItem.x + offsetX)),
    y: Math.max(0, Math.min(800 - copiedCanvasItem.h, copiedCanvasItem.y + offsetY)),
    parentFloorPlanId: null,
    parentFloorPlanOffsetX: null,
    parentFloorPlanOffsetY: null,
    parentFloorPlanReady: false
  });
  rooms.push(room);
  captureCanvasItemGrid(room);
  copiedCanvasItem = { ...room };
  selectedRoomId = room.id;
  actionHistory.push(() => {
    rooms = rooms.filter((item) => item.id !== room.id);
    if (selectedRoomId === room.id) selectedRoomId = null;
    renderAll(false);
  });
  renderAll(false);
  return true;
}

function isWallItem(room) {
  return room.type === "windowItem" || room.type === "door" || room.type.endsWith("Door") || room.type.startsWith("door");
}

function snapWallItemToFloorPlan(room) {
  if (!isWallItem(room)) return;
  const svg = document.getElementById("svg-main");
  if (!svg?.clientWidth || !svg.clientHeight) return;
  const thresholdX = 16 * (1200 / svg.clientWidth);
  const thresholdY = 16 * (800 / svg.clientHeight);
  const candidates = [];

  rooms.filter((candidate) => candidate.type === "floorplan").forEach((plan) => {
    const overlapsHorizontally = room.x + room.w > plan.x - thresholdX && room.x < plan.x + plan.w + thresholdX;
    const overlapsVertically = room.y + room.h > plan.y - thresholdY && room.y < plan.y + plan.h + thresholdY;
    if (overlapsHorizontally) {
      candidates.push({ edge: "top", distance: Math.abs(room.y - plan.y), plan });
      candidates.push({ edge: "bottom", distance: Math.abs(room.y + room.h - (plan.y + plan.h)), plan });
    }
    if (overlapsVertically) {
      candidates.push({ edge: "left", distance: Math.abs(room.x - plan.x), plan });
      candidates.push({ edge: "right", distance: Math.abs(room.x + room.w - (plan.x + plan.w)), plan });
    }
  });

  const nearest = candidates.sort((first, second) => first.distance - second.distance)[0];
  if (!nearest) return;
  const limit = nearest.edge === "top" || nearest.edge === "bottom" ? thresholdY : thresholdX;
  if (nearest.distance > limit) return;

  const { plan } = nearest;
  if (nearest.edge === "top") {
    room.x = Math.max(plan.x, Math.min(plan.x + plan.w - room.w, room.x));
    room.y = plan.y;
  } else if (nearest.edge === "bottom") {
    room.x = Math.max(plan.x, Math.min(plan.x + plan.w - room.w, room.x));
    room.y = plan.y + plan.h - room.h;
  } else if (nearest.edge === "left") {
    room.x = plan.x;
    room.y = Math.max(plan.y, Math.min(plan.y + plan.h - room.h, room.y));
  } else {
    room.x = plan.x + plan.w - room.w;
    room.y = Math.max(plan.y, Math.min(plan.y + plan.h - room.h, room.y));
  }
}

function isCanvasItem(room) {
  return Object.values(itemCatalog).some((item) => item.type === room.type);
}

function attachCanvasItemToFloorPlan(room, plans = rooms.filter((candidate) => candidate.type === "floorplan")) {
  if (!isCanvasItem(room)) return;
  if (!isWallItem(room)) {
    room.parentFloorPlanId = null;
    room.parentFloorPlanOffsetX = null;
    room.parentFloorPlanOffsetY = null;
    room.parentFloorPlanReady = true;
    return;
  }
  const definition = Object.values(itemCatalog).find((item) => item.type === room.type);
  room.itemCols ||= (definition?.cols || 1) * ITEM_SCALE;
  room.itemRows ||= (definition?.rows || 1) * ITEM_SCALE;
  room.itemGridX ??= Math.max(0, room.x / gridStep("x"));
  room.itemGridY ??= Math.max(0, room.y / gridStep("y"));
  const centerX = room.itemGridX + room.itemCols / 2;
  const centerY = room.itemGridY + room.itemRows / 2;
  const parent = plans.find((plan) => (
    plan.gridX !== null && plan.gridY !== null &&
    centerX >= plan.gridX && centerX < plan.gridX + plan.gridColumns &&
    centerY >= plan.gridY && centerY < plan.gridY + plan.gridRows
  ));
  room.parentFloorPlanId = parent?.id || null;
  room.parentFloorPlanOffsetX = parent ? room.itemGridX - parent.gridX : null;
  room.parentFloorPlanOffsetY = parent ? room.itemGridY - parent.gridY : null;
  room.parentFloorPlanReady = true;
}

function syncAttachedCanvasItemsToFloorPlans(plans, stepX, stepY) {
  rooms.filter(isWallItem).forEach((room) => {
    const parent = plans.find((plan) => plan.id === room.parentFloorPlanId);
    if (!parent || room.parentFloorPlanOffsetX === null || room.parentFloorPlanOffsetY === null) return;
    room.itemGridX = parent.gridX + room.parentFloorPlanOffsetX;
    room.itemGridY = parent.gridY + room.parentFloorPlanOffsetY;
    room.x = room.itemGridX * stepX;
    room.y = room.itemGridY * stepY;
  });
}

function syncCanvasItemsToGrid() {
  const canvas = document.getElementById("svg-main");
  if (!canvas || !canvas.clientWidth || !canvas.clientHeight) return;
  const stepX = gridStep("x");
  const stepY = gridStep("y");
  const fallbackStepX = previousGridStepX || stepX;
  const fallbackStepY = previousGridStepY || stepY;
  const catalog = Object.values(itemCatalog);

  rooms.forEach((room) => {
    const definition = catalog.find((item) => item.type === room.type);
    if (!definition) return;
    room.itemCols ||= definition.cols * ITEM_SCALE;
    room.itemRows ||= definition.rows * ITEM_SCALE;
    room.itemGridX ??= Math.max(0, room.x / fallbackStepX);
    room.itemGridY ??= Math.max(0, room.y / fallbackStepY);
    room.w = room.itemCols * stepX;
    room.h = room.itemRows * stepY;
    room.x = Math.max(0, Math.min(1200 - room.w, room.itemGridX * stepX));
    room.y = Math.max(0, Math.min(800 - room.h, room.itemGridY * stepY));
  });
}

function pointInSvg(event) {
  const svg = document.getElementById("svg-main");
  const bounds = svg.getBoundingClientRect();
  return {
    x: (event.clientX - bounds.left) * (1200 / bounds.width),
    y: (event.clientY - bounds.top) * (800 / bounds.height)
  };
}

function nearestGridEdge(point) {
  const stepX = gridStep("x");
  const stepY = gridStep("y");
  const x = snapToGrid(point.x, "x");
  const y = snapToGrid(point.y, "y");
  const horizontalDistance = Math.abs(point.y - y) / stepY;
  const verticalDistance = Math.abs(point.x - x) / stepX;
  if (horizontalDistance <= verticalDistance) {
    const column = Math.floor(point.x / stepX);
    return { x1: column * stepX, y1: y, x2: (column + 1) * stepX, y2: y };
  }
  const row = Math.floor(point.y / stepY);
  return { x1: x, y1: row * stepY, x2: x, y2: (row + 1) * stepY };
}

function startLineDraw(event) {
  if (currentDrawMode !== "line" || event.button !== 0) return;
  event.preventDefault();
  event.stopImmediatePropagation();
  const point = pointInSvg(event);
  const start = { x: snapToGrid(point.x, "x"), y: snapToGrid(point.y, "y") };
  const line = svgEl("path", {
    d: `M ${start.x} ${start.y}`,
    fill: "none",
    stroke: "#000",
    "stroke-width": LINE_STROKE_WIDTH,
    "vector-effect": "non-scaling-stroke",
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  });
  line.classList.add("canvas-draw");
  line.style.pointerEvents = "stroke";
  line.addEventListener("pointerdown", (lineEvent) => selectDrawElement(lineEvent, line));
  document.getElementById("layer-draw").appendChild(line);
  drawPathFromGridPoints(line, [{ x: Math.round(start.x / gridStep("x")), y: Math.round(start.y / gridStep("y")) }]);
  lineDrawState = { line, start, points: [start], moved: false };
}

function startTextDraw(event) {
  if (currentDrawMode !== "text" || event.button !== 0) return;
  event.preventDefault();
  event.stopImmediatePropagation();
  const canvasPoint = pointInCanvasPixels(event);
  const text = document.createElement("div");
  text.className = "canvas-text-editor canvas-text";
  text.style.left = `${canvasPoint.x}px`;
  text.style.top = `${canvasPoint.y}px`;
  text.dataset.fontSize = currentTextSize;
  text.dataset.direction = currentTextDir;
  text.contentEditable = "true";
  text.spellcheck = false;
  updateTextDrawElement(text);
  text.addEventListener("pointerdown", (textEvent) => startTextElementInteraction(textEvent, text));
  text.addEventListener("blur", () => {
    if (!text.textContent.trim()) {
      if (selectedDrawElement === text) clearDrawSelection();
      text.remove();
    }
  });
  text.addEventListener("input", () => {
    updateTextDrawElement(text);
    if (selectedDrawElement === text) showTextHandles(text);
  });
  document.getElementById("text-overlay").appendChild(text);
  actionHistory.push(() => {
    if (text.isConnected) text.remove();
    if (selectedDrawElement === text) clearDrawSelection();
  });
  setDrawMode("text");
  selectDrawElement(event, text, true);
  requestAnimationFrame(() => text.focus());
  showToast("方眼上で文字を入力してください");
}

function updateTextDrawElement(element) {
  const size = Number(element.dataset.fontSize) || currentTextSize;
  const vertical = element.dataset.direction === "v";
  element.style.fontSize = `${size}px`;
  element.style.writingMode = vertical ? "vertical-rl" : "horizontal-tb";
}

function updateAllTextDrawElements() {
  document.querySelectorAll("#text-overlay .canvas-text").forEach(updateTextDrawElement);
  if (selectedDrawElement?.classList.contains("canvas-text")) showTextHandles(selectedDrawElement);
}

function clearDrawSelection() {
  if (selectedDrawElement) selectedDrawElement.classList.remove("selected-draw");
  selectedDrawElement = null;
  document.querySelectorAll(".text-selection-controls").forEach((element) => element.remove());
}

function getTextBounds(element) {
  return {
    x: element.offsetLeft,
    y: element.offsetTop,
    width: element.offsetWidth,
    height: element.offsetHeight
  };
}

function showTextHandles(element) {
  document.querySelectorAll(".text-selection-controls").forEach((control) => control.remove());
  if (selectedDrawElement !== element || !element.isConnected) return;
  const bounds = getTextBounds(element);
  const group = document.createElement("div");
  group.className = "text-selection-controls";
  group.style.left = `${bounds.x}px`;
  group.style.top = `${bounds.y}px`;
  group.style.width = `${bounds.width}px`;
  group.style.height = `${bounds.height}px`;
  [
    { corner: "nw", left: "0%", top: "0%", cursor: "nwse-resize" },
    { corner: "ne", left: "100%", top: "0%", cursor: "nesw-resize" },
    { corner: "sw", left: "0%", top: "100%", cursor: "nesw-resize" },
    { corner: "se", left: "100%", top: "100%", cursor: "nwse-resize" }
  ].forEach(({ corner, left, top, cursor }) => {
    const handle = document.createElement("div");
    handle.className = "text-selection-handle";
    handle.style.left = left;
    handle.style.top = top;
    handle.style.transform = "translate(-50%, -50%)";
    handle.style.cursor = cursor;
    handle.addEventListener("pointerdown", (event) => startTextResize(event, element, corner));
    group.appendChild(handle);
  });
  document.getElementById("text-overlay").appendChild(group);
}

function startTextResize(event, element, corner) {
  event.preventDefault();
  event.stopPropagation();
  const bounds = getTextBounds(element);
  textResizeState = {
    element,
    corner,
    bounds,
    fontSize: Number(element.dataset.fontSize) || currentTextSize
  };
}

function startTextElementInteraction(event, element) {
  if (currentDrawMode || currentPlaceMode) return;
  event.preventDefault();
  event.stopPropagation();
  drawDragState = {
    element,
    startX: event.clientX,
    startY: event.clientY,
    origX: element.offsetLeft,
    origY: element.offsetTop,
    moved: false
  };
}

function activateDrawSelection(element) {
  selectedRoomId = null;
  clearDrawSelection();
  selectedDrawElement = element;
  element.classList.add("selected-draw");
  renderAll(false);
  if (element.classList.contains("canvas-text")) showTextHandles(element);
}

function selectDrawElement(event, element, keepFocus = false) {
  if (currentDrawMode || currentPlaceMode) return;
  if (!keepFocus) event.preventDefault();
  event.stopPropagation();
  activateDrawSelection(element);
}

function placeItemOnCanvas(event) {
  if (currentDrawMode) return;
  if (!currentPlaceMode) {
    clearDrawSelection();
    if (selectedRoomId) {
      selectedRoomId = null;
      renderAll(false);
    }
    return;
  }

  const item = getCanvasItem(currentPlaceMode);
  if (!item) return;

  const svg = event.currentTarget;
  const bounds = svg.getBoundingClientRect();
  const x = (event.clientX - bounds.left) * (1200 / bounds.width);
  const y = (event.clientY - bounds.top) * (800 / bounds.height);
  const { w, h } = getItemDimensions(item);
  const room = createCanvasItem(item, x - w / 2, y - h / 2);

  rooms.push(room);
  captureCanvasItemGrid(room);
  actionHistory.push(() => {
    rooms = rooms.filter((item) => item.id !== room.id);
    if (selectedRoomId === room.id) selectedRoomId = null;
    renderAll(false);
  });
  renderAll(false);
  clearPlaceMode();
  showToast(`${item.name}を配置しました`);
}

function addCanvasItem(mode) {
  const item = getCanvasItem(mode);
  if (!item) return;
  clearPlaceMode();
  const itemTypes = new Set(Object.values(itemCatalog).map((entry) => entry.type));
  const itemCount = rooms.filter((room) => itemTypes.has(room.type)).length;
  const offsetX = (itemCount % 3) * gridStep("x");
  const offsetY = (Math.floor(itemCount / 3) % 3) * gridStep("y");
  const { w, h } = getItemDimensions(item);
  const room = createCanvasItem(item, (1200 - w) / 2 + offsetX, (800 - h) / 2 + offsetY);
  rooms.push(room);
  captureCanvasItemGrid(room);
  selectedRoomId = room.id;
  actionHistory.push(() => {
    rooms = rooms.filter((candidate) => candidate.id !== room.id);
    if (selectedRoomId === room.id) selectedRoomId = null;
    renderAll(false);
  });
  renderAll(false);
  showToast(`${item.name}を配置しました`);
}

function findFloorPlanPosition(width, height) {
  const stepX = gridStep("x");
  const stepY = gridStep("y");
  const maxX = Math.max(0, 1200 - width);
  const maxY = Math.max(0, 800 - height);
  const startX = Math.min(maxX, stepX * 5);
  const startY = Math.min(maxY, stepY * 3);
  const plans = rooms.filter((room) => room.type === "floorplan");
  const overlaps = (x, y) => plans.some((room) => (
    x < room.x + room.w + stepX &&
    x + width + stepX > room.x &&
    y < room.y + room.h + stepY &&
    y + height + stepY > room.y
  ));
  const overlapsArea = (x, y) => plans.some((room) => (
    x < room.x + room.w &&
    x + width > room.x &&
    y < room.y + room.h &&
    y + height > room.y
  ));
  const attachedCandidates = plans.flatMap((room) => [
    { x: room.x + room.w, y: room.y },
    { x: room.x - width, y: room.y },
    { x: room.x, y: room.y + room.h },
    { x: room.x, y: room.y - height }
  ]);
  const attachedPosition = attachedCandidates.find(({ x, y }) => (
    x >= 0 && x <= maxX && y >= 0 && y <= maxY && !overlapsArea(x, y)
  ));
  if (attachedPosition) return attachedPosition;
  const findOpenSpot = (fromX, fromY) => {
    for (let y = fromY; y <= maxY; y += stepY) {
      for (let x = fromX; x <= maxX; x += stepX) {
        if (!overlaps(x, y)) return { x, y };
      }
    }
    return null;
  };
  return findOpenSpot(startX, startY) || findOpenSpot(0, 0) || { x: startX, y: startY };
}

function centerFloorPlan(room) {
  const stepX = gridStep("x");
  const stepY = gridStep("y");
  const columns = room.gridColumns || Math.max(1, Math.round(room.w / stepX));
  const rows = room.gridRows || Math.max(1, Math.round(room.h / stepY));

  room.gridColumns = columns;
  room.gridRows = rows;
  room.w = columns * stepX;
  room.h = rows * stepY;
  room.x = Math.max(0, Math.min(1200 - room.w, snapToGrid((1200 - room.w) / 2, "x")));
  room.y = Math.max(0, Math.min(800 - room.h, snapToGrid((800 - room.h) / 2, "y")));
  room.gridX = Math.round(room.x / stepX);
  room.gridY = Math.round(room.y / stepY);
}

function captureFloorPlanGrid(room) {
  const stepX = gridStep("x");
  const stepY = gridStep("y");
  room.gridColumns = Math.max(1, Math.round(room.w / stepX));
  room.gridRows = Math.max(1, Math.round(room.h / stepY));
  room.gridX = Math.max(0, Math.round(room.x / stepX));
  room.gridY = Math.max(0, Math.round(room.y / stepY));
}

function findOpenFloorPlanGridPosition(room, occupied, stepX, stepY) {
  const maxX = Math.max(0, Math.floor((1200 - room.w) / stepX));
  const maxY = Math.max(0, Math.floor((800 - room.h) / stepY));
  let best = null;

  for (let y = 0; y <= maxY; y += 1) {
    for (let x = 0; x <= maxX; x += 1) {
      const overlaps = occupied.some((other) => (
        x < other.gridX + other.gridColumns &&
        x + room.gridColumns > other.gridX &&
        y < other.gridY + other.gridRows &&
        y + room.gridRows > other.gridY
      ));
      if (overlaps) continue;

      const distance = Math.abs(x - room.gridX) + Math.abs(y - room.gridY);
      if (!best || distance < best.distance) best = { x, y, distance };
    }
  }

  return best;
}

function arrangeDefaultFloorPlanLayout(plans) {
  const defaultPlans = plans.filter((room) => room.autoPlaced !== false);
  defaultPlans.forEach((room, index) => {
    room.layoutIndex ??= index;
  });
  const firstPlan = defaultPlans.find((room) => room.layoutIndex === 0);
  if (!firstPlan) return;

  centerFloorPlan(firstPlan);
  const slots = {
    0: { column: 0, row: 0 },
    1: { column: 1, row: 0 },
    2: { column: 0, row: 1 },
    3: { column: 1, row: 1 }
  };
  const arrangedPlans = defaultPlans.filter((room) => slots[room.layoutIndex]);
  const columns = Math.max(...arrangedPlans.map((room) => slots[room.layoutIndex].column)) + 1;
  const rows = Math.max(...arrangedPlans.map((room) => slots[room.layoutIndex].row)) + 1;
  const groupLeft = snapToGrid((1200 - firstPlan.w * columns) / 2, "x");
  const groupTop = snapToGrid((800 - firstPlan.h * rows) / 2, "y");

  arrangedPlans.forEach((room) => {
    const slot = slots[room.layoutIndex];
    room.x = groupLeft + firstPlan.w * slot.column;
    room.y = groupTop + firstPlan.h * slot.row;
    room.gridX = Math.round(room.x / gridStep("x"));
    room.gridY = Math.round(room.y / gridStep("y"));
  });
}

function syncFloorPlansToGrid() {
  const canvas = document.getElementById("svg-main");
  if (!canvas || !canvas.clientWidth || !canvas.clientHeight) return;
  const stepX = gridStep("x");
  const stepY = gridStep("y");
  const fallbackStepX = previousGridStepX || stepX;
  const fallbackStepY = previousGridStepY || stepY;
  const plans = rooms.filter((room) => room.type === "floorplan");
  if (!plans.length) {
    previousGridStepX = stepX;
    previousGridStepY = stepY;
    return;
  }

  rooms.filter((room) => isWallItem(room) && !room.parentFloorPlanReady).forEach((room) => {
    attachCanvasItemToFloorPlan(room, plans);
  });

  plans.forEach((room) => {
    room.gridColumns ||= Math.max(1, Math.round(room.w / fallbackStepX));
    room.gridRows ||= Math.max(1, Math.round(room.h / fallbackStepY));
    room.gridX ??= Math.max(0, Math.round(room.x / fallbackStepX));
    room.gridY ??= Math.max(0, Math.round(room.y / fallbackStepY));

    if (room.autoCentered) {
      centerFloorPlan(room);
      return;
    }

    room.w = room.gridColumns * stepX;
    room.h = room.gridRows * stepY;
    room.x = Math.max(0, Math.min(1200 - room.w, room.gridX * stepX));
    room.y = Math.max(0, Math.min(800 - room.h, room.gridY * stepY));
  });

  arrangeDefaultFloorPlanLayout(plans);

  const occupiedPlans = [];
  plans.forEach((room) => {
    if (room.autoPlaced !== false) {
      const overlaps = occupiedPlans.some((other) => (
        room.gridX < other.gridX + other.gridColumns &&
        room.gridX + room.gridColumns > other.gridX &&
        room.gridY < other.gridY + other.gridRows &&
        room.gridY + room.gridRows > other.gridY
      ));
      if (overlaps) {
        const position = findOpenFloorPlanGridPosition(room, occupiedPlans, stepX, stepY);
        if (position) {
          room.gridX = position.x;
          room.gridY = position.y;
          room.x = position.x * stepX;
          room.y = position.y * stepY;
        }
      }
    }
    occupiedPlans.push(room);
  });
  syncAttachedCanvasItemsToFloorPlans(plans, stepX, stepY);
  previousGridStepX = stepX;
  previousGridStepY = stepY;
  renderAll(false);
}

function addFloorPlan() {
  clearPlaceMode();
  currentDrawMode = "";
  document.getElementById("svg-main").style.cursor = "";
  document.getElementById("dtool-line").classList.remove("active");
  const stepX = gridStep("x");
  const stepY = gridStep("y");
  const width = stepX * 6;
  const height = stepY * 7;
  const floorPlanCount = rooms.filter((room) => room.type === "floorplan").length;
  const isFirstFloorPlan = floorPlanCount === 0;
  const position = isFirstFloorPlan ? { x: 0, y: 0 } : findFloorPlanPosition(width, height);
  const plan = createRoom({
    name: "間取り",
    type: "floorplan",
    x: position.x,
    y: position.y,
    w: width,
    h: height,
    gridColumns: 6,
    gridRows: 7,
    gridX: Math.round(position.x / stepX),
    gridY: Math.round(position.y / stepY),
    layoutIndex: floorPlanCount,
    autoCentered: isFirstFloorPlan,
    autoPlaced: true
  });
  if (plan.autoCentered) centerFloorPlan(plan);
  rooms.push(plan);
  syncFloorPlansToGrid();
  actionHistory.push(() => {
    rooms = rooms.filter((room) => room.id !== plan.id);
    if (selectedRoomId === plan.id) selectedRoomId = null;
    renderAll(false);
  });
  selectedRoomId = plan.id;
  renderAll(false);
  showToast("四角の間取りを配置しました");
}

window.addEventListener("pointermove", (event) => {
  const svg = document.getElementById("svg-main");
  const svgBounds = svg.getBoundingClientRect();
  const scaleX = 1200 / svgBounds.width;
  const scaleY = 800 / svgBounds.height;

  if (resizeState) {
    const room = rooms.find((item) => item.id === resizeState.id);
    if (!room) return;
    const isItem = isCanvasItem(room);
    const minW = isItem ? 24 * scaleX : gridStep("x");
    const minH = isItem ? 24 * scaleY : gridStep("y");
    let left = resizeState.origX;
    let top = resizeState.origY;
    let right = resizeState.origX + resizeState.origW;
    let bottom = resizeState.origY + resizeState.origH;
    let deltaX = event.clientX - resizeState.startX;
    let deltaY = event.clientY - resizeState.startY;
    if (isItem && room.rotation % 360) {
      const radians = -room.rotation * Math.PI / 180;
      const rotatedX = deltaX * Math.cos(radians) - deltaY * Math.sin(radians);
      const rotatedY = deltaX * Math.sin(radians) + deltaY * Math.cos(radians);
      deltaX = rotatedX;
      deltaY = rotatedY;
    }
    const pointerX = resizeState.origX + deltaX * scaleX;
    const pointerY = resizeState.origY + deltaY * scaleY;
    const nextX = isItem ? pointerX : snapToGrid(pointerX, "x");
    const nextY = isItem ? pointerY : snapToGrid(pointerY, "y");

    if (resizeState.corner.includes("w")) left = Math.max(0, Math.min(right - minW, nextX));
    if (resizeState.corner.includes("e")) right = Math.min(1200, Math.max(left + minW, nextX + resizeState.origW));
    if (resizeState.corner.includes("n")) top = Math.max(0, Math.min(bottom - minH, nextY));
    if (resizeState.corner.includes("s")) bottom = Math.min(800, Math.max(top + minH, nextY + resizeState.origH));

    room.x = left;
    room.y = top;
    room.w = right - left;
    room.h = bottom - top;
    renderAll(false);
    return;
  }

  if (!dragState) return;
  const room = rooms.find((item) => item.id === dragState.id);
  if (!room) return;
  const origin = dragState.rooms.find((item) => item.id === room.id);
  if (!origin) return;
  if (!dragState.moved && Math.hypot(event.clientX - dragState.startX, event.clientY - dragState.startY) < 4) return;
  dragState.moved = true;
  const x = origin.x + (event.clientX - dragState.startX) * scaleX;
  const y = origin.y + (event.clientY - dragState.startY) * scaleY;

  if (room.type === "floorplan") {
    let moveX = snapToGrid(x, "x") - origin.x;
    let moveY = snapToGrid(y, "y") - origin.y;
    const groupLeft = Math.min(...dragState.rooms.map((item) => item.x));
    const groupTop = Math.min(...dragState.rooms.map((item) => item.y));
    const groupRight = Math.max(...dragState.rooms.map((item) => {
      const candidate = rooms.find((entry) => entry.id === item.id);
      return item.x + candidate.w;
    }));
    const groupBottom = Math.max(...dragState.rooms.map((item) => {
      const candidate = rooms.find((entry) => entry.id === item.id);
      return item.y + candidate.h;
    }));
    moveX = Math.max(-groupLeft, Math.min(1200 - groupRight, moveX));
    moveY = Math.max(-groupTop, Math.min(800 - groupBottom, moveY));
    dragState.rooms.forEach((item) => {
      const candidate = rooms.find((entry) => entry.id === item.id);
      candidate.x = item.x + moveX;
      candidate.y = item.y + moveY;
    });
  } else {
    room.x = Math.max(0, Math.min(1200 - room.w, x));
    room.y = Math.max(0, Math.min(800 - room.h, y));
  }
  renderAll(false);
});

window.addEventListener("pointermove", (event) => {
  if (!lineDrawState) return;
  const point = pointInSvg(event);
  const last = lineDrawState.points[lineDrawState.points.length - 1];
  const dx = point.x - last.x;
  const dy = point.y - last.y;
  let nextX = last.x;
  let nextY = last.y;
  if (Math.abs(dx) >= Math.abs(dy)) {
    nextX = snapToGrid(point.x, "x");
  } else {
    nextY = snapToGrid(point.y, "y");
  }
  if (nextX !== last.x || nextY !== last.y) {
    lineDrawState.points.push({ x: nextX, y: nextY });
    drawPathFromGridPoints(lineDrawState.line, lineDrawState.points.map((item) => ({
      x: Math.round(item.x / gridStep("x")),
      y: Math.round(item.y / gridStep("y"))
    })));
    lineDrawState.moved = true;
  }
});

window.addEventListener("pointermove", (event) => {
  if (!drawDragState) return;
  const overlay = document.getElementById("text-overlay");
  const element = drawDragState.element;
  const dx = (event.clientX - drawDragState.startX) / canvasZoom;
  const dy = (event.clientY - drawDragState.startY) / canvasZoom;
  if (!drawDragState.moved && Math.hypot(dx, dy) < 4) return;
  if (!drawDragState.moved) {
    drawDragState.moved = true;
    clearDrawSelection();
  }
  const x = drawDragState.origX + dx;
  const y = drawDragState.origY + dy;
  element.style.left = `${Math.max(0, Math.min(overlay.clientWidth - element.offsetWidth, x))}px`;
  element.style.top = `${Math.max(0, Math.min(overlay.clientHeight - element.offsetHeight, y))}px`;
  showTextHandles(element);
});

window.addEventListener("pointermove", (event) => {
  if (!textResizeState) return;
  const point = pointInCanvasPixels(event);
  const { element, corner, bounds, fontSize } = textResizeState;
  let left = bounds.x;
  let top = bounds.y;
  let right = bounds.x + bounds.width;
  let bottom = bounds.y + bounds.height;
  if (corner.includes("w")) left = Math.min(right - 12, point.x);
  if (corner.includes("e")) right = Math.max(left + 12, point.x);
  if (corner.includes("n")) top = Math.min(bottom - 12, point.y);
  if (corner.includes("s")) bottom = Math.max(top + 12, point.y);
  const scaleX = (right - left) / bounds.width;
  const scaleY = (bottom - top) / bounds.height;
  const scale = Math.abs(scaleX - 1) >= Math.abs(scaleY - 1) ? scaleX : scaleY;
  const nextSize = Math.max(12, Math.min(96, Math.round(fontSize * scale)));
  element.dataset.fontSize = nextSize;
  updateTextDrawElement(element);
  const resized = getTextBounds(element);
  const nextX = corner.includes("w") ? right - resized.width : left;
  const nextY = corner.includes("n") ? bottom - resized.height : top;
  const overlay = document.getElementById("text-overlay");
  element.style.left = `${Math.max(0, Math.min(overlay.clientWidth - resized.width, nextX))}px`;
  element.style.top = `${Math.max(0, Math.min(overlay.clientHeight - resized.height, nextY))}px`;
  showTextHandles(element);
});

window.addEventListener("pointerup", () => {
  if (lineDrawState) {
    if (!lineDrawState.moved) {
      const edge = nearestGridEdge(lineDrawState.start);
      lineDrawState.line.setAttribute("d", `M ${edge.x1} ${edge.y1} L ${edge.x2} ${edge.y2}`);
    }
    const line = lineDrawState.line;
    actionHistory.push(() => {
      if (line.isConnected) line.remove();
      if (selectedDrawElement === line) clearDrawSelection();
    });
    lineDrawState = null;
  }
  if (dragState) {
    const originalRooms = dragState.rooms;
    const movedRooms = originalRooms.filter((origin) => {
      const room = rooms.find((item) => item.id === origin.id);
      return room && (room.x !== origin.x || room.y !== origin.y);
    });
    if (movedRooms.length) {
      movedRooms.forEach((origin) => {
        const room = rooms.find((item) => item.id === origin.id);
        if (room.type === "floorplan") {
          room.autoCentered = false;
          room.autoPlaced = false;
          captureFloorPlanGrid(room);
        } else if (Object.values(itemCatalog).some((item) => item.type === room.type)) {
          captureCanvasItemGrid(room);
        }
      });
      actionHistory.push(() => {
        originalRooms.forEach((origin) => {
          const room = rooms.find((item) => item.id === origin.id);
          room.x = origin.x;
          room.y = origin.y;
          room.gridX = origin.gridX;
          room.gridY = origin.gridY;
          room.itemGridX = origin.itemGridX;
          room.itemGridY = origin.itemGridY;
          room.parentFloorPlanId = origin.parentFloorPlanId;
          room.parentFloorPlanOffsetX = origin.parentFloorPlanOffsetX;
          room.parentFloorPlanOffsetY = origin.parentFloorPlanOffsetY;
          room.parentFloorPlanReady = origin.parentFloorPlanReady;
          room.autoCentered = origin.autoCentered;
          room.autoPlaced = origin.autoPlaced;
        });
        renderAll(false);
      });
    }
  }
  if (resizeState) {
    const room = rooms.find((item) => item.id === resizeState.id);
    const { origX, origY, origW, origH, origGridColumns, origGridRows, origGridX, origGridY, origItemCols, origItemRows, origItemGridX, origItemGridY, origParentFloorPlanId, origParentFloorPlanOffsetX, origParentFloorPlanOffsetY, origParentFloorPlanReady, origAutoCentered, origAutoPlaced } = resizeState;
    if (room && (room.x !== origX || room.y !== origY || room.w !== origW || room.h !== origH)) {
      if (room.type === "floorplan") {
        room.autoCentered = false;
        room.autoPlaced = false;
        captureFloorPlanGrid(room);
      } else if (isCanvasItem(room)) {
        captureCanvasItemGrid(room);
      }
      actionHistory.push(() => {
        room.x = origX;
        room.y = origY;
        room.w = origW;
        room.h = origH;
        room.gridColumns = origGridColumns;
        room.gridRows = origGridRows;
        room.gridX = origGridX;
        room.gridY = origGridY;
        room.itemCols = origItemCols;
        room.itemRows = origItemRows;
        room.itemGridX = origItemGridX;
        room.itemGridY = origItemGridY;
        room.parentFloorPlanId = origParentFloorPlanId;
        room.parentFloorPlanOffsetX = origParentFloorPlanOffsetX;
        room.parentFloorPlanOffsetY = origParentFloorPlanOffsetY;
        room.parentFloorPlanReady = origParentFloorPlanReady;
        room.autoCentered = origAutoCentered;
        room.autoPlaced = origAutoPlaced;
        renderAll(false);
      });
    }
  }
  if (drawDragState) {
    const { element, origX, origY, moved } = drawDragState;
    const nextX = element.offsetLeft;
    const nextY = element.offsetTop;
    if (moved && (nextX !== origX || nextY !== origY)) {
      actionHistory.push(() => {
        element.style.left = `${origX}px`;
        element.style.top = `${origY}px`;
        showTextHandles(element);
      });
    }
    if (!moved) activateDrawSelection(element);
  }
  if (textResizeState) {
    const { element, bounds, fontSize } = textResizeState;
    const nextX = element.offsetLeft;
    const nextY = element.offsetTop;
    const nextSize = Number(element.dataset.fontSize) || currentTextSize;
    if (nextX !== bounds.x || nextY !== bounds.y || nextSize !== fontSize) {
      actionHistory.push(() => {
        element.style.left = `${bounds.x}px`;
        element.style.top = `${bounds.y}px`;
        element.dataset.fontSize = fontSize;
        updateTextDrawElement(element);
        showTextHandles(element);
      });
    }
  }
  dragState = null;
  resizeState = null;
  drawDragState = null;
  textResizeState = null;
});

window.addEventListener("resize", () => {
  updateCanvasGridAlignment();
  updateAllTextDrawElements();
  syncDrawLinesToGrid();
  syncCanvasItemsToGrid();
  syncFloorPlansToGrid();
});

function clearAll() {
  rooms = [];
  selectedRoomId = null;
  clearDrawSelection();
  actionHistory.length = 0;
  clearPlaceMode();
  ["layer-lines", "layer-nodes", "layer-draw", "layer-handles"].forEach((id) => {
    const layer = document.getElementById(id);
    if (layer) layer.innerHTML = "";
  });
  document.getElementById("text-overlay").innerHTML = "";
  renderAll();
  showToast("見取り図をリセットしました");
}

function showToast() {}

function togglePalette() {
  const slot = document.querySelector(".item-control-slot");
  slot.classList.remove("doors-open");
  const isOpen = slot.classList.toggle("open");
  document.getElementById("palette-toggle").setAttribute("aria-expanded", String(isOpen));
  document.getElementById("door-toggle").setAttribute("aria-expanded", "false");
}

function toggleDoorPalette() {
  const slot = document.querySelector(".item-control-slot");
  slot.classList.remove("open");
  const isOpen = slot.classList.toggle("doors-open");
  document.getElementById("door-toggle").setAttribute("aria-expanded", String(isOpen));
  document.getElementById("palette-toggle").setAttribute("aria-expanded", "false");
}

function setDrawMode(mode, button) {
  currentDrawMode = currentDrawMode === mode ? "" : mode;
  clearPlaceMode();
  clearDrawSelection();
  document.querySelectorAll(".dtool-btn[id^='dtool-']").forEach((el) => el.classList.remove("active"));
  document.querySelectorAll(".item-btn").forEach((el) => el.classList.remove("active"));
  if (currentDrawMode && button) button.classList.add("active");
  document.getElementById("text-size-picker").style.display = currentDrawMode === "text" ? "flex" : "none";
  document.getElementById("svg-main").style.cursor = currentDrawMode ? "crosshair" : "";
  showToast(currentDrawMode ? `${mode} を選択しました` : "描画モードを解除しました");
}

function setPlaceMode(mode, button) {
  currentPlaceMode = currentPlaceMode === mode ? "" : mode;
  currentDrawMode = "";
  selectedRoomId = null;
  clearDrawSelection();
  renderAll(false);
  document.querySelectorAll(".item-btn").forEach((el) => el.classList.remove("active"));
  document.querySelectorAll(".dtool-btn[id^='dtool-']").forEach((el) => el.classList.remove("active"));
  if (currentPlaceMode && button) button.classList.add("active");
  document.querySelector(".canvas-wrap").classList.toggle("place-mode", Boolean(currentPlaceMode));
  showToast(currentPlaceMode ? `${mode} を選択しました` : "アイテム選択を解除しました");
}

function clearPlaceMode() {
  currentPlaceMode = "";
  document.querySelectorAll(".item-btn").forEach((el) => el.classList.remove("active"));
  document.querySelector(".canvas-wrap").classList.remove("place-mode");
}

function rotateSelectedItem() {
  const room = rooms.find((item) => item.id === selectedRoomId);
  if (!room) {
    showToast("回転するアイテムを選択してください");
    return;
  }
  const previous = {
    x: room.x,
    y: room.y,
    w: room.w,
    h: room.h,
    rotation: room.rotation,
    gridColumns: room.gridColumns,
    gridRows: room.gridRows,
    gridX: room.gridX,
    gridY: room.gridY,
    autoCentered: room.autoCentered,
    autoPlaced: room.autoPlaced
  };
  if (room.type === "floorplan") {
    const swapDimensions = () => {
      const centerX = room.x + room.w / 2;
      const centerY = room.y + room.h / 2;
      const widthInCells = room.w / gridStep("x");
      const heightInCells = room.h / gridStep("y");
      room.w = heightInCells * gridStep("x");
      room.h = widthInCells * gridStep("y");
      room.x = Math.max(0, Math.min(1200 - room.w, snapToGrid(centerX - room.w / 2, "x")));
      room.y = Math.max(0, Math.min(800 - room.h, snapToGrid(centerY - room.h / 2, "y")));
    };
    if (Math.abs(room.rotation % 180) === 90) swapDimensions();
    room.rotation = (room.rotation + 90) % 360;
    swapDimensions();
    captureFloorPlanGrid(room);
    if (room.autoCentered) centerFloorPlan(room);
  } else {
    room.rotation = (room.rotation + 90) % 360;
  }
  actionHistory.push(() => {
    Object.assign(room, previous);
    renderAll(false);
  });
  renderAll(false);
  showToast(`${room.name}を回転しました`);
}

function deleteSelected() {
  if (selectedDrawElement) {
    const element = selectedDrawElement;
    const parent = element.parentNode;
    const nextSibling = element.nextSibling;
    clearDrawSelection();
    element.remove();
    actionHistory.push(() => parent.insertBefore(element, nextSibling));
    showToast("選択した要素を削除しました");
    return;
  }
  const index = rooms.findIndex((room) => room.id === selectedRoomId);
  if (index < 0) {
    showToast("削除する要素を選択してください");
    return;
  }
  const [room] = rooms.splice(index, 1);
  selectedRoomId = null;
  actionHistory.push(() => {
    rooms.splice(index, 0, room);
    renderAll(false);
  });
  renderAll(false);
  showToast("選択した要素を削除しました");
}

function undoAction() {
  const undo = actionHistory.pop();
  if (!undo) {
    showToast("元に戻す操作はありません");
    return;
  }
  undo();
  showToast("ひとつ前の操作に戻しました");
}

function setTextSize(size) {
  currentTextSize = size;
  if (selectedDrawElement?.classList.contains("canvas-text")) {
    selectedDrawElement.dataset.fontSize = size;
    updateTextDrawElement(selectedDrawElement);
  }
}

function setTextDir(dir) {
  currentTextDir = dir;
  document.getElementById("text-dir-h").classList.toggle("active", dir === "h");
  document.getElementById("text-dir-v").classList.toggle("active", dir === "v");
  if (selectedDrawElement?.classList.contains("canvas-text")) {
    selectedDrawElement.dataset.direction = dir;
    updateTextDrawElement(selectedDrawElement);
  }
}

async function exportPNG() {
  const svg = document.getElementById("svg-main");
  const xml = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const img = new Image();

  img.onload = async () => {
    const canvas = document.createElement("canvas");
    canvas.width = 1200;
    canvas.height = 800;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);

    const fileName = `見取り図_${new Date().toISOString().slice(0, 10)}.png`;
    try {
      if (window.showSaveFilePicker) {
        const handle = await window.showSaveFilePicker({
          suggestedName: fileName,
          types: [{ description: "PNG画像", accept: { "image/png": [".png"] } }]
        });
        const writable = await handle.createWritable();
        const pngBlob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
        await writable.write(pngBlob);
        await writable.close();
        showToast("見取り図を保存しました");
      } else {
        const a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = fileName;
        a.click();
        showToast("見取り図をダウンロードしました");
      }
    } catch (error) {
      if (error && error.name !== "AbortError") alert("保存に失敗しました。");
    }
  };
  img.src = url;
}

renderTemplateButtons();
renderItemPalette();
renderDoorPalette();
renderAll();
const canvas = document.getElementById("svg-main");
previousGridStepX = gridStep("x");
previousGridStepY = gridStep("y");
const canvasResizeObserver = new ResizeObserver(() => {
  updateCanvasGridAlignment();
  syncDrawLinesToGrid();
  syncCanvasItemsToGrid();
  syncFloorPlansToGrid();
});
canvasResizeObserver.observe(canvas);
canvas.addEventListener("pointerdown", startLineDraw);
canvas.addEventListener("pointerdown", startTextDraw);
canvas.addEventListener("pointerdown", placeItemOnCanvas);
canvas.addEventListener("wheel", (event) => {
  event.preventDefault();
  adjustCanvasZoom(event.deltaY < 0 ? 0.1 : -0.1);
}, { passive: false });
document.addEventListener("keydown", (event) => {
  if (event.target instanceof HTMLInputElement || event.target.isContentEditable) return;
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "c" && copySelectedCanvasItem()) {
    event.preventDefault();
    return;
  }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "v" && pasteCanvasItem()) {
    event.preventDefault();
    return;
  }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") {
    event.preventDefault();
    undoAction();
  }
  if ((event.key === "Delete" || event.key === "Backspace") && (selectedRoomId || selectedDrawElement)) {
    event.preventDefault();
    deleteSelected();
  }
  if (event.key === "Escape" && currentDrawMode) setDrawMode(currentDrawMode);
});
</script>
