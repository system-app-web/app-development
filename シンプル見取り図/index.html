<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="シンプル見取り図" />
    <meta name="theme-color" content="#247a8a" />
    <link rel="apple-touch-icon" href="./app-icon.png" />
    <link rel="icon" type="image/png" href="./app-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      if (window.location.protocol !== 'file:' && !['localhost', '127.0.0.1'].includes(window.location.hostname)) {
        document.write('<script src="https://app-development-gray.vercel.app/portal-auth-guard.js"><\\/script>');
      }
    </script>
    <title>シンプル見取り図</title>
  </head>
  <body>
    <script>
      const openApp = () => location.replace(`./app.html${location.search}${location.hash}`);
      if (window.location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(window.location.hostname) || window.ktmAuthReady) openApp();
      else document.addEventListener('ktm-auth-ready', openApp, { once: true });
    </script>
    <a href="./app.html">シンプル見取り図を開く</a>
  </body>
</html>
