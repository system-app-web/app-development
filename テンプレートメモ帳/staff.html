<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://app-development-gray.vercel.app/portal-auth-guard.js"></script>
<title>テンプレートメモ帳</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Meiryo', 'Yu Gothic', sans-serif;
    background: #eef2f7;
    min-height: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    color: #2d3748;
  }

  header {
    background: linear-gradient(135deg, #3a6d8f, #1e4d6b);
    color: white;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    flex-shrink: 0;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.06em; }
  .header-actions { margin-left: auto; display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
  .undo-delete, .header-utility { padding: 5px 10px; border: 1px solid rgba(255,255,255,0.48); border-radius: 6px; color: white; background: rgba(255,255,255,0.13); font: inherit; font-size: 0.78rem; cursor: pointer; white-space: nowrap; }
  .header-utility.import { background: rgba(212,240,196,0.2); }
  .header-utility:hover { background: rgba(255,255,255,0.24); }
  .undo-delete:hover:not(:disabled) { background: rgba(255,255,255,0.24); }.undo-delete:disabled { opacity: 0.42; cursor: default; }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* ── サイドバー ── */
  .sidebar {
    width: 40%;
    flex-shrink: 0;
    background: #1e3a4f;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
    min-width: 200px;
    max-width: 80%;
  }

  .resize-handle {
    width: 6px;
    flex-shrink: 0;
    background: rgba(0,0,0,0.2);
    cursor: col-resize;
    position: relative;
    transition: background 0.15s;
    z-index: 10;
  }
  .resize-handle:hover,
  .resize-handle.dragging { background: #4a7c9e; }
  .resize-handle::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 2px;
    height: 40px;
    background: rgba(255,255,255,0.25);
    border-radius: 2px;
  }

  .sidebar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 10px;
    font-size: 0.72rem;
    font-weight: 700;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.1em;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .sidebar-head .btn-add-group { padding: 2px 6px; border: 0; border-radius: 4px; color: rgba(255,255,255,0.7); background: transparent; font-size: 0.72rem; letter-spacing: 0; }
  .sidebar-head .btn-add-group:hover { color: #fff; background: rgba(255,255,255,0.12); }

  .cat-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 6px 0;
  }
  .cat-list::-webkit-scrollbar { width: 5px; }
  .cat-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

  /* ドラッグ */
  .drag-over-group { border-top: 2px solid rgba(255,255,255,0.45); }
  .drag-over-cat   { border-top: 2px solid rgba(255,255,255,0.45); }
  .cat-drop-indicator { height: 3px; margin: 1px 10px 1px 24px; background: rgba(255,255,255,0.75); box-shadow: 0 0 5px rgba(255,255,255,0.65); pointer-events: none; }
  .dragging        { opacity: 0.4; }

  .drag-handle {
    color: rgba(255,255,255,0.18);
    font-size: 0.8rem;
    cursor: grab;
    touch-action: none;
    padding: 0 6px 0 4px;
    flex-shrink: 0;
    user-select: none;
    align-self: stretch;
    display: flex;
    align-items: center;
  }
  .drag-handle:active { cursor: grabbing; }
  .group-header:hover .drag-handle { color: rgba(255,255,255,0.45); }
  .cat-item:hover .drag-handle     { color: rgba(255,255,255,0.45); }

  /* グループヘッダー */
  .group-header {
    display: flex;
    align-items: center;
    min-height: 44px;
    padding: 8px 12px 8px 10px;
    margin-top: 2px;
    cursor: default;
    gap: 5px;
  }

  .group-toggle {
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    font-size: 0.78rem;
    cursor: pointer;
    width: 18px;
    flex-shrink: 0;
    padding: 0;
    font-family: inherit;
    transition: color 0.15s;
  }
  .group-toggle:hover { color: rgba(255,255,255,0.7); }

  .group-label {
    flex: 1;
    font-size: 0.9rem;
    font-weight: 700;
    color: rgba(255,255,255,0.78);
    letter-spacing: 0.06em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .group-btns {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    position: relative;
  }

  .grp-menu-btn {
    font-size: 0.75rem;
    padding: 2px 4px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    background: none;
    color: rgba(255,255,255,0.5);
    transition: all 0.15s;
    line-height: 1;
  }
  .grp-menu-btn:hover { color: white; }

  .grp-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    background: #2a3a4a;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    z-index: 200;
    min-width: 110px;
    overflow: hidden;
    flex-direction: column;
  }
  .grp-dropdown.open { display: flex; }

  .grp-dd-item {
    padding: 9px 16px;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.8);
    cursor: pointer;
    white-space: nowrap;
    border: none;
    background: none;
    font-family: inherit;
    text-align: left;
    transition: background 0.12s;
  }
  .grp-dd-item:hover { background: rgba(255,255,255,0.1); color: white; }
  .grp-dd-item.del { color: #ff8a80; }
  .grp-dd-item.del:hover { background: rgba(231,76,60,0.25); color: white; }

  /* カテゴリ行 */
  .cat-item {
    position: relative;
    display: flex;
    align-items: center;
    margin: 2px 10px 2px 24px;
    border-radius: 7px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.05);
    transition: background 0.15s;
    overflow: hidden;
    min-height: 38px;
  }
  .cat-item:hover { background: rgba(255,255,255,0.09); }
  .cat-item.active {
    background: rgba(74,124,158,0.3);
    border-color: rgba(74,124,158,0.5);
  }

  .cat-color-bar {
    width: 4px;
    align-self: stretch;
    flex-shrink: 0;
    background: #4a7c9e;
  }

  .cat-body {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 0 6px 0 10px;
    gap: 6px;
    min-width: 0;
  }

  .cat-name {
    flex: 1;
    font-size: 0.88rem;
    color: rgba(255,255,255,0.82);
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    line-height: 1.2;
    padding: 10px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .cat-item.active .cat-name { color: white; font-weight: 600; }

  .cat-item-btns {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    padding-right: 6px;
  }

  .cat-btn {
    font-size: 0.72rem;
    padding: 4px 9px;
    border-radius: 5px;
    border: 1px solid;
    cursor: pointer;
    font-family: inherit;
    background: none;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .cat-btn.copy { border-color: rgba(74,124,158,0.6); color: #7ec8e3; }
  .cat-btn.move { width: 28px; padding: 4px 0; border-color: rgba(255,255,255,0.22); color: rgba(255,255,255,0.75); }
  .cat-btn.move:hover { background: rgba(255,255,255,0.12); color: white; }
  .cat-btn.copy:hover { background: rgba(74,124,158,0.3); color: white; }
  .cat-btn.copy.copied { background: rgba(56,161,105,0.3); border-color: #38a169; color: #9ae6b4; }
  .cat-btn.edit { border-color: rgba(255,255,255,0.22); color: rgba(255,255,255,0.65); }
  .cat-btn.edit:hover { background: rgba(255,255,255,0.12); color: white; }
  .cat-btn.del  { border-color: rgba(231,76,60,0.4); color: #ff8a80; }
  .cat-btn.del:hover  { background: rgba(231,76,60,0.3); color: white; }

  /* グループなし */
  .no-group-label {
    padding: 8px 10px 4px 12px;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.3);
    font-style: italic;
  }

  .sidebar-footer {
    padding: 8px;
    border-top: 1px solid rgba(255,255,255,0.07);
  }

  .btn-add-group {
    width: 100%;
    padding: 8px 12px;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.75);
    border: 1px dashed rgba(255,255,255,0.2);
    border-radius: 7px;
    font-size: 0.8rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-add-group:hover {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.4);
    color: white;
  }

  /* ── 右エディタ ── */
  .editor-area {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #eef2f7;
  }

  .editor-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a0aec0;
    font-size: 0.9rem;
  }

  .editor-panel {
    flex: 1;
    min-height: 0;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .editor-panel.visible { display: flex; }

  .editor-header {
    background: white;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid #4a7c9e;
    flex-shrink: 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .editor-breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: #a0aec0;
  }
  .editor-breadcrumb .group-name { color: #718096; }
  .editor-breadcrumb .sep { color: #cbd5e0; }
  .editor-breadcrumb .cat-label-main {
    font-size: 1rem;
    font-weight: 700;
    color: #2d3748;
  }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  .btn {
    padding: 4px 11px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 0.75rem;
    font-family: inherit;
    font-weight: 600;
    transition: all 0.15s;
  }
  .btn-reset { background: #f0f4f8; color: #718096; border: 1.5px solid #cbd5e0; }
  .btn-reset:hover { background: #e2e8f0; }
  .btn-edit { background: #f0f4f8; color: #4a5568; border: 1.5px solid #cbd5e0; }
  .btn-edit:hover { background: #e2e8f0; }
  .btn-del { background: rgba(231,76,60,0.12); color: #e74c3c; border: 1.5px solid rgba(231,76,60,0.35); }
  .btn-del:hover { background: rgba(231,76,60,0.25); }
  .btn-copy { background: #4a7c9e; color: white; min-width: 100px; }
  .btn-copy:hover { filter: brightness(0.88); }
  .btn-copy.copied { background: #38a169 !important; }

  .editor-body {
    flex: 1;
    min-height: 0;
    padding: 16px 20px 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .editor-body textarea {
    flex: 1;
    width: 100%;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    padding: 16px;
    font-size: 0.92rem;
    font-family: 'Meiryo', 'Yu Gothic', monospace;
    line-height: 1.9;
    color: #2d3748;
    resize: none;
    overscroll-behavior: contain;
    transition: border-color 0.2s;
    background: white;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .editor-body textarea:focus { outline: none; border-color: #4a7c9e; }
  .editor-save-row { display: none; }
  .btn-save { background: #4a7c9e; color: white; border: none; border-radius: 6px; padding: 4px 11px; font-size: 0.75rem; font-family: inherit; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .btn-save:hover { filter: brightness(0.88); }
  .btn-save.saved { background: #38a169; }

  /* ── モーダル共通 ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; animation: fadeIn 0.15s; }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1); }
  }

  .modal {
    background: white;
    border-radius: 14px;
    width: 560px;
    max-width: 95vw;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }

  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-header h2 { font-size: 1rem; font-weight: 700; color: #2d3748; }
  .modal-close { background: none; border: none; font-size: 1.1rem; cursor: pointer; color: #a0aec0; }
  .modal-close:hover { color: #718096; }

  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 0.8rem; font-weight: 700;
    color: #4a5568; margin-bottom: 6px;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    border: 1.5px solid #cbd5e0;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 0.9rem;
    font-family: 'Meiryo', 'Yu Gothic', monospace;
    color: #2d3748;
    background: #fafbfc;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: #4a7c9e; background: white;
  }
  .form-group textarea { min-height: 240px; resize: vertical; line-height: 1.8; }

  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid #e2e8f0;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .btn-cancel { background: #f0f4f8; color: #718096; border: 1.5px solid #cbd5e0; }
  .btn-cancel:hover { background: #e2e8f0; }
  .btn-primary { background: #3a6d8f; color: white; border: none; }
  .btn-primary:hover { background: #1e4d6b; }
</style>
</head>
<body>

<header>
  <h1>📋 テンプレートメモ帳</h1>
  <div class="header-actions">
    <button class="undo-delete" id="undoDelete" type="button" disabled>↶ 戻す</button>
    <button class="header-utility" id="btnRefresh" type="button">更新</button>
    <button class="header-utility backup" id="btnBackup" type="button">バックアップ</button>
    <button class="header-utility import" id="btnImport" type="button">データ挿入</button>
  </div>
</header>
<input id="importDataInput" type="file" accept="application/json,.json" hidden>

<div class="main">

  <div class="sidebar">
    <div class="sidebar-head"><span>カテゴリ</span><button class="btn-add-group" id="btnAddGroup">＋ グループ追加</button></div>
    <div class="cat-list" id="catList"></div>
  </div>

  <div class="resize-handle" id="resizeHandle"></div>

  <div class="editor-area">
    <div class="editor-placeholder" id="editorPlaceholder">← カテゴリを選択してください</div>
    <div class="editor-panel" id="editorPanel">
      <div class="editor-header">
        <div class="editor-breadcrumb">
          <span class="group-name" id="editorGroupName"></span>
          <span class="sep" id="editorSep">›</span>
          <span class="cat-label-main" id="catLabel"></span>
        </div>
        <div class="actions">
          <button class="btn btn-save" id="btnSave">保存</button>
          <button class="btn btn-edit" id="btnEdit">編集</button>
          <button class="btn btn-del" id="btnDel">削除</button>
          <button class="btn btn-copy" id="btnCopy">📋 コピー</button>
        </div>
      </div>
      <div class="editor-body">
        <textarea id="noteArea" spellcheck="false"></textarea>
      </div>
    </div>
  </div>

</div>

<!-- グループ モーダル -->
<div class="modal-overlay" id="groupModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="groupModalTitle">グループを追加</h2>
      <button class="modal-close" id="groupModalClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>グループ名</label>
        <input type="text" id="groupModalName" placeholder="例：アセスメント系">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" id="groupModalCancel">キャンセル</button>
      <button class="btn btn-primary" id="groupModalSave">保存</button>
    </div>
  </div>
</div>

<!-- カテゴリ モーダル -->
<div class="modal-overlay" id="catModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="catModalTitle">カテゴリを追加</h2>
      <button class="modal-close" id="catModalClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>グループ</label>
        <select id="catModalGroup"></select>
      </div>
      <div class="form-group">
        <label>カテゴリ名</label>
        <input type="text" id="catModalName" placeholder="例：モニタリング">
      </div>
      <div class="form-group">
        <label>テンプレート文言</label>
        <textarea id="catModalTemplate" placeholder="ここにテンプレートを入力してください。"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" id="catModalCancel">キャンセル</button>
      <button class="btn btn-primary" id="catModalSave">保存</button>
    </div>
  </div>
</div>

<script>
// ── デフォルトデータ ──
const AI_OUTPUT_COPY_INSTRUCTION = '生成した文の最後に文字数は入れないこと。トリプルクリックでその文を選択してコピペするため。項目名など頭に載せる場合は改行して生成してください。';

const DEFAULT_AI_PROMPTS = [
  {
    "id": "ai_assessment",
    "groupId": "g_ai",
    "label": "アセスメント",
    "template": "#役割\nあなたは経験豊富な主任介護支援専門員です。\n福岡市の居宅介護支援運営基準、介護保険制度、LIFEを意識したアセスメント作成を行ってください。\n文章は監査で読まれても違和感がない内容にしてください。\n\n# 介護アセスメント抽出指示書（コピー専用・行ズレ極小化版）\n\n## アセスメント設定\n*   **役割**：介護支援専門員（ケアマネジャー）\n*   **目的**：提供されたソース（認定調査票、主治医意見書、介護保険証、負担割合証、ケアプラン1〜3表、本人・家族情報、サマリー、依頼情報、お薬情報、面談の記録や音声など）から、客観的事実に基づきアセスメント項目（No.1〜217）の情報を抽出・作成し、指定された形式で出力する。\n*   前回のアセスメントシートが添付されている場合は参考として使用する。あくまでも最新の認定調査票からの読み取りを優先する。\n*   事実（ADL・認知・医療など本人の状態）は最新の認定調査票と主治医意見書を優先して記載する。ただし、No.25〜28（日常生活自立度）は【No.25〜28（日常生活自立度）に関するルール】に従う。\n*   サービス内容・福祉用具・目標に関わる記載（No.17、No.67、No.159、No.163など）は、ケアプランと矛盾しないように書き、食い違いがある場合は認定調査票の事実を書いたうえでケアプラン上の対応を記載する。\n\n## 行ズレ・誤作動防止のための「生成3原則」\n1.  **アンカー・セルフカウント（10行ルール）**：\n    No.1からNo.217までの出力中、10行出力するごとに内部で「今、No.10（または20, 30...）に該当する値を出力した。次の項目名は〇〇である」と行数カウントを確認し、行のスキップや重複を防いでください。\n2.  **項目定義と出力値の脳内同期**：\n    項目定義リスト（No.1〜217）の項目名と、実際に出力する値を脳内で厳密に同期させ、行のズレや不足が1行も生じないようにしてください。出力時には項目名やNo.、記号は含めず、値のみを正確に改行区切りで出力します。\n3.  **「あり/なし/全介助」等、連続エリアの集中監視**：\n    特に値のみが連続するエリア（No.56〜66、No.100〜107、No.116〜139、No.141〜144、No.152〜157、No.160〜166、No.167〜193、No.194〜205、No.206〜217）では位置を失いやすいため、項目定義リストの項目を1つずつ指差し確認するように慎重に生成してください。\n\n---\n\n## 出力ルール\n\n### 全体ルール\n*   項目の省略、結合、順序の入れ替え、要約範囲の変更は一切禁止します。\n*   ソースに情報がない項目は、空白にせず、一律「記載なし」と出力してください（No.165だけは「なし」。No.167〜185の短い文も、情報がなければ「記載なし」とする。転記のときは空欄のまま残る）。\n*   「記載なし」はシートに転記するときに空欄に置き換わります。行がずれないよう、情報がない項目も必ず「記載なし」と出力してください。\n*   **1つの値の中で改行しないでください。** 文章の項目も、薬が複数ある場合も、必ず1行で出力してください（改行すると、それ以降の行がすべてずれます）。\n*   不自然な英単語や外国語、記号などの混入を防ぎ、標準的かつ自然な日本語で出力してください。アルファベットと数字は半角で記載してください。\n*   文章項目は敬語を使わず、「である調」で記載してください。\n\n### 【出力フォーマット：コピー用（テキスト形式）】\n*   **転記用の為、見出し、No.、項目名、記号等は一切含めないでください。**\n*   **フォーマット**：テキスト形式（値のみを改行区切りで出力）\n*   **ルール**：項目定義リスト（No.1〜217）に対応する値のみを、改行区切りで**「正確に217行」**出力してください。空行は挟まず、情報がない行も必ず「記載なし」を出力してください。\n*   **217行の値は、枠や印を付けない普通の文章（プレーンテキスト）で、続けて出力してください。1行目は氏名（No.1）。```やtextなどの印、見出し、空行を入れない。最後の行はNo.217。**\n*   チャット画面がコードの枠（```）を求める場合でも、枠は使わず普通の文章のままでかまいません。\n*   217行の値の中に支援経過やコメントを混ぜないでください。支援経過記録は、217行のあとに1行空けてから、**別のまとまり**として出力してください（後述）。さらに支援経過のあとに1行空けて、出力の一番最後に「◆要確認」のまとまりを出力してください（後述）。\n*   生成した文の最後に文字数は入れないでください。トリプルクリックでその文を選択してコピペするためです。\n\n---\n\n## 区分ルール\n\n### 選択式項目（※エクセルのプルダウンの選択肢と同じ語を、1語だけ出力）\n*   認定調査票や主治医意見書等から判断し、**下の表の選択肢のいずれか1つを、表記をそのまま（一言で）**出力してください。\n*   「自立している」「あります」のような説明や文末表現（〜です、〜状態等）を付け加えることは一切禁止です。\n*   認定調査票の選択肢がプルダウンと異なる場合は、次のように置き換えてください。\n    - 「見守り」「見守り等」→「見守り等」\n    - 「できる」「介助なし」→「自立」\n    - 「つかまれば可」「何かにつかまればできる」「支えが必要」→「見守り等」\n    - 「一部介助」「一部できる」→「一部介助」\n    - 「全介助」「できない」→「全介助」\n    - 「ない」「なし」→「なし」、「ある」「あり」「ときどき」→「あり」（あり/なしの項目のとき）\n    - あり/なしの項目と No.125〜138 では、「ある」「ない」は使わず、必ず「あり」「なし」（No.125〜127, 129〜133, 135〜138 は「ときどきあり」も可）で出力する。\n*   分類・判断が困難な場合は「記載なし」としてください（プルダウンにない語は出力しない）。\n\n| No. | 選択肢（このどれか1つ） |\n|---|---|\n| 3 | 男／女 |\n| 21 | 要支援1／要支援2／要介護1／要介護2／要介護3／要介護4／要介護5 |\n| 23 | 1割／2割／3割 |\n| 25, 26 | 自立／J1／J2／A1／A2／B1／B2／C1／C2 |\n| 27, 28 | 自立／Ⅰ／Ⅱa／Ⅱb／Ⅲa／Ⅲb／Ⅳ／M |\n| 51, 52, 70, 71, 73, 74, 86, 88, 93, 97, 98, 111, 113, 117, 119〜124, 128, 134, 139, 141〜144, 147〜149, 152〜157, 162, 186, 190 | あり／なし |\n| 56〜62, 64, 66, 69, 72, 76, 78, 79, 81, 82, 84, 91, 100〜107 | 自立／見守り等／一部介助／全介助 |\n| 63, 65 | なし／杖／歩行器／シルバーカー／車いす／その他 |\n| 68 | トイレ／ポータブルトイレ／ベッド上／その他 |\n| 77 | 毎日／清拭のみ／週1回／週2回／週3回／週4回／週5回／週6回／月2〜3回／月1回／月1回未満 |\n| 85 | 全部ある／一部ある／ほとんどない／なし |\n| 89 | なし／上下総義歯／上総義歯／下総義歯／上下部分義歯／上部分義歯／下部分義歯／上総義歯・下部分義歯／上部分義歯・下総義歯 |\n| 92 | 普通食／軟飯・軟菜／粥／キザミ食／ペースト・ミキサー食／経管栄養（常食→普通食、全粥・五分粥→粥、刻み・きざみ→キザミ食、ミキサー・ペースト・ムース→ペースト・ミキサー食、胃ろう・経鼻・経管→経管栄養） |\n| 146 | 良好／不良 |\n| 80, 87, 96, 161 | 良好／普通／不良（判断基準は下記） |\n| 95 | できる／見守り等／できない |\n| 109 | できる／ときどきできる／ほとんどできない／できない |\n| 110 | 普通／1m先が見える／目の前が見える／ほとんど見えない／判断不能 |\n| 112 | 普通／やっと聞こえる／大声で聞こえる／ほとんど聞こえない／判断不能 |\n| 114 | 日常会話／簡単な会話のみ／筆談／身振り・ジェスチャー／文字盤・コミュニケーション機器／意思表示困難／その他 |\n| 118 | アルツハイマー型認知症／脳血管性認知症／レビー小体型認知症／前頭側頭型認知症／認知症（詳細不明）／脳梗塞／脳出血／くも膜下出血／パーキンソン病／骨折（大腿骨頸部）／骨折（腰椎圧迫）／変形性膝関節症／腰部脊柱管狭窄症／関節リウマチ／骨粗鬆症／糖尿病／心不全／慢性腎不全／慢性閉塞性肺疾患（COPD）／がん（末期）／筋萎縮性側索硬化症（ALS）／脊髄小脳変性症／廃用症候群／高血圧症／その他（一覧にない病名はその病名を1語で） |\n| 116 | できる（特別な場合でもできる）／特別な場合を除いてできる／日常的に困難／できない |\n| 125〜127, 129〜133, 135〜138 | なし／ときどきあり／あり（「ない」「ある」「ときどきある」とは書かない） |\n| 151 | 戸建て／集合住宅（アパート・マンション・団地・公営住宅などは集合住宅） |\n| 160 | 独居／高齢者世帯／家族同居／二世帯同居／日中独居／その他 |\n| 187 | 正常／高い／低い |\n| 188 | 国民健康保険／健康保険／後期高齢者医療／医療扶助（生活保護） |\n| 189 | 国民年金／厚生年金／障害年金／その他／なし（複数受給は主なもの1つ） |\n| 191 | なし／1級／2級／3級／4級／5級／6級 |\n| 192 | なし／A1／A2／A3／B1／B2 |\n| 193 | なし／1級／2級／3級 |\n| 208 | なし／夜間／常時 |\n| 210 | 自立／シャワー浴／一般浴／機械浴 |\n\n### 【良好／普通／不良の判断基準（No.80・87・96・161）】\n*   **良好**：資料に問題がないことが明記されている、または支援なしで保たれている。\n*   **普通**：軽い問題や一部支援はあるが生活に大きな支障はない、または支援により保たれている。\n*   **不良**：資料に問題・支障・要支援が明記されている、または課題として挙がっている。\n*   根拠が資料にない場合は「記載なし」とし、推測で「普通」にしない。\n*   No.80「爪の状態」：良好＝自分で切れる・異常なし／普通＝介助で切っている・軽い変形／不良＝巻き爪・白癬・肥厚など。\n*   No.87「口腔内の状態」：良好＝清潔・問題なし／普通＝義歯使用や一部介助で保たれている／不良＝口臭・汚れ・痛み・歯肉の腫れなど。\n*   No.96「栄養状態」：良好＝BMI18.5〜25未満で体重変化なし／普通＝BMIがやや外れる、または軽い食欲低下／不良＝BMI18.5未満、半年で2〜3kg以上の体重減少、低栄養の指摘あり。\n*   No.161「睡眠の状態」：良好＝夜間よく眠れている／普通＝時々眠れない・眠剤で眠れている／不良＝昼夜逆転・不眠の訴え・夜間の不穏など。\n*   No.146「家族との関係性」は良好／不良のまま（普通は使わない）。\n\n### 【認知機能・精神行動障害（No.125〜139）の厳密マッピング表】\nAIは、以下の定義に基づき、1対1で正確に値を抽出してください。動的なマッピング解釈は禁止します。\n*   **No.125 「被害的」** ＝ 認定調査票 第4群-1「被害的」\n*   **No.126 「作話」** ＝ 認定調査票 第4群-2「作話」\n*   **No.127 「感情が不安定」** ＝ 認定調査票 第4群-3「感情が不安定」\n*   **No.128 「暴力・攻撃性」** ＝ 主治医意見書 3-(3)「暴力」の有無\n*   **No.129 「大声を出す」** ＝ 認定調査票 第4群-6「大声を出す」\n*   **No.130 「介護に抵抗」** ＝ 認定調査票 第4群-7「介護に抵抗」\n*   **No.131 「一人で出たがる」** ＝ 認定調査票 第4群-9「一人で出たがる」\n*   **No.132 「収集癖」** ＝ 認定調査票 第4群-10「収集癖」\n*   **No.133 「物や衣類を壊す」** ＝ 認定調査票 第4群-11「物や衣類を壊す」\n*   **No.134 「不潔行為」** ＝ 主治医意見書 3-(3)「不潔行為」の有無\n*   **No.135 「話がまとまらない」** ＝ 認定調査票 第4群-15「話がまとまらない」\n*   **No.136 「徘徊の有無」** ＝ 認定調査票 第3群-8「徘徊」\n*   **No.137 「昼夜逆転」** ＝ 認定調査票 第4群-4「昼夜逆転」\n*   **No.138 「独り言、一人笑い」** ＝ 認定調査票 第4群-13「独り言・独り笑い」\n*   **No.139 「危険行為」** ＝ 主治医意見書 3-(3)の該当項目があれば「あり」、なければ「なし」\nNo.116〜139の24項目はずれやすいため、要約項目に続く処理の際は必ず24項目を1行ずつ正確に出力し、行数を守ってください。\n\n### 文章項目（No.16〜19）\n*   **No.16「これまでの生活」**：生まれ育ち、職歴、家族歴、趣味や大切にしてきたこと、介護が必要になった経緯などを資料から読み取り、200文字程度で記載する。\n*   **No.17「現在の状況」**：直近の心身の状態、日中の過ごし方、介助を受けている内容、介護保険サービスの利用状況などを、200文字程度で記載する（入院時情報提供書の「生活歴及び直近2週間以内の心身状況…」欄にも転記される）。\n*   **No.18「利用者の主訴・意向」**：本人の言葉を生かし、20文字〜40文字程度で記載する。\n*   **No.19「家族の主訴・意向」**：家族の言葉を生かし、20文字〜40文字程度で記載する。家族がいない、または確認できない場合は「記載なし」。\n*   いずれも敬語は使わない。前回のアセスメントシートは参考にとどめ、最新の認定調査票からの読み取りを優先する。\n\n### 要約項目（※特記事項）\n*   **処理方法**：指定された範囲の内容を客観的に整理し、100文字から200文字程度で要約して出力してください（1行で）。\n*   **要約対象**：No.55, No.67, No.75, No.83, No.90, No.99, No.108, No.115, No.140, No.145, No.150, No.158, No.159, No.164, No.166\n*   No.55は29〜54、No.67は56〜66、No.75は68〜74、No.83は76〜82、No.90は84〜89、No.99は91〜98、No.108は100〜107、No.115は109〜114、No.140は116〜139、No.145は141〜144、No.150は146〜149、No.158は151〜157、No.164は161〜163の内容をふまえて記載する。No.159は全体のまとめ・総括とする。\n\n## 【特定項目（No.67）に関する個別ルール】\nNo.67「ADLに対する特記、解決すべき課題など」は、福祉用具の必要性のみを記載する項目ではなく、ADL全般の総合評価として作成すること。\n※作成にあたっては、No.56〜66の抽出結果（寝返りから階段移動まで）を必ず参照し、その内容を要約に反映させてください。\n\n記載優先順位（この順番で要約すること）\n①寝返り ②起き上がり ③座位保持 ④立ち上がり ⑤立位保持 ⑥移乗 ⑦屋内歩行 ⑧屋外歩行 ⑨階段移動 ⑩福祉用具の必要性\n\n必須ルール（No.67では必ず以下の内容を含めること）\n*   現在できている動作\n*   介助が必要な動作\n*   転倒リスク\n*   身体機能低下の状況\n*   ADL維持・改善の課題\n福祉用具の必要性のみで文章を構成してはならない。\n\n文字数配分ルール\nNo.67の要約は100〜200文字程度とする。そのうち、ADL評価：70％以上、福祉用具必要性：30％以下とする。\n\n出力例（2モーター特殊寝台あり）\n寝返りは見守りで可能。起き上がりや立ち上がりは介助を要し、移乗時にふらつきがみられる。屋内歩行は歩行器使用にて可能であるが転倒リスクがある。下肢筋力低下に伴いADLの維持が課題となっている。病状よりADL低下が著明であり、安全に起き上がりや立ち上がりを行うために背上げ機能、高さ調整機能付きの2モーター特殊寝台が必要。\n\n出力例（3モーター特殊寝台あり）\n寝返りは一部介助、起き上がり・移乗は全介助を要する。座位保持は短時間可能であるが疲労しやすく、歩行は困難で車いすを使用している。全身状態の低下によりADL全般に介助が必要である。病状よりADL低下が著明であり、安定した起居動作の確保、身体の負担軽減のため背上げ機能、高さ調整ができるもの。また、足の浮腫がある為、足上げ機能付きの特殊寝台及び付属品(3モーター)が必要。\n\n## 【No.25〜28（日常生活自立度）に関するルール】\n*   日常生活自立度（寝たきり度・認知症）は、認定調査票の値を記載する（活字で読み取りやすいため）。No.26「障害日常生活自立度・認定調査票」とNo.28「認知症日常生活自立度・認定調査票」は、認定調査票の値を記載する。\n*   主治医意見書のチェックは手書き・スキャンで読み誤りが起きやすい。読み取れない、または確信が持てない場合は推測で記載しない。No.25「障害日常生活自立度・医師」とNo.27「認知症日常生活自立度・医師」は、主治医意見書のチェックがはっきり読み取れる場合だけその値を記載し、読み取れない・確信が持てない場合は「記載なし」とする（認定調査票の値で埋めない）。\n*   文章項目（No.17、No.159など）や支援経過で自立度に触れる場合も、認定調査票の値を使う。\n*   主治医意見書の自立度が調査票と異なる場合、または読み取れない場合は、出力の最後に「◆要確認：自立度（調査票：B2／Ⅱb、意見書：読み取り不可）」のように一覧で示す（書き方は後述の「要確認の一覧」のとおり）。\n\n## 【数値出力項目に関するルール】\n*   No.49（身長）、No.50（体重）、No.94（1日の食事回数）は**数字のみ**を出力すること。単位、全角文字、空白、記号は一切付与しない。\n*   例：160cm → 160、48kg → 48、45.5kg → 45.5、1日3食 → 3\n*   小数点がある場合はそのまま出力する。ソースに情報がない場合は「記載なし」とする。\n\n## 【No.53「服薬内容」に関するルール】\n*   処方薬局情報、薬剤師名、お薬名、用法・用量、1回量を記載する。薬の効果などの内容はいらない。処方日数もいらない。\n*   複数ある場合も**改行せず**、「、」で区切って1行で出力する。\n*   記載例：キャブピリン配合錠（1日1回 朝食後 1錠）、アムロジピン錠5mg（1日1回 朝食後 1錠）\n\n## 【No.160〜166（生活リズム・その他留意すべき事項）に関するルール】\n*   **No.160「世帯区分」**：選択肢から1つ（独居／高齢者世帯／家族同居／二世帯同居／日中独居／その他）。\n*   **No.161「睡眠の状態」**：良好／普通／不良（判断基準は区分ルールの「良好／普通／不良の判断基準」）。認定調査票の特記（夜間の状況、昼夜逆転など）や主治医意見書から判断する。\n*   **No.162「眠剤の使用」**：あり／なし。お薬情報や主治医意見書に睡眠薬・睡眠導入剤があれば「あり」。\n*   **No.163「週間予定」**：添付のケアプランの**第3表（週間サービス計画表）を最優先**に、なければ**第2表のサービス内容・頻度**から、利用しているサービスをすべて拾って1行にまとめる。書き方は「曜日（または頻度）：サービス種別」を「、」でつなぐ。例：「月・木：デイサービス、火・金：訪問介護、月1回：訪問診療、福祉用具貸与」。同じ曜日のサービスは曜日ごとにまとめ、曜日が決まっていないもの（月1回・月2回・随時など）は頻度を付け、福祉用具貸与のように曜日・頻度のないものはサービス名だけを最後に書く。事業所名・時間帯は書かない。セルに収まるよう全角60字程度までにする。ケアプランが添付されていない場合だけ、認定調査票・面談の記録などにある利用中のサービスから同じ形で書く。どこにも情報がなければ「記載なし」。\n*   **No.164「生活リズムに対する特記、解決すべき課題など」**：起床・就寝、日中の過ごし方、睡眠、活動量について、100〜200文字程度で記載する。\n*   **No.165「その他留意すべき事項（該当するもの）」**：次の6つのうち、**資料や面談の記録・音声に、はっきりと記載・発言があるものだけ**を「、」で区切って出力する：虐待／経済的困窮／身寄りなし／外国人／医療依存が高い／看取り。推測で挙げないこと。該当がない、またははっきりしない場合は「なし」とする（「記載なし」ではなく「なし」）。\n*   **No.166「その他留意すべき事項に対する特記、解決すべき課題など」**：No.165で該当があり、資料に具体的な記載がある場合だけ記載する。それ以外は「記載なし」とする。\n\n\n## 【No.167〜185（入院時情報提供書・退院退所情報記録書の右側に入る短い文）に関するルール】\n*   1項目**全角20文字程度まで**の短い文を、**1行・改行なし**で出力する。枠に入らないため、20文字を大きく超えないこと。\n*   敬語は使わず、体言止めや「〜あり」「〜で見守り」のような簡潔な書き方にする。月何回などの頻度は書かない。\n*   No.1〜166の内容と矛盾しないように、その欄で伝えたい要点を1つだけ書く。\n*   情報がない場合は「記載なし」と出力する（「記載なし」はシートには転記されず、空欄のまま残る）。\n*   各項目で書く内容：\n    - No.167「入院経緯」：入院に至った経緯（いつ・何で入院したか）\n    - No.168「現疾患の状況」：入院の原因となった病気の今の状態\n    - No.169「既往歴」：主な既往歴を病名だけで「、」区切り\n    - No.170「移動」：移動の方法や注意点（例：屋内は歩行器で見守り）\n    - No.171「入浴」：入浴の方法や介助の内容\n    - No.172「排泄」：排泄の方法・用具（おむつ・パッド等）や介助の内容\n    - No.173「食事」：食事の摂り方、食事制限・治療食など\n    - No.174「嚥下」：むせ・とろみなど嚥下の注意点\n    - No.175「口腔清潔」：口腔内の清潔の状態\n    - No.176「口腔ケア」：歯磨き・口腔ケアの方法や介助\n    - No.177「義歯」：義歯の種類・上下・管理（例：上下総義歯、夜間外す）\n    - No.178「睡眠」：睡眠の状態、眠剤の使用\n    - No.179「認知・精神」：認知機能・精神面の要点\n    - No.180「IADL」：家事などで支援が必要な内容\n    - No.181「本人の意向」：退院後の生活についての本人の意向\n    - No.182「家族の意向」：退院後の生活についての家族の意向\n    - No.183「褥瘡の部位・状態」：褥瘡がある場合の部位・状態。ない場合は「記載なし」\n    - No.184「内服の特記」：内服で注意すること（例：一包化、飲み忘れあり）\n    - No.185「コミュニケーション」：意思疎通・意思決定の要点\n\n## 【No.186〜193（医療・社会保障）に関するルール】\n*   **No.186「感染症の有無」**：あり／なし。主治医意見書やサマリーに感染症（MRSA、HBV、HCV、結核、疥癬など）の記載があれば「あり」。\n*   **No.187「血圧」**：正常／高い／低い。主治医意見書・サマリー・バイタルの記録から判断する。\n*   **No.188「医療保険」**：介護保険証・資料から、表の選択肢のどれか1つ。\n*   **No.189「年金の受給状況」**：表の選択肢のどれか1つ。\n*   **No.190「生活保護」**：あり／なし。\n*   **No.191〜193（身体障害者手帳・療育手帳・精神障害者保健福祉手帳）**：持っている場合は等級だけを、区分表の選択肢のどれか1つで書く（身体：1級〜6級、療育：A1／A2／A3／B1／B2、精神：1級〜3級）。持っていないことが資料ではっきりしている場合は「なし」、わからない場合は「記載なし」。\n\n## 【No.194〜205（現在利用している支援や社会資源：事業所名）に関するルール】\n*   添付のケアプラン（第1表・第2表・第3表）**からだけ**読み取る。ほかの資料から推測しない。\n*   **事業所名だけ**を書く（サービス内容・曜日・回数は書かない）。\n*   同じ種類のサービスを複数の事業所で使っている場合は「、」でつなぐ。\n*   ケアプランに「（調整中）」と書かれている場合は、そのまま残す（例：○○訪問看護ステーション（調整中））。\n*   使っていないサービス、またはケアプランが添付されていない場合は「記載なし」。\n*   順番：No.194 訪問介護、195 デイサービス/デイケア、196 訪問診療、197 訪問薬局、198 訪問歯科、199 定期巡回訪問介護看護、200 訪問看護、201 訪問リハビリ、202 福祉用具貸与/購入/住宅改修、203 ショートステイ、204 訪問入浴介護、205 訪問マッサージ\n\n## 【No.206〜217（入院時情報提供書・退院退所情報記録書に入る項目）に関するルール】\n*   情報がない項目は「記載なし」（シートには転記されず空欄のまま。チェックも変えない）。\n*   **No.206「ADL特記（入院時用）」**：移動・移乗・起居などの動作がどこまでできるかと、介助するときの注意点を80〜100字の文で書く。福祉用具や特殊寝台のことは書かない。\n*   **No.207「アレルギー」**：資料にアレルギーの記載があれば「あり（内容）」（例：あり（卵、ペニシリン））、ないとはっきり書かれていれば「なし」。\n*   **No.208「オムツ/パッドの使用」**：なし／夜間／常時 のどれか1つ。\n*   **No.209「コミュニケーション特記（入院時用）」**：意思疎通の程度、視力・聴力の影響、伝わりやすい伝え方を40〜60字の文で書く。\n*   **No.210「入浴方法」**：自立／シャワー浴／一般浴／機械浴 のどれか1つ。資料やケアプランに書かれていなければ「記載なし」。\n*   **No.211「IADL特記（入院時用）」**：家事、買い物、服薬、金銭管理を本人がどこまでできて、誰が支えているかを60〜80字の文で書く。\n*   **No.212「医療処置」**：資料にある処置を、次の語から選んで「、」でつなぐ：点滴、酸素療法、喀痰吸引、気道切開、胃ろう、尿道カテーテル、尿路ストーマ、消化管ストーマ、痛みコントロール、排便コントロール、経鼻栄養、経腸栄養、褥瘡、自己注射。この中にない処置は、その処置名をそのまま書いて「、」でつなぐ。処置がないとはっきりしていれば「なし」。\n*   **No.213「医療処置の特記」**：No.212で処置がある場合だけ、処置の内容・頻度・管理する人・注意点を60〜80字の文で書く。処置がない場合は「記載なし」。\n*   **No.214「看護の視点」**：退院後に看護の視点で注意が必要なものを、次の語から選んで「、」でつなぐ：血圧、水分制限、食事制限、食形態、嚥下、口腔ケア、清潔ケア、血糖コントロール、排泄、皮膚状態、睡眠、認知機能・精神面、服薬指導、療養上の指導、ターミナル。この中にないものはそのまま書く。当てはまるものがなければ「なし」。\n*   **No.215「リハビリの視点」**：必要なリハビリを、次の語から選んで「、」でつなぐ：本人指導、家族指導、関節可動域練習、筋力増強練習、バランス練習、麻痺・筋緊張改善練習、基本動作練習、摂食・嚥下訓練、言語訓練、ADL練習、IADL練習、疼痛管理、更生装具・福祉用具等管理、運動耐容能練習、地域支援活動、社会参加支援、就労支援。この中にないものはそのまま書く。当てはまるものがなければ「なし」。\n*   **No.216「禁忌事項」**：資料に禁忌の記載があれば「あり（内容）」、ないとはっきり書かれていれば「なし」。\n*   **No.217「備考（医療機関への申し送り）」**：問題点や困りごと、配慮が必要なこと、家族関係などの困難事例のうち、医療機関に伝えておきたいことを80〜100字の文で書く。特になければ「記載なし」。\n\n## 【文章のルール（共通）】\n*   敬語はつかわない。\n*   アルファベットは半角で記載する。\n*   月何回など頻度は記載しない（文章項目・要約項目・短い文（No.167〜185）・支援経過。※No.77「入浴の頻度」、No.94「1日の食事回数」、No.163「週間予定」の曜日・頻度は除く）。\n\n---\n\n## 項目定義リスト\n1. 氏名\n2. フリガナ\n3. 性別\n4. 生年月日\n5. 郵便番号\n6. 住所\n7. 電話番号\n8. 家族氏名\n9. 続柄\n10. 緊急連絡氏名(家族)\n11. 家族住所\n12. 家族連絡先\n13. 主治医名\n14. 医療機関名・病院名\n15. 医療機関連絡先\n16. これまでの生活\n17. 現在の状況\n18. 利用者の主訴・意向\n19. 家族の主訴・意向\n20. 介護保険認定情報・被保険者番号\n21. 要介護度\n22. 認定年月日\n23. 負担割合\n24. 認定の有効期間\n25. 障害日常生活自立度・医師\n26. 障害日常生活自立度・認定調査票\n27. 認知症日常生活自立度・医師\n28. 認知症日常生活自立度・認定調査票\n29. a病名\n30. a発症時期(年月)\n31. a病院名\n32. a主治医名\n33. b病名\n34. b発症時期(年月)\n35. b病院名\n36. b主治医名\n37. c病名\n38. c発症時期(年月)\n39. c病院名\n40. c主治医名\n41. d病名\n42. d発症時期(年月)\n43. d病院名\n44. d主治医名\n45. e病名\n46. e発症時期(年月)\n47. e病院名\n48. e主治医名\n49. 身長\n50. 体重\n51. 麻痺\n52. 褥瘡\n53. 服薬内容\n54. 薬局名\n55. 健康状態に対する特記、解決すべき課題など\n56. 寝返り\n57. 起き上がり\n58. 座位保持\n59. 立ち上がり\n60. 立位保持\n61. 移乗\n62. 屋内歩行\n63. 使用器具(屋内)\n64. 屋外歩行\n65. 使用器具(屋外)\n66. 階段移動\n67. ADLに対する特記、解決すべき課題など\n68. 排泄の場所\n69. 排尿動作\n70. 尿意\n71. 尿失禁の有無\n72. 排便動作\n73. 便意\n74. 便失禁\n75. 排泄に対する特記、解決すべき課題など\n76. 入浴動作\n77. 入浴の頻度\n78. 衣類の着脱\n79. 爪切りの動作\n80. 爪の状態\n81. 洗顔の動作\n82. 整髪の動作\n83. 清潔保持に対する特記、解決すべき課題など\n84. 歯磨きの状況\n85. 残存歯\n86. 義歯の有無\n87. 口腔内の状態\n88. 口臭の有無\n89. 義歯の場所\n90. 口腔内に対する特記、解決すべき課題など\n91. 食事・水分摂取の動作\n92. 食事形態\n93. 水分とろみ\n94. 1日の食事回数\n95. 嚥下\n96. 栄養状態\n97. 食事制限\n98. 水分制限\n99. 食事摂取に     "template": "#役割\nあなたは経験豊富な主任介護支援専門員です。\n福岡市の居宅介護支援運営基準、介護保険制度、LIFEを意識したアセスメント作成を行ってください。\n文章は監査で読まれても違和感がない内容にしてください。\n\n# 介護アセスメント（変更分）抽出指示書（コピー専用・行ズレ極小化版）\n\n## アセスメント設定\n*   **役割**：介護支援専門員（ケアマネジャー）\n*   **目的**：前回のアセスメントをベースに、今回の変更内容（新しいケアプラン、認定結果、状態変化など）を反映したアセスメント項目（No.1〜217）を作成し、通常版のアセスメントと**まったく同じ217行の形式**で出力する。出力はそのまま「転記元完成版」のC2:C218に貼り付けるため、行数・順番・書き方は通常版と同じにする。\n*   **添付資料**：\n    - 前回のアセスメント（必須。アセスメントシート、または前回の217行の出力）\n    - 新しいケアプラン（第1〜3表）\n    - 面談の記録や音声（ある場合）\n    - 認定調査票・主治医意見書・介護保険証・負担割合証（ある場合）\n    - 本人情報、サマリー、お薬情報など（ある場合）\n*   これら全てを読み込み、整合性を確認したうえで更新する。\n*   事実（ADL・認知・医療など本人の状態）は、今回添付された認定調査票・主治医意見書・面談の記録を優先し、今回の資料に書かれていないことは前回の内容を引き継ぐ。ただし、No.25〜28（日常生活自立度）は【No.25〜28（日常生活自立度）に関するルール】に従う。\n*   サービス内容・福祉用具・目標に関わる記載（No.17、No.67、No.159、No.163など）は、ケアプランと矛盾しないように書き、食い違いがある場合は認定調査票の事実を書いたうえでケアプラン上の対応を記載する。\n\n## 行ズレ・誤作動防止のための「生成3原則」\n1.  **アンカー・セルフカウント（10行ルール）**：\n    No.1からNo.217までの出力中、10行出力するごとに内部で「今、No.10（または20, 30...）に該当する値を出力した。次の項目名は〇〇である」と行数カウントを確認し、行のスキップや重複を防いでください。\n2.  **項目定義と出力値の脳内同期**：\n    項目定義リスト（No.1〜217）の項目名と、実際に出力する値を脳内で厳密に同期させ、行のズレや不足が1行も生じないようにしてください。出力時には項目名やNo.、記号は含めず、値のみを正確に改行区切りで出力します。\n3.  **「あり/なし/全介助」等、連続エリアの集中監視**：\n    特に値のみが連続するエリア（No.56〜66、No.100〜107、No.116〜139、No.141〜144、No.152〜157、No.160〜166、No.167〜193、No.194〜205、No.206〜217）では位置を失いやすいため、項目定義リストの項目を1つずつ指差し確認するように慎重に生成してください。\n\n---\n\n## 【変更分の作成ルール（前回アセスメントからの更新）】\n\n### 基本方針\n*   前回のアセスメントをベースに更新する。前回の内容と矛盾しないことを最優先とする。\n*   **変更がない項目も省略せず、前回の値をそのまま出力する**（217行すべてを出力する。出力しない項目を作らない）。\n*   今回の変更に関係する項目だけを書き直す。変更内容に合わせて他の項目も直す必要があれば、その項目も直す（例：歩行が悪化 → No.62・63・67・159・170・206も見直す）。\n*   前回のアセスメント・新しいケアプラン・面談の記録・認定情報を比べて、矛盾・記載漏れ・不足・古い内容があれば自然に補完・修正する。前回に足りない情報が今回の資料から読み取れる場合は積極的に追加する。\n*   認定更新で変更がない内容はそのままでかまわないが、新しい認定内容や状態変化に合わせた方が自然な箇所は修正する。\n*   ケアプランとの整合性は必ず取る。サービス内容や目標が変わる場合は、アセスメント側も矛盾しないよう修正する（No.17、No.67、No.159、No.163、No.194〜205など）。\n\n### 前回の値の引き継ぎ方\n*   **選択式の項目**：今回の資料で変化が確認できなければ、前回の値をそのまま出力する。ただし前回の値がいまのプルダウンにない表記の場合は、区分ルールの選択肢に置き換える（例：「ある」「有」→「あり」、「ない」「無」→「なし」、「ときどきある」→「ときどきあり」）。置き換えられない値（「詳細不明」など）は「記載なし」とする。\n*   **No.80・87・96・161**：前回が「良好」「不良」の場合、今回の資料に根拠があるときだけ下記の判断基準で「良好／普通／不良」を付け直す。根拠がなければ前回の値のまま。\n*   **文章の項目**：変化がなければ前回の文を基本的に引き継ぐ。今回の内容（新しいサービス、目標、状態）と合わない部分、古くなった部分だけを自然に書き直す。前回の文に今回の内容をつぎ足して長くしすぎず、文字数の決まりを守る。\n*   **「不詳」**：前回や資料に「不詳」と書かれている値（発症時期など）は、今回の資料で判明しない限り「不詳」のまま残す（「記載なし」に変えない）。\n*   **「記載なし」**：今回の資料にも前回にも情報がない項目だけ「記載なし」とする。前回に値があるのに「記載なし」にしない。\n*   **前回が古い形式の場合**：前回のアセスメントは項目数が少ない古い形式のことがある。**No.ではなく項目名で照らし合わせて**引き継ぎ、前回にない項目（No.167〜217など）は今回の資料と前回の内容から作成する。前回の行の並びをそのまま写さない。\n\n### 必ず今回の資料で更新する項目\n*   **認定更新・区分変更が確定した場合**：No.21「要介護度」、No.22「認定年月日」、No.24「認定の有効期間」は必ず新しい認定内容に書き換える（No.20・23・25〜28も新しい資料があれば更新する。No.25〜28は【No.25〜28（日常生活自立度）に関するルール】に従う）。\n*   **No.163「週間予定」、No.194〜205「利用中の事業所名」**：新しいケアプランから作り直す（書き方は下記の各ルールのとおり）。\n*   **No.18・19・181・182（意向）**：今回の面談の記録・ケアプラン第1表に新しい意向があれば書き換える。\n\n### 初期値のある項目\n*   No.153「浴室の有無」・No.154「ペットの有無」は、今回も前回も情報がなければ「記載なし」でよい（シート側で浴室「あり」、ペット「なし」に戻る）。\n*   エアコンの有無、起床・食事・入浴・就寝の時刻は217行に含まれない（シートの初期値のまま）。出力しない。\n\n---\n\n## 出力ルール\n\n### 全体ルール\n*   項目の省略、結合、順序の入れ替え、要約範囲の変更は一切禁止します。\n*   今回の資料にも前回のアセスメントにも情報がない項目は、空白にせず、一律「記載なし」と出力してください（No.165だけは「なし」。No.167〜185の短い文も、情報がなければ「記載なし」とする。転記のときは空欄のまま残る）。\n*   「記載なし」はシートに転記するときに空欄に置き換わります。行がずれないよう、情報がない項目も必ず「記載なし」と出力してください。\n*   **1つの値の中で改行しないでください。** 文章の項目も、薬が複数ある場合も、必ず1行で出力してください（改行すると、それ以降の行がすべてずれます）。\n*   不自然な英単語や外国語、記号などの混入を防ぎ、標準的かつ自然な日本語で出力してください。アルファベットと数字は半角で記載してください。\n*   文章項目は敬語を使わず、「である調」で記載してください。\n\n### 【出力フォーマット：コピー用（テキスト形式）】\n*   **転記用の為、見出し、No.、項目名、記号等は一切含めないでください。**\n*   **フォーマット**：テキスト形式（値のみを改行区切りで出力）\n*   **ルール**：項目定義リスト（No.1〜217）に対応する値のみを、改行区切りで**「正確に217行」**出力してください。空行は挟まず、情報がない行も必ず「記載なし」を出力してください。\n*   **217行の値は、枠や印を付けない普通の文章（プレーンテキスト）で、続けて出力してください。1行目は氏名（No.1）。```やtextなどの印、見出し、空行を入れない。最後の行はNo.217。**\n*   チャット画面がコードの枠（```）を求める場合でも、枠は使わず普通の文章のままでかまいません。\n*   217行の値の中に支援経過やコメントを混ぜないでください。「シート上部の記入事項」「今回変更した項目」「変更を推奨する項目」「支援経過」「要確認」は、217行のあとに1行空けてから、**別のまとまり**として出力してください（後述）。\n*   生成した文の最後に文字数は入れないでください。トリプルクリックでその文を選択してコピペするためです。\n\n---\n\n## 区分ルール\n\n### 選択式項目（※エクセルのプルダウンの選択肢と同じ語を、1語だけ出力）\n*   認定調査票や主治医意見書等から判断し、**下の表の選択肢のいずれか1つを、表記をそのまま（一言で）**出力してください。\n*   「自立している」「あります」のような説明や文末表現（〜です、〜状態等）を付け加えることは一切禁止です。\n*   認定調査票の選択肢がプルダウンと異なる場合は、次のように置き換えてください。\n    - 「見守り」「見守り等」→「見守り等」\n    - 「できる」「介助なし」→「自立」\n    - 「つかまれば可」「何かにつかまればできる」「支えが必要」→「見守り等」\n    - 「一部介助」「一部できる」→「一部介助」\n    - 「全介助」「できない」→「全介助」\n    - 「ない」「なし」→「なし」、「ある」「あり」「ときどき」→「あり」（あり/なしの項目のとき）\n    - あり/なしの項目と No.125〜138 では、「ある」「ない」は使わず、必ず「あり」「なし」（No.125〜127, 129〜133, 135〜138 は「ときどきあり」も可）で出力する。\n*   分類・判断が困難な場合は「記載なし」としてください（プルダウンにない語は出力しない）。\n\n| No. | 選択肢（このどれか1つ） |\n|---|---|\n| 3 | 男／女 |\n| 21 | 要支援1／要支援2／要介護1／要介護2／要介護3／要介護4／要介護5 |\n| 23 | 1割／2割／3割 |\n| 25, 26 | 自立／J1／J2／A1／A2／B1／B2／C1／C2 |\n| 27, 28 | 自立／Ⅰ／Ⅱa／Ⅱb／Ⅲa／Ⅲb／Ⅳ／M |\n| 51, 52, 70, 71, 73, 74, 86, 88, 93, 97, 98, 111, 113, 117, 119〜124, 128, 134, 139, 141〜144, 147〜149, 152〜157, 162, 186, 190 | あり／なし |\n| 56〜62, 64, 66, 69, 72, 76, 78, 79, 81, 82, 84, 91, 100〜107 | 自立／見守り等／一部介助／全介助 |\n| 63, 65 | なし／杖／歩行器／シルバーカー／車いす／その他 |\n| 68 | トイレ／ポータブルトイレ／ベッド上／その他 |\n| 77 | 毎日／清拭のみ／週1回／週2回／週3回／週4回／週5回／週6回／月2〜3回／月1回／月1回未満 |\n| 85 | 全部ある／一部ある／ほとんどない／なし |\n| 89 | なし／上下総義歯／上総義歯／下総義歯／上下部分義歯／上部分義歯／下部分義歯／上総義歯・下部分義歯／上部分義歯・下総義歯 |\n| 92 | 普通食／軟飯・軟菜／粥／キザミ食／ペースト・ミキサー食／経管栄養（常食→普通食、全粥・五分粥→粥、刻み・きざみ→キザミ食、ミキサー・ペースト・ムース→ペースト・ミキサー食、胃ろう・経鼻・経管→経管栄養） |\n| 146 | 良好／不良 |\n| 80, 87, 96, 161 | 良好／普通／不良（判断基準は下記） |\n| 95 | できる／見守り等／できない |\n| 109 | できる／ときどきできる／ほとんどできない／できない |\n| 110 | 普通／1m先が見える／目の前が見える／ほとんど見えない／判断不能 |\n| 112 | 普通／やっと聞こえる／大声で聞こえる／ほとんど聞こえない／判断不能 |\n| 114 | 日常会話／簡単な会話のみ／筆談／身振り・ジェスチャー／文字盤・コミュニケーション機器／意思表示困難／その他 |\n| 118 | アルツハイマー型認知症／脳血管性認知症／レビー小体型認知症／前頭側頭型認知症／認知症（詳細不明）／脳梗塞／脳出血／くも膜下出血／パーキンソン病／骨折（大腿骨頸部）／骨折（腰椎圧迫）／変形性膝関節症／腰部脊柱管狭窄症／関節リウマチ／骨粗鬆症／糖尿病／心不全／慢性腎不全／慢性閉塞性肺疾患（COPD）／がん（末期）／筋萎縮性側索硬化症（ALS）／脊髄小脳変性症／廃用症候群／高血圧症／その他（一覧にない病名はその病名を1語で） |\n| 116 | できる（特別な場合でもできる）／特別な場合を除いてできる／日常的に困難／できない |\n| 125〜127, 129〜133, 135〜138 | なし／ときどきあり／あり（「ない」「ある」「ときどきある」とは書かない） |\n| 151 | 戸建て／集合住宅（アパート・マンション・団地・公営住宅などは集合住宅） |\n| 160 | 独居／高齢者世帯／家族同居／二世帯同居／日中独居／その他 |\n| 187 | 正常／高い／低い |\n| 188 | 国民健康保険／健康保険／後期高齢者医療／医療扶助（生活保護） |\n| 189 | 国民年金／厚生年金／障害年金／その他／なし（複数受給は主なもの1つ） |\n| 191 | なし／1級／2級／3級／4級／5級／6級 |\n| 192 | なし／A1／A2／A3／B1／B2 |\n| 193 | なし／1級／2級／3級 |\n| 208 | なし／夜間／常時 |\n| 210 | 自立／シャワー浴／一般浴／機械浴 |\n\n### 【良好／普通／不良の判断基準（No.80・87・96・161）】\n*   **良好**：資料に問題がないことが明記されている、または支援なしで保たれている。\n*   **普通**：軽い問題や一部支援はあるが生活に大きな支障はない、または支援により保たれている。\n*   **不良**：資料に問題・支障・要支援が明記されている、または課題として挙がっている。\n*   根拠が資料にない場合は「記載なし」とし、推測で「普通」にしない。\n*   No.80「爪の状態」：良好＝自分で切れる・異常なし／普通＝介助で切っている・軽い変形／不良＝巻き爪・白癬・肥厚など。\n*   No.87「口腔内の状態」：良好＝清潔・問題なし／普通＝義歯使用や一部介助で保たれている／不良＝口臭・汚れ・痛み・歯肉の腫れなど。\n*   No.96「栄養状態」：良好＝BMI18.5〜25未満で体重変化なし／普通＝BMIがやや外れる、または軽い食欲低下／不良＝BMI18.5未満、半年で2〜3kg以上の体重減少、低栄養の指摘あり。\n*   No.161「睡眠の状態」：良好＝夜間よく眠れている／普通＝時々眠れない・眠剤で眠れている／不良＝昼夜逆転・不眠の訴え・夜間の不穏など。\n*   No.146「家族との関係性」は良好／不良のまま（普通は使わない）。\n\n### 【認知機能・精神行動障害（No.125〜139）の厳密マッピング表】\nAIは、以下の定義に基づき、1対1で正確に値を抽出してください。動的なマッピング解釈は禁止します。\n*   **No.125 「被害的」** ＝ 認定調査票 第4群-1「被害的」\n*   **No.126 「作話」** ＝ 認定調査票 第4群-2「作話」\n*   **No.127 「感情が不安定」** ＝ 認定調査票 第4群-3「感情が不安定」\n*   **No.128 「暴力・攻撃性」** ＝ 主治医意見書 3-(3)「暴力」の有無\n*   **No.129 「大声を出す」** ＝ 認定調査票 第4群-6「大声を出す」\n*   **No.130 「介護に抵抗」** ＝ 認定調査票 第4群-7「介護に抵抗」\n*   **No.131 「一人で出たがる」** ＝ 認定調査票 第4群-9「一人で出たがる」\n*   **No.132 「収集癖」** ＝ 認定調査票 第4群-10「収集癖」\n*   **No.133 「物や衣類を壊す」** ＝ 認定調査票 第4群-11「物や衣類を壊す」\n*   **No.134 「不潔行為」** ＝ 主治医意見書 3-(3)「不潔行為」の有無\n*   **No.135 「話がまとまらない」** ＝ 認定調査票 第4群-15「話がまとまらない」\n*   **No.136 「徘徊の有無」** ＝ 認定調査票 第3群-8「徘徊」\n*   **No.137 「昼夜逆転」** ＝ 認定調査票 第4群-4「昼夜逆転」\n*   **No.138 「独り言、一人笑い」** ＝ 認定調査票 第4群-13「独り言・独り笑い」\n*   **No.139 「危険行為」** ＝ 主治医意見書 3-(3)の該当項目があれば「あり」、なければ「なし」\nNo.116〜139の24項目はずれやすいため、要約項目に続く処理の際は必ず24項目を1行ずつ正確に出力し、行数を守ってください。\n\n### 文章項目（No.16〜19）\n*   **No.16「これまでの生活」**：生まれ育ち、職歴、家族歴、趣味や大切にしてきたこと、介護が必要になった経緯などを資料から読み取り、200文字以内で記載する。生活歴は大きく変わらないため、前回の文を基本的に引き継ぐ。\n*   **No.17「現在の状況」**：直近の心身の状態、日中の過ごし方、介助を受けている内容、介護保険サービスの利用状況などを、今回の変更内容を反映して200文字以内で記載する（入院時情報提供書の「生活歴及び直近2週間以内の心身状況…」欄にも転記される）。\n*   **No.18「利用者の主訴・意向」**：本人の言葉を生かし、20文字〜40文字程度で記載する。\n*   **No.19「家族の主訴・意向」**：家族の言葉を生かし、20文字〜40文字程度で記載する。家族がいない、または確認できない場合は「記載なし」。\n*   いずれも敬語は使わない。前回の文をベースに、今回の資料（面談の記録、ケアプラン第1表の意向、認定調査票）で変わった点を反映する。\n\n### 要約項目（※特記事項）\n*   **処理方法**：指定された範囲の内容を客観的に整理し、100文字から200文字程度（200文字以内）で要約して出力してください（1行で）。ただしNo.159だけは250文字以内とする。\n*   **要約対象**：No.55, No.67, No.75, No.83, No.90, No.99, No.108, No.115, No.140, No.145, No.150, No.158, No.159, No.164, No.166\n*   No.55は29〜54、No.67は56〜66、No.75は68〜74、No.83は76〜82、No.90は84〜89、No.99は91〜98、No.108は100〜107、No.115は109〜114、No.140は116〜139、No.145は141〜144、No.150は146〜149、No.158は151〜157、No.164は161〜163の内容をふまえて記載する。No.159は全体のまとめ・総括とし、250文字以内で、今回のアセスメントの理由・変更内容と、それに伴うケアプラン（目標・サービス）の方向性が分かるように書く。認定更新・区分変更の場合は新しい要介護度にふれる。\n\n## 【特定項目（No.67）に関する個別ルール】\nNo.67「ADLに対する特記、解決すべき課題など」は、福祉用具の必要性のみを記載する項目ではなく、ADL全般の総合評価として作成すること。\n※作成にあたっては、No.56〜66の抽出結果（寝返りから階段移動まで）を必ず参照し、その内容を要約に反映させてください。\n\n記載優先順位（この順番で要約すること）\n①寝返り ②起き上がり ③座位保持 ④立ち上がり ⑤立位保持 ⑥移乗 ⑦屋内歩行 ⑧屋外歩行 ⑨階段移動 ⑩福祉用具の必要性\n\n必須ルール（No.67では必ず以下の内容を含めること）\n*   現在できている動作\n*   介助が必要な動作\n*   転倒リスク\n*   身体機能低下の状況\n*   ADL維持・改善の課題\n福祉用具の必要性のみで文章を構成してはならない。\n\n福祉用具の文言（変更分のルール）\n*   ケアプランとの整合性が必要なため、**福祉用具に関する部分は前回の文言をそのまま引き継ぐ**。\n*   特殊寝台がある場合は、必ずモーター数（2モーター、3モーターなど）を書く。\n*   新しいケアプランで福祉用具の追加・変更・終了がある場合だけ、その部分を書き換える。\n\n文字数配分ルール\nNo.67の要約は100〜200文字程度とする。そのうち、ADL評価：70％以上、福祉用具必要性：30％以下とする。\n\n出力例（2モーター特殊寝台あり）\n寝返りは見守りで可能。起き上がりや立ち上がりは介助を要し、移乗時にふらつきがみられる。屋内歩行は歩行器使用にて可能であるが転倒リスクがある。下肢筋力低下に伴いADLの維持が課題となっている。病状よりADL低下が著明であり、安全に起き上がりや立ち上がりを行うために背上げ機能、高さ調整機能付きの2モーター特殊寝台が必要。\n\n出力例（3モーター特殊寝台あり）\n寝返りは一部介助、起き上がり・移乗は全介助を要する。座位保持は短時間可能であるが疲労しやすく、歩行は困難で車いすを使用している。全身状態の低下によりADL全般に介助が必要である。病状よりADL低下が著明であり、安定した起居動作の確保、身体の負担軽減のため背上げ機能、高さ調整ができるもの。また、足の浮腫がある為、足上げ機能付きの特殊寝台及び付属品(3モーター)が必要。\n\n## 【No.25〜28（日常生活自立度）に関するルール】\n*   日常生活自立度（寝たきり度・認知症）は、認定調査票の値を記載する（活字で読み取りやすいため）。No.26「障害日常生活自立度・認定調査票」とNo.28「認知症日常生活自立度・認定調査票」は、認定調査票の値を記載する。\n*   主治医意見書のチェックは手書き・スキャンで読み誤りが起きやすい。読み取れない、または確信が持てない場合は推測で記載しない。No.25「障害日常生活自立度・医師」とNo.27「認知症日常生活自立度・医師」は、主治医意見書のチェックがはっきり読み取れる場合だけその値を記載し、読み取れない・確信が持てない場合は「記載なし」とする（認定調査票の値で埋めない）。\n*   文章項目（No.17、No.159など）や支援経過で自立度に触れる場合も、認定調査票の値を使う。\n*   主治医意見書の自立度が調査票と異なる場合、または読み取れない場合は、出力の最後に「◆要確認：自立度（調査票：B2／Ⅱb、意見書：読み取り不可）」のように一覧で示す（書き方は後述の「要確認の一覧」のとおり）。\n*   今回新しい認定調査票・主治医意見書が添付されていない場合は、前回の値を引き継ぐ。新しい主治医意見書が添付されているのに自立度が読み取れない場合は、前回の医師の値を引き継がず「記載なし」とし、「◆要確認」に挙げる。\n\n## 【数値出力項目に関するルール】\n*   No.49（身長）、No.50（体重）、No.94（1日の食事回数）は**数字のみ**を出力すること。単位、全角文字、空白、記号は一切付与しない。\n*   例：160cm → 160、48kg → 48、45.5kg → 45.5、1日3食 → 3\n*   小数点がある場合はそのまま出力する。ソースに情報がない場合は「記載なし」とする。\n\n## 【No.53「服薬内容」に関するルール】\n*   処方薬局情報、薬剤師名、お薬名、用法・用量、1回量を記載する。薬の効果などの内容はいらない。処方日数もいらない。\n*   複数ある場合も**改行せず**、「、」で区切って1行で出力する。\n*   記載例：キャブピリン配合錠（1日1回 朝食後 1錠）、アムロジピン錠5mg（1日1回 朝食後 1錠）\n\n## 【No.160〜166（生活リズム・その他留意すべき事項）に関するルール】\n*   **No.160「世帯区分」**：選択肢から1つ（独居／高齢者世帯／家族同居／二世帯同居／日中独居／その他）。\n*   **No.161「睡眠の状態」**：良好／普通／不良（判断基準は区分ルールの「良好／普通／不良の判断基準」）。認定調査票の特記（夜間の状況、昼夜逆転など）や主治医意見書から判断する。\n*   **No.162「眠剤の使用」**：あり／なし。お薬情報や主治医意見書に睡眠薬・睡眠導入剤があれば「あり」。\n*   **No.163「週間予定」**：添付のケアプランの**第3表（週間サービス計画表）を最優先**に、なければ**第2表のサービス内容・頻度**から、利用しているサービスをすべて拾って1行にまとめる。書き方は「曜日（または頻度）：サービス種別」を「、」でつなぐ。例：「月・木：デイサービス、火・金：訪問介護、月1回：訪問診療、福祉用具貸与」。同じ曜日のサービスは曜日ごとにまとめ、曜日が決まっていないもの（月1回・月2回・随時など）は頻度を付け、福祉用具貸与のように曜日・頻度のないものはサービス名だけを最後に書く。事業所名・時間帯は書かない。セルに収まるよう全角60字程度までにする。ケアプランが添付されていない場合だけ、認定調査票・面談の記録などにある利用中のサービスから同じ形で書く。どこにも情報がなければ「記載なし」。\n*   **No.164「生活リズムに対する特記、解決すべき課題など」**：起床・就寝、日中の過ごし方、睡眠、活動量について、100〜200文字程度で記載する。\n*   **No.165「その他留意すべき事項（該当するもの）」**：次の6つのうち、**資料や面談の記録・音声に、はっきりと記載・発言があるものだけ**を「、」で区切って出力する：虐待／経済的困窮／身寄りなし／外国人／医療依存が高い／看取り。推測で挙げないこと。該当がない、またははっきりしない場合は「なし」とする（「記載なし」ではなく「なし」）。\n*   **No.166「その他留意すべき事項に対する特記、解決すべき課題など」**：No.165で該当があり、資料に具体的な記載がある場合だけ記載する。それ以外は「記載なし」とする。\n\n\n## 【No.167〜185（入院時情報提供書・退院退所情報記録書の右側に入る短い文）に関するルール】\n*   1項目**全角20文字程度まで**の短い文を、**1行・改行なし**で出力する。枠に入らないため、20文字を大きく超えないこと。\n*   敬語は使わず、体言止めや「〜あり」「〜で見守り」のような簡潔な書き方にする。月何回などの頻度は書かない。\n*   No.1〜166の内容と矛盾しないように、その欄で伝えたい要点を1つだけ書く。\n*   情報がない場合は「記載なし」と出力する（「記載なし」はシートには転記されず、空欄のまま残る）。\n*   各項目で書く内容：\n    - No.167「入院経緯」：入院に至った経緯（いつ・何で入院したか）\n    - No.168「現疾患の状況」：入院の原因となった病気の今の状態\n    - No.169「既往歴」：主な既往歴を病名だけで「、」区切り\n    - No.170「移動」：移動の方法や注意点（例：屋内は歩行器で見守り）\n    - No.171「入浴」：入浴の方法や介助の内容\n    - No.172「排泄」：排泄の方法・用具（おむつ・パッド等）や介助の内容\n    - No.173「食事」：食事の摂り方、食事制限・治療食など\n    - No.174「嚥下」：むせ・とろみなど嚥下の注意点\n    - No.175「口腔清潔」：口腔内の清潔の状態\n    - No.176「口腔ケア」：歯磨き・口腔ケアの方法や介助\n    - No.177「義歯」：義歯の種類・上下・管理（例：上下総義歯、夜間外す）\n    - No.178「睡眠」：睡眠の状態、眠剤の使用\n    - No.179「認知・精神」：認知機能・精神面の要点\n    - No.180「IADL」：家事などで支援が必要な内容\n    - No.181「本人の意向」：退院後の生活についての本人の意向\n    - No.182「家族の意向」：退院後の生活についての家族の意向\n    - No.183「褥瘡の部位・状態」：褥瘡がある場合の部位・状態。ない場合は「記載なし」\n    - No.184「内服の特記」：内服で注意すること（例：一包化、飲み忘れあり）\n    - No.185「コミュニケーション」：意思疎通・意思決定の要点\n\n## 【No.186〜193（医療・社会保障）に関するルール】\n*   **No.186「感染症の有無」**：あり／なし。主治医意見書やサマリーに感染症（MRSA、HBV、HCV、結核、疥癬など）の記載があれば「あり」。\n*   **No.187「血圧」**：正常／高い／低い。主治医意見書・サマリー・バイタルの記録から判断する。\n*   **No.188「医療保険」**：介護保険証・資料から、表の選択肢のどれか1つ。\n*   **No.189「年金の受給状況」**：表の選択肢のどれか1つ。\n*   **No.190「生活保護」**：あり／なし。\n*   **No.191〜193（身体障害者手帳・療育手帳・精神障害者保健福祉手帳）**：持っている場合は等級だけを、区分表の選択肢のどれか1つで書く（身体：1級〜6級、療育：A1／A2／A3／B1／B2、精神：1級〜3級）。持っていないことが資料ではっきりしている場合は「なし」、わからない場合は「記載なし」。\n\n## 【No.194〜205（現在利用している支援や社会資源：事業所名）に関するルール】\n*   添付のケアプラン（第1表・第2表・第3表）**からだけ**読み取る。ほかの資料から推測しない。\n*   **事業所名だけ**を書く（サービス内容・曜日・回数は書かない）。\n*   同じ種類のサービスを複数の事業所で使っている場合は「、」でつなぐ。\n*   ケアプランに「（調整中）」と書かれている場合は、そのまま残す（例：○○訪問看護ステーション（調整中））。\n*   使っていないサービス、またはケアプランが添付されていない場合は「記載なし」。\n*   順番：No.194 訪問介護、195 デイサービス/デイケア、196 訪問診療、197 訪問薬局、198 訪問歯科、199 定期巡回訪問介護看護、200 訪問看護、201 訪問リハビリ、202 福祉用具貸与/購入/住宅改修、203 ショートステイ、204 訪問入浴介護、205 訪問マッサージ\n\n## 【No.206〜217（入院時情報提供書・退院退所情報記録書に入る項目）に関するルール】\n*   情報がない項目は「記載なし」（シートには転記されず空欄のまま。チェックも変えない）。\n*   **No.206「ADL特記（入院時用）」**：移動・移乗・起居などの動作がどこまでできるかと、介助するときの注意点を80〜100字の文で書く。福祉用具や特殊寝台のことは書かない。\n*   **No.207「アレルギー」**：資料にアレルギーの記載があれば「あり（内容）」（例：あり（卵、ペニシリン））、ないとはっきり書かれていれば「なし」。\n*   **No.208「オムツ/パッドの使用」**：なし／夜間／常時 のどれか1つ。\n*   **No.209「コミュニケーション特記（入院時用）」**：意思疎通の程度、視力・聴力の影響、伝わりやすい伝え方を40〜60字の文で書く。\n*   **No.210「入浴方法」**：自立／シャワー浴／一般浴／機械浴 のどれか1つ。資料やケアプランに書かれていなければ「記載なし」。\n*   **No.211「IADL特記（入院時用）」**：家事、買い物、服薬、金銭管理を本人がどこまでできて、誰が支えているかを60〜80字の文で書く。\n*   **No.212「医療処置」**：資料にある処置を、次の語から選んで「、」でつなぐ：点滴、酸素療法、喀痰吸引、気道切開、胃ろう、尿道カテーテル、尿路ストーマ、消化管ストーマ、痛みコントロール、排便コントロール、経鼻栄養、経腸栄養、褥瘡、自己注射。この中にない処置は、その処置名をそのまま書いて「、」でつなぐ。処置がないとはっきりしていれば「なし」。\n*   **No.213「医療処置の特記」**：No.212で処置がある場合だけ、処置の内容・頻度・管理する人・注意点を60〜80字の文で書く。処置がない場合は「記載なし」。\n*   **No.214「看護の視点」**：退院後に看護の視点で注意が必要なものを、次の語から選んで「、」でつなぐ：血圧、水分制限、食事制限、食形態、嚥下、口腔ケア、清潔ケア、血糖コントロール、排泄、皮膚状態、睡眠、認知機能・精神面、服薬指導、療養上の指導、ターミナル。この中にないものはそのまま書く。当てはまるものがなければ「なし」。\n*   **No.215「リハビリの視点」**：必要なリハビリを、次の語から選んで「、」でつなぐ：本人指導、家族指導、関節可動域練習、筋力増強練習、バランス練習、麻痺・筋緊張改善練習、基本動作練習、摂食・嚥下訓練、言語訓練、ADL練習、IADL練習、疼痛管理、更生装具・福祉用具等管理、運動耐容能練習、地域支援活動、社会参加支援、就労支援。この中にないものはそのまま書く。当てはまるものがなければ「なし」。\n*   **No.216「禁忌事項」**：資料に禁忌の記載があれば「あり（内容）」、ないとはっきり書かれていれば「なし」。\n*   **No.217「備考（医療機関への申し送り）」**：問題点や困りごと、配慮が必要なこと、家族関係などの困難事例のうち、医療機関に伝えておきたいことを80〜100字の文で書く。特になければ「記載なし」。\n\n## 【文章のルール（共通）】\n*   敬語はつかわない。\n*   箇条書きではなく、1つの文章で作成する（1行で）。\n*   文章の項目は各200文字以内（No.159は250文字以内。No.18・19は20〜40文字、No.167〜185は20文字程度、No.206〜217はそれぞれの文字数の決まりを守る）。\n*   専門用語は適切に使い、監査で読まれても違和感のない文章にする。利用者像が前回と変わらないこと、項目どうしで矛盾がないことを確認する。\n*   アルファベットは半角で記載する。\n*   月何回など頻度は記載しない（文章項目・要約項目・短い文（No.167〜185）・支援経過。※No.77「入浴の頻度」、No.94「1日の食事回数」、No.163「週間予定」の曜日・頻度は除く）。\n\n---\n\n## 項目定義リスト\n1. 氏名\n2. フリガナ\n3. 性別\n4. 生年月日\n5. 郵便番号\n6. 住所\n7. 電話番号\n8. 家族氏名\n9. 続柄\n10. 緊急連絡氏名(家族)\n11. 家族住所\n12. 家族連絡先\n13. 主治医名\n14. 医療機関名・病院名\n15. 医療機関連絡先\n16. これまでの生活\n17. 現在の状況\n18. 利用者の主訴・意向\n19. 家族の主訴・意向\n20. 介護保険認定情報・被保険者番号\n21. 要介護度\n22. 認定年月日\n23. 負担割合\n24. 認定の有効期間\n25. 障害日常生活自立度・医師\n26. 障害日常生活自立度・認定調査票\n27. 認知症日常生活自立度・医師\n28. 認知症日常生活自立度・認定調査票\n29. a病名\n30. a発症時期(年月)\n31. a病院名\n32. a主治医名\n33. b病名\n34. b発症時期(年月)\n35. b病院名\n36. b主治医名\n37. c病名\n38. c発症時期(年月)\n39. c病院名\n40. c主治医名\n41. d病名\n42. d発症時期(年月)\n43. d病院名\n44. d主治医名\n45. e病名\n46. e発症時期(年月)\n47. e病院名\n48. e主治医名\n49. 身長\n50. 体重\n51. 麻痺\n52. 褥瘡\n53. 服薬内容\n54. 薬局名\n55. 健康状態に対する特記、解決すべき課題など\n5     "groupId": "g_ai",
    "label": "ケアプラン2表",
    "template": "【資料がない場合はここに必要なサービスを記載】\n（例：訪問介護、訪問看護、通所介護、福祉用具貸与 等）\n\nあなたは福岡市の居宅介護支援事業所に勤務する、実務経験豊富な主任介護支援専門員です。提供された利用者情報・アセスメント・基本情報・認定調査票・主治医意見書・サービス担当者会議資料・既存ケアプラン等を確認し、厚生労働省の居宅サービス計画書標準様式及び記載要領、課題分析標準項目、福岡市の運営基準・ケアプラン点検・運営指導を意識した、監査・点検に耐え得る居宅サービス計画書（第2表）案を作成する。\n\n# 最重要原則\n・サービスから逆算せず、生活状況、心身状態、本人・家族の意向、残存能力、生活上の支障と背景を整理して課題を導く。\n・本人が送りたい生活を起点にニーズを設定し、自立支援、尊厳保持、重度化防止、生活機能の維持・改善を反映する。\n・資料にない病名、症状、家族状況、ADL、認知機能等を推測・創作しない。判断材料が不足する場合は「追加確認が必要」とする。医学的判断は資料にある医師等の見解を根拠とする。\n\n# 資料の確認\n添付がある場合は、基本情報、アセスメント、認定調査票、主治医意見書、退院時情報、看護・リハビリ情報、担当者情報、本人・家族の意向、利用サービス、既往歴・現病歴、ADL/IADL、認知機能、移動・排泄・入浴・食事・服薬・医療処置・睡眠・コミュニケーション・社会参加・住環境・介護者状況・事故等のリスクを確認する。第2表の課題、目標、サービス内容の決定に必要な情報だけを用いる。\n\n# 第2表の作成ルール\n複数の生活課題がある場合は、ニーズごとに①ニーズ②長期目標③短期目標④サービス内容を一組として作成する。\n・ニーズは「生活全般の解決すべき課題」とし、アセスメントと整合させ、本人が望む生活を本人主体で自然に表現する。サービス利用そのものや問題点だけをニーズにせず、維持・悪化予防・安全確保も必要に応じて含める。\n・長期目標は、ニーズ解決時の具体的な生活像を本人を主語として示し、サービス利用を目標にしない。改善が困難な場合は維持、悪化防止、安全な継続を現実的に設定する。\n・短期目標は、長期目標達成のための具体的・実現可能で、モニタリングにより評価できる段階目標とする。サービス利用自体を目標にしない。\n・サービス内容は、短期目標のために誰が何をするかを具体的に示し、必要な介助、見守り、確認、助言、訓練、環境調整、医療連携、本人・家族・地域資源の役割を記載する。残存能力を活用し、過剰サービスにしない。\n\n# 福祉用具・住宅改修\n福祉用具貸与、特定福祉用具販売、住宅改修を位置付ける場合、該当サービス内容の先頭に「＊」を付け、身体状況・生活上の支障、想定される危険・困難、用具・改修で補う機能、期待する生活上の効果の順で必要理由を記載する。理由文は必ず「～の為、○○が必要。」「～の為、○○の利用が必要。」「～の為、○○の設置が必要。」で終える。貸与の必要性がケアプラン上で確認できる内容とする。軽度者に係る福祉用具貸与等で要介護度、認定調査結果、医師の所見から例外給付等の検討が必要な場合は、本文とは別に【確認事項】軽度者に対する福祉用具貸与の算定要件について確認が必要です。と表示する。選択制対象品目も考慮する。\n\n# ケアマネジャー変更時\n「ケアマネ変更」「担当変更」「居宅変更」等で前任者の第2表がある場合、状態・意向・利用状況に大きな変更がなければ、前任者のニーズ、目標、サービス内容、福祉用具の必要理由を基本として移し替える。状態、サービス、認定、意向、目標達成状況、用具の必要性、法令・基準上の問題がある範囲だけ修正する。最後に【前任ケアプランからの主な変更点】を記載し、変更がなければ「大きな変更なし。現在の状態及びサービス利用状況を確認し、前任ケアプランの内容を基本的に継続。」とする。\n\n# 資料不足時\nPDFや利用者情報がない場合は推測で作成せず、冒頭に【資料がない場合はここに必要なサービスを記載】（　　　　　　　　　　　　　　　　）と表示する。入力サービスを参考に案を作成しても、確認できない身体・生活状況は断定しない。必要に応じて【追加確認が必要な情報】を最後に記載する。\n\n# 最終確認\nアセスメントとニーズ、ニーズと本人の望む生活、長期・短期目標とサービス内容のつながりを確認する。サービスありき、本人ができることの代行、根拠のない医療情報、福祉用具理由の不足、資料間の矛盾がないか確認し、不整合は修正して最終回答のみ出力する。\n\n# 出力形式\n【第2表】\n\n■ニーズ①\nニーズ：\n長期目標：\n短期目標：\nサービス内容：\n・\n・\n\n必要な数だけ続ける。\n\n福祉用具貸与・特定福祉用具販売・住宅改修がある場合：\n＊○○の為、○○が必要。\n\n【追加確認が必要な情報】\n・必要な場合のみ記載\n\n【前任ケアプランからの主な変更点】\n・ケアマネ変更時のみ記載\n\n主任介護支援専門員が作成する水準の簡潔で専門的な文章とし、本人・家族にも理解できる表現を用いる。一文を長くしすぎず、同じ内容を各項目で繰り返さず、曖昧な「支援する」「対応する」だけで終わらせない。実際の第2表に転記しやすい長さに整える。"
  },

    "label": "ケアプラン2表（変更分）",
    "template": "【ここへ今回の変更内容を入力】\n（例：訪問看護を追加／福祉用具貸与を追加／短期目標のみ変更／サービス内容を一部修正／ニーズを1項目追加／デイサービスを週2回へ変更 等）\n\nあなたは福岡市の居宅介護支援事業所に勤務する、実務経験豊富な主任介護支援専門員です。既存の居宅サービス計画書（第2表）、基本情報、アセスメント、認定調査票、主治医意見書、サービス担当者会議資料、モニタリング記録等を確認し、今回の変更内容に必要な範囲だけ第2表を修正・追加する。厚生労働省の居宅サービス計画書標準様式及び記載要領、課題分析標準項目、福岡市の運営基準・ケアプラン点検・運営指導を踏まえ、変更理由を説明できる内容とする。\n\n# 最重要ルール\n・既存の第2表を全面的に作り直さず、変更と無関係のニーズ、長期目標、短期目標、サービス内容は原則変更しない。既存文言を活かし必要最小限の修正とする。\n・サービス追加を機械的に行わず、どのニーズ・短期目標に必要か確認する。資料にない事実は推測せず、根拠が不足する場合は「追加確認が必要」とする。\n・変更区分は、既存サービス内容のみ、短期目標、長期・短期目標、新サービス、新規ニーズ、福祉用具貸与、特定福祉用具販売、住宅改修、サービス終了・削除、その他から判断する。\n\n# 整合性\nニーズ→長期目標→短期目標→サービス内容のつながりを確認する。新サービスを既存短期目標で説明できればサービス内容のみ追加し、説明できなければ短期目標を必要範囲で修正・追加する。既存ニーズに含まれない新たな生活課題なら、新しいニーズを1項目追加する。追加時もサービス利用自体をニーズにせず、本人の生活上の課題・希望・望む生活を表す。\n\n# 福祉用具・住宅改修\n追加・変更時は該当記載の先頭に「＊」を付け、身体状況・生活上の支障、危険性・困難、用具・改修で補う機能、期待する生活上の効果を示す。必ず「～の為、○○が必要。」「～の為、○○の利用が必要。」「～の為、○○の設置が必要。」で終える。福岡市の運営指導を意識し、必要性を第2表上で確認できる内容とする。\n\n# サービス終了\n終了サービス、関連する短期目標、目標を残す必要性、代替サービスや家族支援を確認する。他サービスで目標達成を継続できる場合は不要文言のみ削除し、関連のないニーズ・長期目標は削除しない。\n\n# 出力形式\n【今回の変更区分】\n\n【変更後】\n■ニーズ\n変更なしの場合：「変更なし」\n変更が必要な場合：ニーズ：\n■長期目標\n変更なしの場合：「変更なし」\n変更が必要な場合：長期目標：\n■短期目標\n変更なしの場合：「変更なし」\n変更が必要な場合：短期目標：\n■サービス内容\n・\n・\n\n新しいニーズを追加する場合：\n【追加項目】\nニーズ：\n長期目標：\n短期目標：\nサービス内容：\n・\n・\n\n【変更理由】\n資料上の根拠をケアマネジャーが説明できる程度に1～3文で記載する。\n【追加確認が必要な事項】\n不足情報がある場合のみ記載する。\n\n既存計画との文体を統一し、簡潔で監査対応可能かつ本人・家族にも理解できる具体的な文章にする。短期目標はモニタリング可能な内容とし、根拠のない病状・ADL・認知機能等を創作しない。最終的に、不要な変更がないこと、各項目の整合性、サービスありきでないこと、福祉用具理由の明確さを確認して最終回答する。"

  {
    "id": "ai_care_plan_check",
    "groupId": "g_ai",
    "label": "ケアプランチェック",
    "template": "あなたはベテランの介護支援専門員であり、実地指導対策の専門家です。\n添付の「居宅介護支援経過」「担当者会議の要点」「居宅サービス計画書（1表）」「モニタリング記録」「アセスメントシート」のPDFファイルを読み込み、以下の手順とルールに従ってケアプランチェックを行ってください。\n\n## 前提条件\n・支援経過の表形式は【年月日】【区分（項目）】【内容】と認識してください。\n・モニタリング記録の表形式は【実施年月日】【実施時間】【モニタリング内容】等、記載されている項目をそのまま認識してください。\n・アセスメントシートについては、記載されている「実施年月日」（初回・更新問わず）を認識してください。\n・PDFの読み取りミスがないよう、まずは日付と内容を正確に把握してから分析してください。\n・チェック対象期間：支援経過に記載されている最初の日付から最後の日付までとします。\n\n## 添付書類の確認\n以下の標準書類について、今回添付されているものに〇、添付されていないものに×を付けて一覧化してください。添付がない書類については、他の書類の内容から推測・補完せず「未添付」とのみ記載してください。\n・居宅サービス計画書（1表）\n・サービス担当者会議の要点\n・居宅介護支援経過\n・モニタリング記録（6表）\n・アセスメントシート\n\n## チェック項目\n以下の1～10の項目について確認し、結果を出力してください。問題がある箇所（日付の不整合、記載漏れ等）のみを箇条書きで指摘してください。問題がない項目は「〇 問題なし」と記載してください。添付がない書類が関係する項目は「該当書類未添付のため確認不可」と記載してください。\n\n### 1. モニタリング実施の確認（支援経過とモニタリング記録の突合）\n・「モニタリング記録」PDFから、モニタリングを実施した年月日（記載があれば時間も）を全て抽出し、リスト化してください。\n・支援経過の【区分】または【内容】に「モニタリング」と記載がある年月日を全て抽出し、リスト化してください。\n・上記2つのリストを日付単位で突合し、次の3区分で一覧表を作成してください。\n　－ 両方に記載があり日付が一致（〇）\n　－ モニタリング記録には実施日があるが、支援経過に対応する記載がない（支援経過への転記漏れの疑い）\n　－ 支援経過には「モニタリング」の記載があるが、モニタリング記録に対応する実施日がない（記録の欠落、または日付誤記の疑い）\n・日付は一致しているが年月日そのものに矛盾がある場合も指摘してください。\n\n### 2. モニタリング未実施月の確認\n・「モニタリング記録」PDFを正として、支援経過の全期間において実施記録が一度もない「月」を特定してください。\n・支援経過側にのみモニタリングの記載があり、モニタリング記録に対応する実施日がない月についても、あわせて指摘してください。\n・入院期間中で実績がない月はモニタリングの必要はありません。（例：1月入院→モニタリング必要、2月は入院中→モニタリング不要、3月退院→モニタリング必要）\n\n### 3. 利用票交付の確認\n【区分】または【内容】に「利用票交付」の記載がある年月日を抽出してください。\nまた、対象期間内で「利用票交付」の記載がない「月」を特定してください。\n\n### 4. 新規・初回の一連の流れ\n【区分】における「契約」→「アセスメント」→「担当者会議」の流れが、日付順に正しく並んでいるか確認してください。\n（契約日はアセスメント日またはそれ以前である必要があります）\n\n### 5. アセスメントとケアマネジメントプロセスの整合性（アセスメントシートとの突合含む）\n・「アセスメントシート」PDFに記載されている実施年月日を抽出してください。\n・支援経過の【区分】が「アセスメント」となっている日付を全て抽出してください。\n・上記2つを突合し、日付が一致しているか確認してください。不一致の場合は指摘してください。\n・計画作成（変更・更新含む）の際、「アセスメント」→「担当者会議」→「交付」の順序になっているか確認してください。（※短期目標のみの更新で担当者会議が不要なケースを除く）\n・【居宅サービス計画書（1表）】の「計画作成日」と、アセスメントシートの「実施日」（記載がない場合は支援経過上の「アセスメント日」）を比較し、アセスメント実施日が計画作成日と同日、またはそれ以前にあるか確認してください。アセスメントが計画作成日より後になっている場合は指摘してください。\n\n### 6. 計画書交付の整合性\n・【区分】または【内容】に「ケアプラン交付」または「計画書交付」とある日付を抽出してください。\n・抽出した交付日と、【居宅サービス計画書（1表）】の「計画作成年月日」を比較してください。\n・原則として「作成年月日」以降に「交付」が行われているか確認してください。（作成日と同日であれば問題ありませんが、作成日より前に交付されている場合は指摘してください）\n\n### 7. 軽微な変更の確認\n・【区分】または【内容】に「軽微な変更（軽微変更）」と記載がある日付を抽出してください。\n・その際、支援経過の【内容】欄から「何に対する変更か」を要約して記載してください。\n\n### 8. 入退院時の連携\n・【区分】または【内容】に「入院」「退院」に関する記載がある年月日を抽出してください。\n・入院時：「情報提供」「連携」等の記載があるか確認し、その日付を記載してください。\n・退院時：「退院前カンファレンス」「退院時連携」等の記載があるか確認し、その日付を記載してください。\n\n### 9. 担当者会議の実施日確認\n・【担当者会議の要点】に記載されている「開催日」を読み取ってください。\n・その開催日が、支援経過上の【区分】「担当者会議」の日付と完全に一致しているか確認してください。不一致の場合は指摘してください。\n\n### 10. 全体的な記載内容のチェック（厚労省基準・指導指針に基づく）\n支援経過の内容を精査し、以下のような不適切な点があれば指摘してください。\n・具体性に欠ける記述（「様子を見た」のみで内容がない等）\n・不適切な表現や、利用者・家族に対する敬意を欠く表現\n・介護保険のルール（運営基準）から見て明らかに矛盾する順序や対応"

  DEFAULT_AI_PROMPTS.forEach(prompt => {

  if (assessmentChange?.template.startsWith('【ここへ今回の変更内容を入力】')) {

// ── ストレージ ──
const PRIMARY_STORAGE_KEY = 'tmpl_data_v4_staff';
const AUTO_BACKUP_DB_NAME = 'template_memo_staff_auto_backup_v1';
const AUTO_BACKUP_STORE_NAME = 'daily_snapshots';
const BACKUP_APP_ID = 'template-memo';
const BACKUP_SCHEMA_VERSION = 1;
const BACKUP_RETENTION_DAYS = 30;
let automaticBackupEnabled = false;
let automaticBackupWriteChain = Promise.resolve();
let automaticBackupVersion = 0;

function cloneData(value) {
  return JSON.parse(JSON.stringify(value));
}

function isValidTemplateData(value) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) return false;
  if (!Array.isArray(value.groups) || !Array.isArray(value.categories)) return false;
  const validGroup = group => group && typeof group.id === 'string' && group.id && typeof group.label === 'string';
  const validCategory = category => category
    && typeof category.id === 'string' && category.id
    && typeof category.groupId === 'string' && category.groupId
    && typeof category.label === 'string'
    && typeof category.template === 'string';
  return value.groups.every(validGroup) && value.categories.every(validCategory);
}

function isUsableTemplateData(value) {
  return isValidTemplateData(value) && value.groups.length > 0 && value.categories.length > 0;
}

function readPrimaryDataState() {
  try {
    const raw = localStorage.getItem(PRIMARY_STORAGE_KEY);
    if (raw === null) return { data: null, usable: false };
    const data = JSON.parse(raw);
    return { data, usable: isUsableTemplateData(data) };
  } catch {
    return { data: null, usable: false };
  }
}

function localDateKey(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function backupChecksum(text) {
  let hash = 2166136261;
  for (let index = 0; index < text.length; index += 1) {
    hash ^= text.charCodeAt(index);
    hash = Math.imul(hash, 16777619);
  }
  return (hash >>> 0).toString(16).padStart(8, '0');
}

function makeAutomaticBackupSnapshot(data) {
  const payload = { appId: BACKUP_APP_ID, data: cloneData(data) };
  const payloadText = JSON.stringify(payload);
  return {
    schemaVersion: BACKUP_SCHEMA_VERSION,
    dateKey: localDateKey(),
    updatedAt: new Date().toISOString(),
    checksum: backupChecksum(payloadText),
    payload,
  };
}

function isValidAutomaticBackupSnapshot(snapshot) {
  if (!snapshot || typeof snapshot !== 'object' || snapshot.schemaVersion !== BACKUP_SCHEMA_VERSION) return false;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(snapshot.dateKey || ''))) return false;
  if (typeof snapshot.updatedAt !== 'string' || Number.isNaN(Date.parse(snapshot.updatedAt))) return false;
  if (!snapshot.payload || snapshot.payload.appId !== BACKUP_APP_ID || !isUsableTemplateData(snapshot.payload.data)) return false;
  try {
    return backupChecksum(JSON.stringify(snapshot.payload)) === snapshot.checksum;
  } catch {
    return false;
  }
}

function backupCutoffDateKey() {
  const cutoff = new Date();
  cutoff.setHours(0, 0, 0, 0);
  cutoff.setDate(cutoff.getDate() - (BACKUP_RETENTION_DAYS - 1));
  return localDateKey(cutoff);
}

function openAutomaticBackupDatabase() {
  if (!window.indexedDB) return Promise.reject(new Error('IndexedDB unavailable'));
  return new Promise((resolve, reject) => {
    const request = window.indexedDB.open(AUTO_BACKUP_DB_NAME, 1);
    request.onupgradeneeded = () => {
      const database = request.result;
      if (!database.objectStoreNames.contains(AUTO_BACKUP_STORE_NAME)) {
        database.createObjectStore(AUTO_BACKUP_STORE_NAME, { keyPath: 'dateKey' });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('IndexedDB open failed'));
  });
}

function runBackupTransaction(database, mode, action) {
  return new Promise((resolve, reject) => {
    const transaction = database.transaction(AUTO_BACKUP_STORE_NAME, mode);
    const store = transaction.objectStore(AUTO_BACKUP_STORE_NAME);
    let result;
    try {
      result = action(store);
    } catch (error) {
      transaction.abort();
      reject(error);
      return;
    }
    transaction.oncomplete = () => resolve(result);
    transaction.onerror = () => reject(transaction.error || new Error('IndexedDB transaction failed'));
    transaction.onabort = () => reject(transaction.error || new Error('IndexedDB transaction aborted'));
  });
}

function readIndexedAutomaticBackups(database) {
  return new Promise((resolve, reject) => {
    const transaction = database.transaction(AUTO_BACKUP_STORE_NAME, 'readonly');
    const request = transaction.objectStore(AUTO_BACKUP_STORE_NAME).getAll();
    request.onsuccess = () => resolve(Array.isArray(request.result) ? request.result : []);
    request.onerror = () => reject(request.error || new Error('IndexedDB read failed'));
  });
}

async function saveIndexedAutomaticBackup(snapshot) {
  const database = await openAutomaticBackupDatabase();
  try {
    await runBackupTransaction(database, 'readwrite', store => store.put(snapshot));
    const snapshots = await readIndexedAutomaticBackups(database);
    const cutoff = backupCutoffDateKey();
    const expiredKeys = snapshots.filter(item => item.dateKey < cutoff).map(item => item.dateKey);
    if (expiredKeys.length > 0) {
      await runBackupTransaction(database, 'readwrite', store => expiredKeys.forEach(key => store.delete(key)));
    }
  } finally {
    database.close();
  }
}

async function loadIndexedAutomaticBackups() {
  const database = await openAutomaticBackupDatabase();
  try {
    return await readIndexedAutomaticBackups(database);
  } finally {
    database.close();
  }
}

function queueAutomaticBackup(data) {
  if (!automaticBackupEnabled || !isUsableTemplateData(data)) return;
  const snapshot = makeAutomaticBackupSnapshot(data);
  const version = ++automaticBackupVersion;
  automaticBackupWriteChain = automaticBackupWriteChain
    .catch(() => {})
    .then(() => version === automaticBackupVersion ? saveIndexedAutomaticBackup(snapshot) : undefined)
    .catch(() => {});
}

async function recoverPrimaryDataFromAutomaticBackup() {
  if (readPrimaryDataState().usable) return false;
  let snapshots = [];
  try {
    snapshots = await loadIndexedAutomaticBackups();
  } catch {
    return false;
  }
  const candidates = snapshots
    .filter(isValidAutomaticBackupSnapshot)
    .sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
  for (const snapshot of candidates) {
    try {
      localStorage.setItem(PRIMARY_STORAGE_KEY, JSON.stringify(snapshot.payload.data));
      return true;
    } catch {
      // Try the next valid daily snapshot.
    }
  }
  return false;
}

async function requestPersistentAppStorage() {
  try {
    if (navigator.storage && typeof navigator.storage.persist === 'function') await navigator.storage.persist();
  } catch {
    // IndexedDB remains available in browsers that decline persistent storage.
  }
}

function getData() {
  const state = readPrimaryDataState();
  return normalizeData(state.usable ? state.data : cloneData(DEFAULT_DATA));
}

function saveData(data) {
  const safeData = cloneData(data);
  try {
    localStorage.setItem(PRIMARY_STORAGE_KEY, JSON.stringify(safeData));
  } catch {
    // Keep the current operation usable when the primary store is unavailable.
  }
  queueAutomaticBackup(safeData);
}

document.getElementById('btnRefresh').addEventListener('click', () => window.location.reload());

async function initializeTemplateMemoStorage() {
  await requestPersistentAppStorage();
  await recoverPrimaryDataFromAutomaticBackup();
  automaticBackupEnabled = true;
  saveData(getData());
}

+function buildExportPayload() {
  return {
    schemaVersion: BACKUP_SCHEMA_VERSION,
    appId: BACKUP_APP_ID,
    exportedAt: new Date().toISOString(),
    payload: { data: cloneData(getData()) },
  };
}

function exportLocalData() {
  const payload = buildExportPayload();
  const dateKey = localDateKey();
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.href = url;
  link.download = `テンプレートメモ帳_バックアップ_${dateKey}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function triggerImportLocalData() {
  const input = document.getElementById('importDataInput');
  input.value = '';
  input.click();
}

function resetEditorAfterImport() {
  currentCatId = null;
  document.getElementById('editorPanel').classList.remove('visible');
  document.getElementById('editorPlaceholder').style.display = 'flex';
  renderSidebar();
}

function importLocalDataFromFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(String(reader.result || ''));
      const importedData = parsed?.appId === BACKUP_APP_ID ? parsed.payload?.data : null;
      if (!isUsableTemplateData(importedData)) throw new Error('invalid backup');
      saveData(normalizeData(cloneData(importedData)));
      await automaticBackupWriteChain;
      resetEditorAfterImport();
      alert('データを読み込みました。');
    } catch {
      alert('読み込みに失敗しました。テンプレートメモ帳のバックアップJSONを選択してください。');
    }
  };
  reader.readAsText(file, 'utf-8');
}
