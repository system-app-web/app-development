[package]
name = "desktop-memo"
version = "0.1.0"
description = "デスクトップメモ"
authors = ["you"]
edition = "2021"

[lib]
name = "desktop_memo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.0.0"